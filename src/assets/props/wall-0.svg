  <!-- Crypt wall: a crumbling ashlar wall segment, its right end fallen one course lower. Goofy pass: lopsided bricks of
       mixed sizes leaning a little, a crooked arched niche with a goofy skull peering out (one socket bigger, a gappy grin), a
       candle bent over like it's tired with a drip of wax, moss on the ledges with one tiny flower, ivy down one side, rubble
       at the foot. Flat cel, the units' ink and offset. Ground line y 80 (WALL_FOOT). -->

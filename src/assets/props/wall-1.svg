      <stop offset="0" stop-color="#05040a" stop-opacity="0.8"/>
      <stop offset="0.6" stop-color="#05040a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#05040a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="w1-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9d95b8"/>
      <stop offset="0.5" stop-color="#7d7599"/>
      <stop offset="1" stop-color="#635b80"/>
    </linearGradient>
    <linearGradient id="w1-front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a6386"/>
      <stop offset="0.55" stop-color="#4b4560"/>
      <stop offset="1" stop-color="#38334a"/>
    </linearGradient>
    <linearGradient id="w1-front2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5f587a"/>
      <stop offset="1" stop-color="#332e44"/>

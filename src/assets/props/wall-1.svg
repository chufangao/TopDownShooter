    <ellipse cx="63.6" cy="61.8" rx="1.5" ry="0.5"/><ellipse cx="26.4" cy="61.8" rx="1.1" ry="0.4"/>
  </g>
  <g fill="#8e9a6a" opacity="0.55">
    <circle cx="22" cy="66" r="0.7"/><circle cx="23.2" cy="67" r="0.45"/><circle cx="77" cy="65" r="0.6"/>
    <circle cx="44" cy="35.5" r="0.6"/><circle cx="57" cy="24" r="0.5"/><circle cx="62" cy="79" r="0.6"/>
  </g>


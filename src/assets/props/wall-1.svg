  <path d="M30.8 63 L30.8 71.4 M70.8 63 L70.8 71.4" stroke="#b3acd0" stroke-width="0.45" opacity="0.6"/>
  <!-- lower plinth front -->
  <path d="M10.4 72 L85.6 72 L85.8 83 Q85 85.2 82.4 85.2 L13.6 85.2 Q10.6 85 10.2 82.4 Z" fill="#1a1625" stroke="#0d0a12" stroke-width="1.2" stroke-linejoin="round"/>
  <g stroke="#0d0a12" stroke-width="0.6" stroke-linejoin="round">

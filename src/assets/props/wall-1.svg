  <path d="M14 83.5 L28.4 83.5 L28.4 74 M32 83.5 L50.4 83.5 L50.4 74 M54 83.5 L66.4 83.5 L68.4 81.4 L68.4 74 M72 83.5 L82 83.5 L84 82 L84 74" fill="none" stroke="#211c2e" stroke-width="0.9" opacity="0.8"/>
  <path d="M67 84.4 L69.3 81.8 L69.3 84.4 Z" fill="#1a1625"/>
  <!-- cracks on the plinth -->
  <path d="M40 72.8 L41.6 76 L40.4 78.4 L42.6 81.6 M76 76 L79 77.6 L80 81" fill="none" stroke="#151120" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M40.6 73.6 L42.2 76.1 L41 78.4 L43.2 81.4 M76.4 76.8 L79.5 78.2" fill="none" stroke="#8f88ad" stroke-width="0.35" opacity="0.7"/>
  <g fill="#2a2539"><ellipse cx="20" cy="78" rx="1" ry="0.6"/><ellipse cx="60" cy="77" rx="0.8" ry="0.5"/><ellipse cx="35" cy="81" rx="0.6" ry="0.4"/></g>


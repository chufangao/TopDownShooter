  <path d="M39 18 L41.6 16.4 M45.4 17 L48.8 13 M53 13.6 L55.6 11" stroke="#d8d2ee" stroke-width="0.5" stroke-linecap="round"/>
  <path d="M42 18.4 L44 17.8 M50 14.6 L51.6 15 M56 12.4 L57.6 12.6" stroke="#5c5578" stroke-width="0.5"/>

    <path d="M60 62.6 Q62.4 60.4 66 61.4 Q68.6 61.6 68.6 63.2 L66.8 65 Q66 63.8 64.6 65.4 Q63.6 63.8 62 64.8 Q60.8 63.8 60 62.6 Z"/>

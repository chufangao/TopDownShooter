<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Rune stele: a weathered obelisk snapped off at the top, on a stepped plinth, soulfire still in its runes, its
       broken tip lying on the plinth. Goofy pass: the stele leaning, snapped off jagged and cracked down the middle, the runes
       carved wonky (one of them a little face), the plinth blocks shifted and lopsided, two candle stubs of different heights,
       moss with one tiny flower. Flat cel, the units' ink and offset. Ground line y 80 (WALL_FOOT). -->

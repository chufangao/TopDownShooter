  <path d="M8.4 82.4 L12 81.6 M16.2 85.1 L19 84.8 M15.6 61.8 L19 61.2 M87.8 83.2 L90.2 82.9 M59.4 85.4 L61.8 85.2" stroke="#a7a0c4" stroke-width="0.6" stroke-linecap="round"/>

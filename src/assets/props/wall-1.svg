  <path d="M37.4 22 L33.4 61.6 L36.2 61.6 L39.6 20.4 Z" fill="#8f88ad" opacity="0.75"/>
  <path d="M58.6 14.6 L62.6 61.6 L59.8 61.6 L56.6 14.4 Z" fill="#2c273b" opacity="0.8"/>
  <path d="M36.4 59 L39.8 22" stroke="#c9c2e4" stroke-width="0.6" stroke-linecap="round" opacity="0.7"/>

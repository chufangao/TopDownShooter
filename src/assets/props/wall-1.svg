  <path d="M24 63 L24 57 L26 55.2 L70 55.2 L72 57 L72 63 Z" fill="url(#w1-top)" stroke="#0d0a12" stroke-width="1" stroke-linejoin="round"/>
  <path d="M25 57.4 L26.6 56.2 L33 56.2" fill="none" stroke="#c9c2e4" stroke-width="0.6" stroke-linecap="round" opacity="0.8"/>
  <path d="M23.6 63 L72.4 63 L72.4 70.4 L23.6 70.4 Z" fill="url(#w1-front2)" stroke="#0d0a12" stroke-width="1" stroke-linejoin="round"/>

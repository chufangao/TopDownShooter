  <path d="M56.2 30.8 L58.2 33 L56.6 35.4 M38.6 44.8 L41.6 46.4" fill="none" stroke="#9d95b8" stroke-width="0.35" opacity="0.7"/>
  <path d="M59.4 46 L62.2 44.8 L62.6 49.4 L60.2 49 Z" fill="#1a1625"/>
  <g fill="#2a2539"><ellipse cx="44" cy="33" rx="0.6" ry="0.4"/><ellipse cx="55" cy="51" rx="0.7" ry="0.4"/><ellipse cx="42.6" cy="54" rx="0.6" ry="0.4"/><ellipse cx="54" cy="41" rx="0.5" ry="0.3"/></g>
  <path d="M46 61 Q46.4 57 45.8 52 M52 61 Q52.4 58 52 55" fill="none" stroke="#2b263a" stroke-width="1.1" stroke-linecap="round" opacity="0.6"/>


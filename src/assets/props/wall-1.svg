  </g>
  <path d="M26 61.2 Q28 62.4 33.2 61.8 L33 63.2 Q31.8 63.4 31.6 65 Q31 63.6 29.8 63.6 Q29.2 64.6 28.8 66.4 Q28.2 64.2 27.4 63.4 Q26.4 63.4 26 62.6 Z" fill="#b7ac91" stroke="#2a2433" stroke-width="0.4" stroke-linejoin="round"/>
  <path d="M27.1 57 Q26.9 58.6 27.2 60 M30.9 59.2 L30.9 60.6" stroke="#f1ead4" stroke-width="0.45" stroke-linecap="round"/>
  <path d="M28 56.2 L28.2 54.8 M31.6 58.6 L31.4 57.6" stroke="#1a1418" stroke-width="0.5"/>
  <path d="M28.4 54 Q27.4 51.6 28.8 49.6 Q27.8 47.6 29 45.6" fill="none" stroke="#6e6688" stroke-width="0.5" stroke-linecap="round" opacity="0.45"/>


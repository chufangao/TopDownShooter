  <path d="M71.6 70.4 L84 71.6" stroke="#0d0a12" stroke-width="0.6"/>

  <!-- ===== rubble ===== -->
  <g stroke="#0d0a12" stroke-width="0.8" stroke-linejoin="round">
    <path d="M6.8 86.4 L7.8 82 L12.4 81 L15 83.6 L13.6 86.8 L9 87.4 Z" fill="#6e6688"/>
    <path d="M14.6 87.4 L15.8 84.8 L19.4 84.4 L20.4 86.8 L18 88 Z" fill="#5a5374"/>
    <path d="M13.6 64.6 L15 61.2 L19.4 60.6 L20.8 63.6 L18.6 65.6 Z" fill="#7d7599"/>
    <path d="M86.6 86.6 L87.4 82.8 L90.6 82.4 L91.2 85.8 L89 87.4 Z" fill="#625b7e"/>
    <path d="M58 87.4 L59 85 L62.2 84.8 L63.2 87.2 L60.6 88.2 Z" fill="#5a5374"/>

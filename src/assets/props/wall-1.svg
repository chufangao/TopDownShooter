    <path d="M35.4 47 Q32.4 46.6 32.4 44.2 Q35.2 44 35.4 47 Z"/>
    <path d="M37.4 41.6 Q39.4 38.8 41.6 40.4 Q40 43 37.4 41.6 Z"/>
    <path d="M33 61.2 Q30 59.8 30.6 57.6 Q33.4 58.4 33 61.2 Z"/>
  </g>
  <path d="M35.2 56.6 L33.2 54.8 M36.6 52 L39.4 52.6 M37.8 41.4 L40.8 40.6" stroke="#8fb279" stroke-width="0.35" opacity="0.8"/>

  <!-- moss on the plinth -->

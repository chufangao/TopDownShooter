    <linearGradient id="w1-front3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#78709a"/>
      <stop offset="0.6" stop-color="#554e6e"/>
      <stop offset="1" stop-color="#3f3955"/>
    </linearGradient>
    <linearGradient id="w1-obelisk" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#7a729c"/>
      <stop offset="0.45" stop-color="#5c5578"/>
      <stop offset="1" stop-color="#3b3650"/>
    </linearGradient>
    <linearGradient id="w1-break" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b0a9cc"/>
      <stop offset="1" stop-color="#7a7296"/>
    </linearGradient>
    <linearGradient id="w1-wax" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9cfb4"/>
      <stop offset="1" stop-color="#8f8670"/>

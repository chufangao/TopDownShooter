<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Rune stele: a weathered obelisk snapped off at the top, on a stepped plinth, faint soulfire still in its carved runes. Its broken tip lies on the plinth. Lit from the upper left. -->
  <defs>

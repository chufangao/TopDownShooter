<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Sarcophagus barricade: a stone coffin whose lid has been shoved aside, a skeletal hand out of the gap, old
       palisade stakes behind it and bones in the rubble. Goofy pass: a lopsided coffin, its lid slid off askew with a wonky
       sword carved on it, two eyes peering out of the dark gap, a skeletal hand poking out and waving, a goofy carved skull
       between an eye panel and an X panel, crooked stakes (one snapped), moss with one tiny flower, a little skull and bones in
       the rubble. Flat cel, the units' ink and offset. Ground line y 80 (WALL_FOOT). -->
  <defs>
    <filter id="w2-ink" x="-6%" y="-6%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#1d1427"/><feComposite in2="SourceAlpha" operator="in"/><feOffset dx="1.1" dy="1.3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
<path d="M8 81 C12 77 88 77 92 81 C90 85.6 10 85.6 8 81 Z" fill="#05040a" opacity=".45"/>

      <stop offset="1" stop-color="#3f3955"/>
    </linearGradient>
    <linearGradient id="w2-wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a604a"/>
      <stop offset="0.5" stop-color="#5a4636"/>
      <stop offset="1" stop-color="#352820"/>
    </linearGradient>
    <linearGradient id="w2-wood2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6a523f"/>
      <stop offset="1" stop-color="#2e231c"/>

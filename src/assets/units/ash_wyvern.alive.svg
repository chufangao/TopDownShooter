<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Ash Wyvern: an ash-grey wyvern hovering on broad, tattered, smouldering wings, orange seams glowing between its scales,
       legs dangling and barbed tail trailing. Goofy pass: a scrawny pot-bellied body on a long kinked goose-neck, a big beaky
       head with a matched pair of googly slit eyes on the target below, a sheepish one-fang grin
       coughing up a puff of ash; one huge raised wing with a burnt hole and a patch sewn on crooked, one smaller wing flapping
       below; spindly dangling legs with enormous clawed feet; the tail barb bent over. Drawn as before (the engine lifts it). -->

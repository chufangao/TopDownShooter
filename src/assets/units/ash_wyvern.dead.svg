<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Ash Wyvern, fallen: crashed to the ground in a scatter of ash, one wing crumpled over its body and the other snapped upright behind, its seams gone cold but for a few dying embers, a thread of smoke rising off it. -->
  <defs>
    <linearGradient id="awd-scale" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b6b0aa"/>
      <stop offset="0.5" stop-color="#7a7472"/>
      <stop offset="1" stop-color="#3e3a3c"/>
    </linearGradient>
    <linearGradient id="awd-head" x1="0.1" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#c0bab4"/>
      <stop offset="0.5" stop-color="#827c78"/>
      <stop offset="1" stop-color="#3e3a3c"/>
    </linearGradient>
    <linearGradient id="awd-belly" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#d4cec4"/>
      <stop offset="0.55" stop-color="#a39b90"/>
      <stop offset="1" stop-color="#6c635c"/>
    </linearGradient>
    <linearGradient id="awd-wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7e7470"/>
      <stop offset="0.55" stop-color="#4e4648"/>
      <stop offset="1" stop-color="#262124"/>
    </linearGradient>
    <linearGradient id="awd-wing-far" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a4244"/>
      <stop offset="1" stop-color="#1a161a"/>
    </linearGradient>
    <linearGradient id="awd-horn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ddd4c4"/>
      <stop offset="0.5" stop-color="#a89c88"/>
      <stop offset="1" stop-color="#544a3e"/>
    </linearGradient>
    <radialGradient id="awd-ash" cx="0.45" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#9a949a"/>
      <stop offset="0.6" stop-color="#77717a"/>
      <stop offset="1" stop-color="#55505a"/>
    </radialGradient>
    <radialGradient id="awd-smoke" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9a94a2" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#9a94a2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="awd-ember" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8a3d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="awd-shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0d0a12" stop-opacity="0.5"/>
      <stop offset="0.65" stop-color="#0d0a12" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#0d0a12" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- soft ground shadow, and the scatter of ash thrown up by the crash -->
  <ellipse cx="48" cy="88.4" rx="44" ry="5.4" fill="url(#awd-shadow)"/>

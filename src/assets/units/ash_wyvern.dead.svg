  <path d="M17.6 55 C16.8 58 15.6 60 14.2 61.2 M13 66.4 C14.8 69.6 15.2 72.6 14.8 74.8 M17 78.4 C20 79.2 22.4 80.2 23.8 81.2" fill="none" stroke="#6a5c58" stroke-width="0.5" stroke-linecap="round"/>
  <ellipse cx="14.6" cy="72" rx="1.8" ry="1.8" fill="url(#awd-ember)"/>
  <circle cx="14.7" cy="72" r="0.35" fill="#d4561e"/>
  <!-- finger bones: one bent, one snapped at the knuckle -->
  <path d="M38 50 Q28 48 18 54 M38 50 L24 57 L12 66 M38 50 Q26 64 16 78 M38 50 Q34 68 28 82" fill="none" stroke="#0d0a12" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M38 50 Q28 48 18 54 M38 50 L24 57 L12 66 M38 50 Q26 64 16 78 M38 50 Q34 68 28 82" fill="none" stroke="#968e88" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M36 49.4 Q28 48.4 21 52" fill="none" stroke="#e2dcd6" stroke-width="0.4" stroke-linecap="round"/>
  <path d="M24 57 l0.8 -0.9 l0.5 0.8 l0.9 -0.6" fill="none" stroke="#e6dcc8" stroke-width="0.45" stroke-linejoin="round"/>
  <path d="M18.6 53.4 L16.4 52.8 L17.6 55 Z M12.6 65.4 L10.6 66 L12.4 67.2 Z M16.4 77.4 L14.6 79 L16.8 79 Z M28.6 81.4 L27.8 83.6 L29.6 82.6 Z" fill="url(#awd-horn)" stroke="#0d0a12" stroke-width="0.4" stroke-linejoin="round"/>
  <!-- arm, folded back on itself -->
  <path d="M44 70 L52 56 L38 50" fill="none" stroke="#0d0a12" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M44 70 L52 56 L38 50" fill="none" stroke="#968e88" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M43 68.4 L50.4 56 L39 51" fill="none" stroke="#e2dcd6" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="52" cy="56" r="1.8" fill="#8a827c" stroke="#0d0a12" stroke-width="0.6"/>
  <circle cx="51.5" cy="55.4" r="0.5" fill="#e2dcd6"/>
  <path d="M53.4 55 L55.6 53.6 L55 55.8 Z" fill="url(#awd-horn)" stroke="#0d0a12" stroke-width="0.35"/>
  <path d="M38.4 50 Q37.6 45.8 40.4 43.6 Q40 46.8 41 49.4 Z" fill="url(#awd-horn)" stroke="#0d0a12" stroke-width="0.7" stroke-linejoin="round"/>
  <circle cx="38" cy="50" r="1.6" fill="#968e88" stroke="#0d0a12" stroke-width="0.6"/>
  <ellipse cx="44.2" cy="70.2" rx="3" ry="2.4" fill="url(#awd-scale)" stroke="#0d0a12" stroke-width="0.8"/>

  <!-- ===== a thread of smoke rising off the wreck ===== -->
  <ellipse cx="44" cy="30" rx="7" ry="9" fill="url(#awd-smoke)"/>
  <g fill="none" stroke-linecap="round">
    <path d="M47 62 C44 57 48.6 53 46 48 C43.6 43.4 47.6 39.6 45.4 34.6 C43.6 30.6 46.4 27 44.4 22.6 C43 19.6 44.6 16.4 47 15.6" stroke="#8e8896" stroke-width="1.4" opacity="0.4"/>
    <path d="M47 62 C44.2 57.2 48.8 53.2 46.2 48.2 C43.8 43.6 47.8 39.8 45.6 34.8" stroke="#d2ccd4" stroke-width="0.45" opacity="0.5"/>
  </g>

  <!-- ===== dying embers and ash in the scatter ===== -->
  <g fill="#8a848c" stroke="#0d0a12" stroke-width="0.35">
    <ellipse cx="8.6" cy="91" rx="2" ry="1"/><ellipse cx="62" cy="92" rx="1.8" ry="0.8"/><ellipse cx="91" cy="88.4" rx="1.6" ry="0.9"/>
    <ellipse cx="74" cy="91.2" rx="1.4" ry="0.7"/><ellipse cx="30" cy="91.4" rx="1.2" ry="0.6"/>
  </g>
  <path d="M8 90.6 Q8.6 90 9.6 90.2 M90.4 88 Q91 87.6 91.8 87.8 M61.2 91.6 Q62 91.2 62.8 91.4" fill="none" stroke="#c4bec6" stroke-width="0.4"/>
  <g fill="#3a3036" stroke="#0d0a12" stroke-width="0.3">
    <path d="M38 91.6 l1.2 -0.6 l0.8 0.8 l-1 0.8 Z"/><path d="M80 89.2 l1 -0.8 l1 0.6 l-0.8 1 Z"/><path d="M18 90.6 l1 -0.6 l0.8 0.8 l-0.9 0.7 Z"/>
    <path d="M68 92 l0.8 -0.6 l0.9 0.5 l-0.6 0.9 Z"/><path d="M48 92.6 l0.9 -0.5 l0.6 0.7 l-0.8 0.6 Z"/>
  </g>
  <ellipse cx="80.8" cy="89" rx="1.8" ry="1.2" fill="url(#awd-ember)"/>
  <ellipse cx="38.8" cy="91.4" rx="1.6" ry="1.1" fill="url(#awd-ember)"/>
  <g fill="#d4561e">
    <circle cx="80.8" cy="89" r="0.35"/><circle cx="38.8" cy="91.4" r="0.3"/><circle cx="18.8" cy="90.6" r="0.25" opacity="0.7"/>
  </g>
  <g fill="#5e5860">
    <circle cx="24" cy="92.6" r="0.4"/><circle cx="34" cy="92.8" r="0.3"/><circle cx="56" cy="92.8" r="0.35"/><circle cx="86" cy="90.6" r="0.3"/>
    <circle cx="12" cy="83.6" r="0.3"/><circle cx="84" cy="81.4" r="0.3"/>
  </g>
</svg>

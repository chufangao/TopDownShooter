  <path d="M57.4 87.6 Q59.6 87 59.8 85.2 M55.6 88.6 Q57.4 89.6 58.8 88.6 M53 88.4 Q53.4 90 55 90.2" fill="none" stroke="#bfb3a0" stroke-width="0.7" stroke-linecap="round"/>


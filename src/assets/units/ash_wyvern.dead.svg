<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Ash Wyvern, fallen: crashed to the ground in a scatter of ash, one wing crumpled over its body and the other snapped
       upright behind, the patch flapping loose; the goose-neck flopped, X for eyes (a matched pair), the tongue out,
       its seams gone cold but for one dying ember, a thread of smoke rising off it. Same parts, greyer. -->
  <defs>
    <filter id="awd-ink" x="-6%" y="-6%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#1d1427"/><feComposite in2="SourceAlpha" operator="in"/><feOffset dx="1.1" dy="1.3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

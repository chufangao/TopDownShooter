  <path d="M7 84.6 Q12 81.4 21 80.8 M70 80.4 Q84 81 89.4 84 M16 91.6 Q40 93.4 62 92.6" fill="none" stroke="#b4aeb4" stroke-width="0.6" opacity="0.7"/>
  <path d="M9 89.6 Q24 91.8 36 91.8 M60 91.4 Q74 91 84 89.6" fill="none" stroke="#4a454c" stroke-width="0.5" opacity="0.7"/>

  <!-- ===== far wing, snapped and jutting up behind, its torn sail hanging ===== -->
  <path fill-rule="evenodd" d="M54 68 L62 54 L70 46 L86 52 C85 55 84.6 57.6 85.4 59.6 L83.4 59.4 L87.6 62.4 C84.4 63.6 82.2 65.6 81 68 L79.6 66.6 L78.4 69.6 C74 69.4 70 70 66 71.4 Z M75 55 L77.4 55.4 L77.8 57.8 L75.6 58.4 L74.4 56.8 Z" fill="url(#awd-wing-far)" stroke="#0d0a12" stroke-width="1.1" stroke-linejoin="round"/>
  <path d="M72 58 Q76 62 78 68 M66 56 Q70 62 70 69" fill="none" stroke="#0d0a12" stroke-width="0.6" opacity="0.7"/>
  <path d="M70 46 L77.4 49 L80 47.2 L86 52 M70 46 Q80 54 87.6 62.4 M70 46 Q74 58 78.4 69.6" fill="none" stroke="#0d0a12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M70 46 L77.4 49 L80 47.2 L86 52 M70 46 Q80 54 87.6 62.4 M70 46 Q74 58 78.4 69.6" fill="none" stroke="#5e5658" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M77.4 49 l0.6 -0.8 l0.6 0.6 l0.8 -0.6" fill="none" stroke="#d8ccb8" stroke-width="0.4" stroke-linejoin="round"/>
  <path d="M54 68 L62 54 L70 46" fill="none" stroke="#0d0a12" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M54 68 L62 54 L70 46" fill="none" stroke="#5e5658" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="62" cy="54" r="1.4" fill="#544c4e" stroke="#0d0a12" stroke-width="0.5"/>
  <path d="M70.4 46 Q70.6 42 73.4 40.4 Q72.6 43.2 73 45.6 Z" fill="#7e7466" stroke="#0d0a12" stroke-width="0.6" stroke-linejoin="round"/>
  <circle cx="70" cy="46" r="1.3" fill="#544c4e" stroke="#0d0a12" stroke-width="0.5"/>
  <path d="M86.4 51.6 L88.4 51.2 L87 53 Z M88 62 L90 62.6 L88.2 63.4 Z" fill="#7e7466" stroke="#0d0a12" stroke-width="0.35" stroke-linejoin="round"/>

  <!-- ===== tail, flung out behind on the ash ===== -->
  <path d="M26 78 C20 79.6 14 82 9.4 84.4 C7.6 85.2 6.2 85.4 5 85 L5.2 87 C7.4 87.6 9.6 87.4 11.6 86.6 C16 84.8 21 83.4 27 83 Z" fill="url(#awd-scale)" stroke="#0d0a12" stroke-width="1" stroke-linejoin="round"/>
  <path d="M23.4 79.2 C18.6 80.6 14 82.6 10 84.6" fill="none" stroke="#d8d2cc" stroke-width="0.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M20.6 80 Q21.4 82 21 84.2 M16 81.8 Q16.8 83.6 16.4 85.6 M11.6 84 Q12.2 85.4 12 86.8" fill="none" stroke="#1e1416" stroke-width="0.9" stroke-linecap="round"/>
  <path d="M18.4 80.6 L17.4 78 L20.2 79.6 Z M13.6 82.6 L12.4 80.2 L15.2 81.6 Z" fill="url(#awd-horn)" stroke="#0d0a12" stroke-width="0.45" stroke-linejoin="round"/>
  <path d="M0.8 85.6 L4.6 82.4 L7.6 81 L6 84.2 L6 87.2 L7.6 90 L4.6 88.8 Z" fill="url(#awd-horn)" stroke="#0d0a12" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M1.6 85.6 L5.4 85.6" stroke="#4a2a22" stroke-width="0.5" stroke-linecap="round"/>

  <!-- ===== body, crashed on its side ===== -->
  <path d="M62 70 C64 74 63 80 58 83.6 C52 87 40 88 32 86.6 C25 85.4 22 82 22.6 78 C23.2 73.6 28 69.6 35 67.6 C44 65.2 57 65.6 62 70 Z" fill="url(#awd-scale)" stroke="#0d0a12" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M60.6 76 C58 81 50 84.6 40 85.4 C33 86 27 84.6 24 82 C25 85 28 86.4 32 86.6 C40 88 52 87 58 83.6 C61 81.4 62.4 78.6 60.6 76 Z" fill="url(#awd-belly)" stroke="#0d0a12" stroke-width="0.7" stroke-linejoin="round"/>
  <path d="M30 85.2 L29.6 86.6 M35 85.8 L34.8 87.2 M40 85.6 L40 87.2 M45 85.2 L45.2 86.8 M50 84.2 L50.4 86 M55 82.4 L55.6 84.4" fill="none" stroke="#1e1416" stroke-width="0.8" stroke-linecap="round"/>
  <!-- the seams, cold now: dark gaps with a dull red still in one or two -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M26 76.6 Q42 72 60.6 73 M34 69 Q36 72 35 75 M42 67 Q44 70.4 43.4 73.6 M50 66.6 Q52 70 51.4 73 M56.6 67.6 Q58.4 70.4 58 73.4 M30 77.4 L30.6 81 M38 75.6 L38.8 80.6 M46 74.4 L46.8 79.8 M54 74 L54.8 79" stroke="#1e1416" stroke-width="1"/>
    <path d="M42 67 Q44 70.4 43.4 73.6 M46 74.4 L46.8 79.8" stroke="#7a2e1e" stroke-width="0.4"/>
  </g>
  <path d="M29.6 70.6 Q33 68.6 38 67.4 M40 66.6 Q45 65.8 50 66" fill="none" stroke="#e2dcd6" stroke-width="0.6" stroke-linecap="round" opacity="0.8"/>
  <ellipse cx="46.4" cy="77" rx="2.4" ry="2" fill="url(#awd-ember)"/>
  <circle cx="46.4" cy="77" r="0.45" fill="#d4561e"/>
  <!-- dorsal spines along the back, some snapped -->
  <path d="M36 67.4 L35 64.6 L38 66.6 Z M42 66.2 L41.4 63.4 L44.2 65.6 Z M48.6 66 L48.4 64.4 L50.4 65.6 Z M54.6 66.6 L54.4 63.8 L57 66.4 Z" fill="url(#awd-horn)" stroke="#0d0a12" stroke-width="0.45" stroke-linejoin="round"/>

  <!-- ===== near leg, crumpled out from under the body, talons curled ===== -->
  <path d="M42 76 C47 74.6 52 76.4 53 80 C53.6 82.4 52.4 84 51 84.6 L55.6 86 C57 86 58 87 57.6 88.2 L55 88.8 L52.6 88.4 C52 87.8 52 87 52.6 86.6 L47 86.4 C43 86 40.6 83.6 40.2 80.6 C40 78.6 40.6 77 42 76 Z" fill="url(#awd-scale)" stroke="#0d0a12" stroke-width="1" stroke-linejoin="round"/>
  <path d="M43 77.2 Q47.6 75.6 51.4 77.6" fill="none" stroke="#e2dcd6" stroke-width="0.6" stroke-linecap="round" opacity="0.8"/>

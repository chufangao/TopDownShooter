  <path d="M56 68.4 C62 67.4 66.6 70 68.6 75.6 L70.4 85.6 C67 87 63.4 86 61.6 83 C60 80 58.4 77 55 75 Z" fill="url(#awd-scale)"/>
  <path d="M69.6 84 C66.8 85.4 64 84.6 62.6 82.4 L61.4 83.4 C63 86 67 87 70.4 85.6 Z" fill="url(#awd-belly)"/>
  <path d="M57.4 68.2 C62.6 67.6 66.6 70 68.6 75.6 M70.4 85.6 C67 87 63.4 86 61.6 83" fill="none" stroke="#0d0a12" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M60.4 69.4 Q62.4 73 61.6 77 M64.4 71.4 Q66.4 75 65.8 79.6" fill="none" stroke="#1e1416" stroke-width="0.9" stroke-linecap="round"/>
  <path d="M61 68 L60.6 65.4 L63.2 67.6 Z M65.4 70 L65.6 67.2 L67.6 70.2 Z" fill="url(#awd-horn)" stroke="#0d0a12" stroke-width="0.45" stroke-linejoin="round"/>

  <!-- ===== head, cheek down in the ash ===== -->
  <g transform="translate(-1 47) rotate(6 68 32)">
    <path d="M74.4 26.4 C71.6 22.6 68.4 19.6 64 18.4 C67 21 69.4 24 70.8 27.4 Z" fill="#7e7466" stroke="#0d0a12" stroke-width="0.8" stroke-linejoin="round"/>
    <path d="M72 27.4 C68 24.4 64.4 23 59.6 22.8 C63.4 24.6 66.4 27 68.8 30 Z" fill="url(#awd-horn)" stroke="#0d0a12" stroke-width="0.9" stroke-linejoin="round"/>
    <path d="M70.4 26.8 C67.2 24.8 64.2 23.8 61.2 23.4" fill="none" stroke="#f2ece0" stroke-width="0.4" stroke-linecap="round"/>
    <!-- slack jaw, the mouth dark and fireless -->
    <path d="M75 38.4 L89 36.6 Q89.6 38 88.4 38.8 L76.4 40.4 Z" fill="#2a1a1c"/>
    <path d="M73.6 38.6 L88.6 37.4 C89.6 38.4 89.4 39.8 88.2 40.4 C84.4 41.2 79.6 41.6 75.6 41.2 C73.6 41 72.6 39.4 73.6 38.6 Z" fill="url(#awd-head)" stroke="#0d0a12" stroke-width="0.9" stroke-linejoin="round"/>
    <g fill="#d8cfbe" stroke="#0d0a12" stroke-width="0.3" stroke-linejoin="round">
      <path d="M80.4 38.2 L80.8 39.6 L81.4 38.1 Z"/><path d="M85 37.8 L85.4 39 L85.8 37.7 Z"/>
    </g>
    <path d="M67.4 30.4 C69 27.4 72.6 25.6 76.4 26 C78.8 26.2 80.6 27.2 81.8 28.6 C84.8 29.6 88 31.2 90.4 32.8 C91.8 33.8 92.2 35.2 91.4 36.2 C90.6 37 89.4 37.2 88.4 37 L83 37.6 C81 38.4 78 38.8 75 38.8 C71.6 38.8 68.6 37.4 67.4 35 C66.8 33.4 66.8 31.8 67.4 30.4 Z" fill="url(#awd-head)" stroke="#0d0a12" stroke-width="1.1" stroke-linejoin="round"/>
    <path d="M69 36.4 L64.6 37.4 L68.4 38.6 L65.6 40.4 L70.6 39.4 Z" fill="url(#awd-horn)" stroke="#0d0a12" stroke-width="0.5" stroke-linejoin="round"/>
    <path d="M69 30 Q71.6 27.2 76 27.2" fill="none" stroke="#ece6de" stroke-width="0.9" stroke-linecap="round" opacity="0.85"/>
    <path d="M82 29.6 Q86.4 31.2 89.8 33.4" fill="none" stroke="#d8d2cc" stroke-width="0.6" stroke-linecap="round" opacity="0.8"/>
    <path d="M73.6 33.4 L76 34.4 M82.4 31.2 L84.6 32.6 M86 34.4 L88.4 34.8" fill="none" stroke="#1e1416" stroke-width="0.9" stroke-linecap="round"/>
    <!-- the eye shut, its ember out -->
    <path d="M75.2 29.6 Q78.4 27.6 82 29" fill="none" stroke="#0d0a12" stroke-width="0.9" stroke-linecap="round"/>
    <path d="M76.4 30.8 Q78.6 31.8 81 30.6" fill="none" stroke="#1a1012" stroke-width="0.9" stroke-linecap="round"/>
    <path d="M76.6 30 Q78.6 29.6 80.8 30" fill="none" stroke="#6a6266" stroke-width="0.35" stroke-linecap="round"/>
    <path d="M88.4 33.2 Q89.6 32.8 90 33.8 Q89.2 34.4 88.4 33.2 Z" fill="#1a1012"/>
  </g>

  <!-- ===== near wing, crumpled over the body, a finger snapped ===== -->
  <path fill-rule="evenodd" d="M44 70 L52 56 L38 50 L18 54 C17 58 15.4 60.6 13.6 61.6 L15 62.8 L12 66 C14.4 69.6 15 73 14.4 75.4 L16.4 75.8 L16 78 C19.6 78.6 22.6 80 24.4 81.6 L26 80.6 L28 82 C31 81.4 34 80.6 36.4 80 Z M24 64 L26.4 64.4 L26.8 66.8 L24.6 67.4 L23.2 65.8 Z M30 72 L32 72.2 L32.4 74.4 L30.4 74.8 L29.4 73.4 Z" fill="url(#awd-wing)" stroke="#0d0a12" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- creases where the membrane folded as it fell -->
  <path d="M36 54 Q30 60 28.6 70 M24 58 Q21.6 66 22.6 74 M42 60 Q38 66 36 76" fill="none" stroke="#1a1418" stroke-width="0.8" opacity="0.8"/>
  <path d="M36.8 54.6 Q31 60.6 29.6 70 M24.8 58.4 Q22.6 66 23.6 73.6" fill="none" stroke="#9a908a" stroke-width="0.45" opacity="0.6"/>
  <path d="M24 64 L26.4 64.4 L26.8 66.8 L24.6 67.4 L23.2 65.8 Z M30 72 L32 72.2 L32.4 74.4 L30.4 74.8 L29.4 73.4 Z" fill="none" stroke="#4a2a22" stroke-width="0.45" stroke-linejoin="round"/>

    <path d="M69 61.6c.7-1.1 3.2-2.4 4.6-2.4s3.4 1.3 4 2.4 .6 3.3-.2 4.4-3.1 2-4.4 2-2.9-.9-3.6-2-1.1-3.3-.4-4.4Z" fill="#b9aee0"/>
    <path d="M76.4 60.8c3-2.2 6.6-2.6 9.6-1.2-3.4.6-6 2-7.4 3.8Zm1.2 3.2c3.6-.4 6.8.8 9 3.4-3-.6-6-.4-8.2.4Zm-2 3c2.8 1.6 4.6 4 5 7-2-2.2-4.6-3.6-7.2-4.2Z" fill="#e8e0f6" stroke-width="1.4"/>
    <!-- the head: long and droopy, a great hooked nose, the chin sagging -->
    <path d="M41.4 30c-.3-3.3-.1-6.1 1.2-8.4s3.9-4.3 6.4-5.2 6-.9 8.6-.4 5.2 1.8 7 3.4 2.8 4.3 3.8 6 1.1 2.5 2.2 4 4.1 4 4.4 5.2-1.7 1.5-2.4 1.8-1.6-.7-2 .2 .5 3.3-.2 5.4-2.2 5.1-3.8 7-4 3.8-6 4.4-4.2.2-6-.8-3.3-3.2-5-5-3.6-3.1-5-6-2.9-8.3-3.2-11.6Z" fill="#b9aee0"/>
    <path d="M67.6 38.4c.7-.1-.2 4.6-1 6.6s-2.5 4.3-4 5.4-5 2-5 1.2 3.1-3.8 4.8-6 4.5-7.1 5.2-7.2Z" fill="#8577b8" stroke="none"/>
    <path d="M45 30c-.1-1.2.6-4.4 1.6-6s4.1-3.8 4.4-3.6-1.8 3.2-2.4 5-.6 4.8-1.2 5.6-2.3.2-2.4-1Z" fill="#ddd6f4" stroke="none"/>
    <path d="M71.2 33.4c.5-.1 2.8 1 2.8 1.4s-2.5 1-3 .8-.3-2.1.2-2.2Z" fill="#8577b8" stroke="none"/>
    <!-- deep sockets -->
    <path d="M47.8 28.4c.4-1.4 2.6-3.3 4-3.8s3.1 1 4.6 1 3.1-1.4 4.6-1.2 3.3 1.2 4.2 2.2 1.2 2.8 1 4-1 2.7-2 3.4-2.8.8-4 .6-2.1-1.8-3.2-1.8-2.1 1.8-3.4 1.8-3.2-.6-4.2-1.6-2-3.2-1.6-4.6Z" fill="#7465a8" stroke="none"/>
    <!-- googly eyes: a matched pair fixed on the living -->
    <path d="M52.4 24.8c1.2-.2 2.9 1 3.5 1.9s.7 3 .4 4-1.2 2-2.3 2.2-3.9-.8-4.8-1.6-1.1-2.4-.5-3.4 2.4-2.9 3.7-3.1Z" fill="#f4f0ff" stroke-width="1.7"/><path d="M54.2 27.6c.5-.1 1.3.4 1.6.9s.3 1.6-.1 2-1.3.9-1.8.7-1.4-1.5-1.3-2.1 1.1-1.4 1.6-1.5Z" fill="#1d1427" stroke="none"/><path d="M53.7 28.8l.6-.2" stroke="#ffffff" stroke-width="1.1"/><path d="M61 25c1.2-.2 2.9 1 3.5 1.9s.7 3 .4 4-1.2 2-2.3 2.2-3.9-.8-4.8-1.6-1.1-2.4-.5-3.4 2.4-2.9 3.7-3.1Z" fill="#f4f0ff" stroke-width="1.7"/><path d="M62.8 27.8c.5-.1 1.3.4 1.6.9s.3 1.6-.1 2-1.3.9-1.8.7-1.4-1.5-1.3-2.1 1.1-1.4 1.6-1.5Z" fill="#1d1427" stroke="none"/><path d="M62.3 29l.6-.2" stroke="#ffffff" stroke-width="1.1"/>

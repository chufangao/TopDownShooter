    <path d="M40 44.6c-3.1-.4-8.6-3.2-8.6-3.2s2.7 4.2 2.2 6.6-3.5 5.2-5 8-2.5 5.7-4 9-5.2 11-5.2 11l6-3-.8 7.4 6.8-5.4 3.2 7s3.2-6.1 5.4-8 5.3-3 8-3.4 5.6-.4 8 .8 6.4 6.6 6.4 6.6l2.2-6 6 3.6s-.6-9.7-1.2-13.6-2.4-6.7-2.4-10 2.4-9.6 2.4-9.6-6.2 3.3-9.4 3.6-6.7-1.8-10-2-6.9 1-10 .6Z" fill="#55717a"/>
    <path d="M63.6 52c.3 0 2.4 6.8 3 10s1.3 7.2.8 9-3.3 3.1-3.8 1.6 1-7.2 1-10.6-1.3-10-1-10Z" fill="#3a525b" stroke="none"/>

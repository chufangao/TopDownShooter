<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Barrow Wight: the restless ghost of an ancient barrow-king drifting over the ground in its corroded burial finery,
       a bronze sword in one hand, withering mist trailing from the other's claws. Goofy pass: a long droopy head with a great
       hooked nose and a sagging chin, a matched pair of googly eyes in deep sockets fixed on the living, a long wobbly
       frown with one snaggletooth and a scraggly beard of mist; its barrow helm a size too small, perched
       on top with a tiny spider dangling off it; spindly arms, one hand a giant claw; a curling ghost tail. Flat cel. -->
  <defs>
    <filter id="bw-ink" x="-6%" y="-6%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#1d1427"/><feComposite in2="SourceAlpha" operator="in"/><feOffset dx="1.1" dy="1.3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- withering mist off the claws, and cold mist under the tail (no ink) -->
  <path d="M76 70c1.2-1.7 4.7-5.1 7-5.4s5.8 1.6 6.6 3.4-.2 5.8-1.6 7.6-4.9 3.1-7 3-4.6-2.2-5.4-3.6-.8-3.3.4-5Z" fill="#c9a8ff" stroke="none" opacity=".6"/>
  <path d="M79 66c4.6-4.4 10-2.4 9.6 2.6-.4 3.8-5.2 4.4-6 1.4" fill="none" stroke="#e6d8ff" stroke-width="2.2" opacity=".9"/>
  <path d="M30 88c.3-.6 5-1.8 8-2s7 .2 10 .6 8.3 1.2 8 1.8-6.7 1.4-10 1.6-7.3.1-10-.2-6.3-1.2-6-1.8Z" fill="#c9c2d0" stroke="none" opacity=".5"/>
  <g filter="url(#bw-ink)" stroke="#1d1427" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">

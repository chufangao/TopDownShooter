    <path d="M64.6 15.8l.6 7.8" fill="none" stroke-width=".8"/>
    <path d="M64.9 23.5c.4-.1 1.2.1 1.5.4s.6.9.4 1.3-.7.8-1.2.9-1.2-.1-1.5-.4-.3-1.1-.1-1.4 .5-.8.9-.8Z" fill="#3d3150" stroke-width="1"/>

    <path d="M48 52l12-.6m-11.6 4.2l11.2-.6" fill="none" stroke="#5f5b6e" stroke-width="1.1"/>
    <!-- the gold torc -->
    <g fill="none"><g stroke-width="5"><path id="bw-torc" d="M46.4 47.6c4.6 3.8 11.6 4 17 .8"/></g><use href="#bw-torc" stroke="#e8b830" stroke-width="2.8"/></g>
    <path d="M46.1 45.9c.6-.1 1.4.1 1.7.5s.6 1.5.4 2-1.2 1.3-1.7 1.4-1.2-.2-1.5-.7-.6-1.7-.4-2.2 1-.9 1.5-1Z" fill="#e8b830" stroke-width="1.5"/>
    <path d="M62.9 46.1c.6 0 1.7.3 2.1.8s.7 1.5.5 2-1.3 1.2-1.9 1.3-1.6-.1-1.9-.6-.4-1.7-.2-2.3 .8-1.1 1.4-1.2Z" fill="#e8b830" stroke-width="1.5"/>

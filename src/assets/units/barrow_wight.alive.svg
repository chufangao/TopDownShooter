    <!-- back arm, the hand round the hilt -->
    <path d="M40 50c-1.2-.3-3.6 1.7-5 2.6s-3.2 1.8-3.4 2.8 1 2.9 2 3 2.6-1.7 4-2.4 4-.6 4.4-1.6-.8-4.1-2-4.4Z" fill="#b9aee0"/>
    <path d="M31.7 51.8c.9-.1 2.1.1 2.6.8s1.1 2.6.8 3.4-1.2 1.4-2.1 1.5-2.7-.2-3.4-.9-1-2.6-.6-3.4 1.8-1.3 2.7-1.4Z" fill="#b9aee0"/>

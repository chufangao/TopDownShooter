    <!-- the ghost tail, curling, its tip hanging just over the ground --><path d="M38 66c1.8-.9 8.3.3 12 .6s8.6-.1 10 1.4-.3 5.5-1.4 7.6-3.3 3.5-5.2 4.8-4.4 2.4-6.4 3.2-4 1.8-5.4 1.8-3.2-2-3.2-2 2.9-1 3.6-2 1-2.4.6-4-2.4-3.5-3.2-5.4-3.2-5.1-1.4-6Z" fill="#b9aee0"/><path d="M56 73c-.2 1-2 3.9-3.6 5.4s-5.7 3.7-6 3.6 3-2.8 4.2-4.4 2.1-4.2 3-5 2.6-.6 2.4.4Z" fill="#8577b8" stroke="none"/>

    <path d="M64 43.4l.8 4.2 1.6-4.2Zm-6.6.6l.6 1.4 1-1.6Z" fill="#f2ead0" stroke-width="1"/>
    <path d="M59.6 44.4c.5-.3 2.1-.4 2.6.2s.5 2.5.4 3.4-.5 2-1 2.2-1.4-.2-1.8-.8-.4-2-.4-2.8-.3-1.9.2-2.2Z" fill="#d8708a" stroke-width="1.3"/>
    <!-- a scraggly beard of grave-mist -->
    <path d="M51.6 48.6c.3-.2 2 2.3 3.4 3s3.6 1.4 5 1.4 3.2-1.6 3.6-1.2-1 3.8-1 3.8l-2-1-2.2 3.8-2-4-3 2.2s.3-2.7 0-4-2.1-3.8-1.8-4Z" fill="#a79cd0" stroke-width="1.6"/>
    <!-- the barrow helm: bronze, a size too small, perched on the very top -->
    <g transform="rotate(-12 54 18)"><path d="M44.4 19.6c-1.3-1.1.2-4.3 1-6s2.3-3.3 3.6-4.2 2.9-1.4 4.4-1.4 3.3.7 4.6 1.6 2.6 2.4 3.4 4 1.2 5.6 1.2 5.6-6.2 1.1-9.2 1.2-7.7.3-9-.8Z" fill="#8aa274"/><path d="M57.6 11.6c.3-.1 2.2 1.9 2.8 3s1.5 3.1.8 3.8-4.4.7-4.8.2 2.2-2 2.4-3.2-1.5-3.7-1.2-3.8Z" fill="#5e7650" stroke="none"/><path d="M48 12.6c.3-.3 1.1-.3 1.4-.2s.6.4.6.8 0 .9-.3 1.2-1.3.5-1.7.4-.9-.5-.9-.9 .5-1.1.9-1.3Z" fill="#b6caa0" stroke="none"/><path d="M51.4 8.6c-.5-.8.1-3.4.6-4.2s2-1.1 2.6-.8 .9 1.5 1 2.4 .1 2.6-.6 3-3.1.4-3.6-.4Z" fill="#e8b830" stroke-width="1.6"/><path d="M53.4 9l.2 9.6" fill="none" stroke="#e8b830" stroke-width="1.2"/><g fill="none"><g stroke-width="4.2"><path id="bw-rim" d="M43.4 19.6c5.6-1.6 13.2-1.6 20.2.2"/></g><use href="#bw-rim" stroke="#e8b830" stroke-width="2.2"/></g></g>

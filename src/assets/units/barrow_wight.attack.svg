<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Barrow Wight, attack key pose: casting Wither. It surges forward to the right, the giant claw thrust out as a
       spiralling bolt of withering mist bursts from the palm; the bronze sword drawn back over the shoulder; mantle and tail
       streaming behind; both eyes blazing wide, a long wail. Same parts as the alive picture. -->

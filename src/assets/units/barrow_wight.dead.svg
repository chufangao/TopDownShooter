<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Barrow Wight, dissipated: the spirit gone flat as an empty sheet on its heap of burial finery, X for eyes, tongue
       out; the little helm toppled off, the gold torc slumped, the bronze sword lying cold, and one last wisp of ghost-mist
       rising and fading. Same parts, a shade greyer. -->
  <defs>
    <filter id="bwd-ink" x="-6%" y="-6%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#1d1427"/><feComposite in2="SourceAlpha" operator="in"/><feOffset dx="1.1" dy="1.3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <path d="M6 88.6c-.3-1.3.3-2.9 6-3.6s17.7-.7 28-.8 25.7 0 34 .4 12.9 1 16 1.8 4.3 2.2 2.6 3.2-4.8 2.4-12.6 3-23 .8-34 .8-25.3.2-32-.6-7.7-2.9-8-4.2Z" fill="#2c2440" stroke="none"/>
  <!-- the last wisp rising (no ink) -->
  <path d="M44 70c-4-6 2-10-1-16-2-4 1-8-.4-12" fill="none" stroke="#c9a8ff" stroke-width="2" opacity=".6"/>
  <g filter="url(#bwd-ink)" stroke="#1d1427" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <g transform="translate(64 86.4) rotate(-4)"><!-- the bronze leaf-sword, its tip bent --><path d="M0-2.4c1.3-1 5.3-1.4 8-1.6s5.7.1 8 .4 4.6 1.4 6 1.6 2.6-.6 2.6-.6l2.8 2.2s-3.2 1.7-5.4 2.4-5.3 1.4-8 1.6-5.7-.4-8-.6-5 .1-6-.8-1.3-3.6 0-4.6Z" fill="#a08a46"/><path d="M3 1c1.2-.1 6.2.4 9 .4s7.7-.8 8-.6-3.5 1.4-6 1.6-7.2-.2-9-.4-3.2-.9-2-1Z" fill="#7a6630" stroke="none"/><path d="M2-.4l18 .2" fill="none" stroke="#7a6630" stroke-width="1"/><path d="M-1-5.4l2.4.4 .2 10-2.4.6Z" fill="#a8822a" stroke-width="1.6"/><path d="M-8.6-1.4l7.6-.2 0 3.2-7.6-.2Z" fill="#6a4a3a" stroke-width="1.6"/><path d="M-10.3-2.1c.5 0 1.5.4 1.9.9s.4 1.6.3 2.1-.6.9-1.2 1-1.9 0-2.3-.5-.5-1.7-.2-2.3 .9-1.1 1.5-1.2Z" fill="#a8822a" stroke-width="1.6"/></g>
    <!-- the mantle, flat in a heap -->
    <path d="M16 87.6c0-1.4 3.3-5.3 6-7s6.3-2.5 10-3.2 8-1 12-.8 8.7.8 12 1.8 6.2 2.7 8 4.2 2.6 5 2.6 5l-6.6-2-6 3.2-8-3.2-8 3.2-8-3.2-8 3.2s-6 .2-6-1.2Z" fill="#4a626a"/>
    <!-- the ghost, gone flat as a sheet over it -->
    <path d="M20 84c-.7-1.5 3.7-4.2 6-5.4s6.3-1.9 8-1.6 .3 3.1 2 3.6 5.7-.8 8-.6 4.3.7 6 1.6 4.3 3.1 4 4-3.7 1.5-6 1.6-5-.9-8-.8-6.7 1.6-10 1.2-9.3-2.1-10-3.6Z" fill="#a59cc4"/>
    <path d="M47.4 80.8c.3-1.1 4.4-1.8 6.6-1.8s5.1 1.1 6.6 2 2.9 2.5 2.4 3.4-3.6 1.6-5.4 1.8-3.9.1-5.6-.8-4.9-3.5-4.6-4.6Z" fill="#a59cc4"/>
    <!-- the torc -->
    <g fill="none"><g stroke-width="5"><path id="bwd-torc2" d="M30 82.6c4 2.8 10 3 14 .4"/></g><use href="#bwd-torc2" stroke="#c9a040" stroke-width="2.8"/></g>
    <!-- the head, flattened, face up -->
    <g transform="translate(18 70) rotate(-74) scale(.78 .74) translate(-56 -36)"><!-- the head: long and droopy, a great hooked nose, the chin sagging --><path d="M41.4 30c-.3-3.3-.1-6.1 1.2-8.4s3.9-4.3 6.4-5.2 6-.9 8.6-.4 5.2 1.8 7 3.4 2.8 4.3 3.8 6 1.1 2.5 2.2 4 4.1 4 4.4 5.2-1.7 1.5-2.4 1.8-1.6-.7-2 .2 .5 3.3-.2 5.4-2.2 5.1-3.8 7-4 3.8-6 4.4-4.2.2-6-.8-3.3-3.2-5-5-3.6-3.1-5-6-2.9-8.3-3.2-11.6Z" fill="#a59cc4"/><path d="M67.6 38.4c.7-.1-.2 4.6-1 6.6s-2.5 4.3-4 5.4-5 2-5 1.2 3.1-3.8 4.8-6 4.5-7.1 5.2-7.2Z" fill="#7a6ea6" stroke="none"/><path d="M45 30c-.1-1.2.6-4.4 1.6-6s4.1-3.8 4.4-3.6-1.8 3.2-2.4 5-.6 4.8-1.2 5.6-2.3.2-2.4-1Z" fill="#c9c2e0" stroke="none"/><path d="M71.2 33.4c.5-.1 2.8 1 2.8 1.4s-2.5 1-3 .8-.3-2.1.2-2.2Z" fill="#7a6ea6" stroke="none"/><!-- deep sockets --><path d="M47.8 28.4c.4-1.4 2.6-3.3 4-3.8s3.1 1 4.6 1 3.1-1.4 4.6-1.2 3.3 1.2 4.2 2.2 1.2 2.8 1 4-1 2.7-2 3.4-2.8.8-4 .6-2.1-1.8-3.2-1.8-2.1 1.8-3.4 1.8-3.2-.6-4.2-1.6-2-3.2-1.6-4.6Z" fill="#685c94" stroke="none"/><!-- X for eyes, a matched pair --><path d="M51.5 25.1c1.1-.2 3.2.4 4 1.2s1.4 2.7 1 3.7-2 2.5-3.1 2.8-3.2-.3-3.9-1.2-.7-3.1-.4-4.2 1.3-2.1 2.4-2.3Z" fill="#e4e0f0" stroke-width="1.6"/><path d="M50.2 26.6l4.8 4.8m-.1-4.9l-4.8 4.8" fill="none" stroke-width="2.4"/><path d="M60.1 25.3c1.1-.2 3.2.4 4 1.2s1.4 2.7 1 3.7-2 2.5-3.1 2.8-3.2-.3-3.9-1.2-.7-3.1-.4-4.2 1.3-2.1 2.4-2.3Z" fill="#e4e0f0" stroke-width="1.6"/><path d="M58.8 26.8l4.8 4.8m-.1-4.9l-4.8 4.8" fill="none" stroke-width="2.4"/><path d="M47.6 24c2.2-2 5.8-2.2 8.6-1m1.4.8c3-.6 6.4-.4 8.8.8" fill="none" stroke-width="2.3"/><path d="M53 43c.2-.6 3.2-.8 5-1s4.4-.2 6 0 3.8.8 3.6 1.4-2.8 1.9-4.6 2.2-4.3.2-6-.2-4.2-1.8-4-2.4Z" fill="#3b1630" stroke-width="1.5"/><path d="M58.6 44.6c.5-.5 2.4-.7 3 0s.9 3.2.8 4.4-.8 2.4-1.4 2.6-1.8-.5-2.2-1.2-.4-2-.4-3-.3-2.3.2-2.8Z" fill="#c9667e" stroke-width="1.3"/><!-- a scraggly beard of grave-mist --><path d="M51.6 48.6c.3-.2 2 2.3 3.4 3s3.6 1.4 5 1.4 3.2-1.6 3.6-1.2-1 3.8-1 3.8l-2-1-2.2 3.8-2-4-3 2.2s.3-2.7 0-4-2.1-3.8-1.8-4Z" fill="#8e86ae" stroke-width="1.6"/></g>
    <!-- the little helm, toppled off -->
    <g transform="translate(76 82) rotate(108) scale(.9) translate(-54 -14)"><path d="M44.4 19.6c-1.3-1.1.2-4.3 1-6s2.3-3.3 3.6-4.2 2.9-1.4 4.4-1.4 3.3.7 4.6 1.6 2.6 2.4 3.4 4 1.2 5.6 1.2 5.6-6.2 1.1-9.2 1.2-7.7.3-9-.8Z" fill="#738a62"/><g fill="none"><g stroke-width="4.2"><path id="bwd-rim" d="M43.4 19.6c5.6-1.6 13.2-1.6 20.2.2"/></g><use href="#bwd-rim" stroke="#c9a040" stroke-width="2.2"/></g></g>
  </g>
</svg>

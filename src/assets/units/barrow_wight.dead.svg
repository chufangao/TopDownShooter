    <linearGradient id="bwd-helm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9db58a"/>
      <stop offset="0.45" stop-color="#5f7d64"/>
      <stop offset="1" stop-color="#2e4537"/>
    </linearGradient>
    <linearGradient id="bwd-helm-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6e8a69"/>
      <stop offset="1" stop-color="#26392d"/>
    </linearGradient>
    <radialGradient id="bwd-hollow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#0c0912"/>
      <stop offset="0.7" stop-color="#17121f"/>
      <stop offset="1" stop-color="#2a2236"/>
    </radialGradient>
    <linearGradient id="bwd-blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dcc690"/>

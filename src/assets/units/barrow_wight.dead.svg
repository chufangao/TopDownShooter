<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Barrow Wight, dissipated: the spirit is gone, leaving its burial finery in a heap of grave-dust and rotted cloth: the empty helm toppled on its side, the gold torc on the slumped mail, the bronze sword lying cold, the circlet rolled away, and one last faint wisp of ghost-mist rising and fading. -->
  <defs>
    <radialGradient id="bwd-dust" cx="0.45" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#5a5260"/>
      <stop offset="0.6" stop-color="#3c3546"/>
      <stop offset="1" stop-color="#28222f"/>
    </radialGradient>
    <linearGradient id="bwd-mantle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b7d8b"/>
      <stop offset="0.5" stop-color="#435260"/>
      <stop offset="1" stop-color="#222a36"/>
    </linearGradient>
    <linearGradient id="bwd-lining" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2338"/>
      <stop offset="1" stop-color="#352c50"/>
    </linearGradient>
    <linearGradient id="bwd-mail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a847a"/>
      <stop offset="0.5" stop-color="#5a5049"/>
      <stop offset="1" stop-color="#352d2a"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Bone Chanter: a skeletal priest in burial robes, one hand raised mid-dirge, the other gripping a staff crowned by a
       ribcage lantern of soulfire. Goofy pass: a huge skull tipped up to sing, the jaw dropped in a wide crooked O, a matched
       pair of googly eyes on the congregation; one big branching antler through the hood and one
       snapped stub with a candle stuck on it; a giant bony hand conducting; the soulfire in the lantern has a little face too;
       big bony feet. Flat cel: base + one shadow; ink offset down-right (filter). -->
  <defs>
    <filter id="bc-ink" x="-6%" y="-6%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#1d1427"/><feComposite in2="SourceAlpha" operator="in"/><feOffset dx="1.1" dy="1.3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- notes of the dirge drifting up (no ink) -->
  <path d="M24 22c-1.6-.4-3.4.6-3.4 2 0 1.4 1.8 1.8 3.2 1.2 .8-.4 1.2-1 1.2-1.8l.4-9c1.6.8 3 2 3.4 3.6 .4-2.4-1.6-4.6-4.2-5.6Z" fill="#5ee8d0" stroke="none" opacity=".8"/>
  <path d="M13 34c-1.6-.4-3.4.6-3.4 2 0 1.4 1.8 1.8 3.2 1.2 .8-.4 1.2-1 1.2-1.8l.4-7.2c1.6.8 3 2 3.4 3.6 .4-2.4-1.6-4.6-4.2-5.6Z" fill="#5ee8d0" stroke="none" opacity=".6"/>

  <!-- Bone Chanter, attack key pose: hurling a Marrow Bolt to the right. The bony hand thrust out, a jagged bolt of bone
       shards wrapped in soulfire bursting from the palm; the staff hoisted high behind with its lantern flaring; the jaw hanging
       wide on the incantation, both eyes popped; the robe swept back. Back foot planted. -->

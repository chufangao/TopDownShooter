    <filter id="bca-ink" x="-6%" y="-6%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#1d1427"/><feComposite in2="SourceAlpha" operator="in"/><feOffset dx="1.1" dy="1.3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- the soulfire round the bolt (no ink) -->
  <path d="M70 50c.3-2.4 5.3-6 8-7.4s5.7-1.5 8-1.2 6 3.2 6 3.2-4.5 1-4.4 2 4.8 3.8 4.8 3.8-5.7 1.1-5.8 2.2 5 4.4 5 4.4-5-.4-7.6-.4-5.7 1.3-8 .2-6.3-4.4-6-6.8Z" fill="#5ee8d0" stroke="none" opacity=".8"/>

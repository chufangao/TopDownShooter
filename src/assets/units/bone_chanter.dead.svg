<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Bone Chanter, fallen: its robe collapsed into an empty heap with bones spilling out, the skull rolled free with X for
       eyes, the jaw knocked off beside it, the antler snapped; the staff broken and its lantern guttered to a thread of grey smoke,
       the candle out. Same parts, a shade greyer. -->
  <defs>
    <filter id="bcd-ink" x="-6%" y="-6%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#1d1427"/><feComposite in2="SourceAlpha" operator="in"/><feOffset dx="1.1" dy="1.3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <path d="M6 88.6c-.3-1.3.3-2.9 6-3.6s17.7-.7 28-.8 25.7 0 34 .4 12.9 1 16 1.8 4.3 2.2 2.6 3.2-4.8 2.4-12.6 3-23 .8-34 .8-25.3.2-32-.6-7.7-2.9-8-4.2Z" fill="#33203d" stroke="none"/>
  <!-- smoke from the guttered lantern (no ink) -->
  <path d="M80.6 64c-2.2-4 1.4-7-.6-11-1.2-2.6.6-5.4-.4-8" fill="none" stroke="#a39cab" stroke-width="1.8" opacity=".8"/>
  <g filter="url(#bcd-ink)" stroke="#1d1427" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <!-- the staff, snapped in two -->
    <g fill="none"><g stroke-width="4.8"><path id="bcd-staff" d="M14 86.6l22-1.6m8-.8l20 2.4"/></g><use href="#bcd-staff" stroke="#76593c" stroke-width="2.6"/></g>
    <g transform="translate(6 57)"><!-- the ribcage lantern: little ribs caging a soulfire with a face of its own --><g fill="none"><g stroke-width="3.4"><path id="bcd-ribs" d="M74.2 9.6l0 4.4m-.6-2.6c-5.2.6-7.6 5.6-6.2 12m7.4-12c5.2.4 7.4 5.4 6 11.8"/></g><use href="#bcd-ribs" stroke="#cfc6aa" stroke-width="1.7"/></g><path d="M74 6.7c.7-.2 1.6.1 2 .6s.6 1.9.3 2.4-.9.9-1.5.9-2.1-.4-2.6-.8-.8-.9-.5-1.4 1.6-1.5 2.3-1.7Z" fill="#cfc6aa" stroke-width="1.6"/><path d="M68.4 24.4c1-.7 3.7-.9 5.6-1s4.9-.1 6 .6 1.4 2.7.4 3.4-4.4.6-6.4.6-4.9 0-5.8-.6-.8-2.3.2-3Z" fill="#cfc6aa" stroke-width="1.8"/></g>
    <!-- the empty robe in a heap -->
    <path d="M22.6 87c-.4-1.4 1.4-4.8 3-7s3.7-4.4 6.4-6 6.7-3.2 10-3.6 7 .1 10 1 5.9 2.8 8 4.6 3.5 4.1 4.6 6 1.8 5.6 1.8 5.6l-6.4-2-5 3.2-7-3.2-7 3-7-3-6 3s-5-.2-5.4-1.6Z" fill="#6c5c80"/>
    <path d="M54 74.4c.7.1 5.5 3.2 7 5s2.6 4.8 2 5.6-4.4 0-5.4-1 0-3.4-.6-5-3.7-4.7-3-4.6Z" fill="#4a3d5e" stroke="none"/>
    <path d="M38 72c.8-.9 5.2-1.9 6.6-.6s1.4 6.1 1.8 8.6 .8 6.4.8 6.4l-3.2-2-2.4 3s-1.3-2.7-1.6-4.4-.1-4.2-.4-6-2.4-4.1-1.6-5Z" fill="#c4bb97"/>
    <!-- bones spilling out -->
    <path d="M18.6 85c-1.6-.4-2-2-1-2.6 1-.6 2 .2 2.2 1l6.2-.8c.4-1 1.6-1.6 2.4-.8 1 .8.4 2.4-.8 2.6 .6.8 0 2-1.2 1.8-.8-.2-1-.8-.8-1.4l-5.8.8c-.4.8-1.8 1.2-2.4.4-.4-.4.2-.8 1.2-1Z" fill="#e8dfc0" stroke-width="1.4"/>
    <g fill="none"><g stroke-width="3.6"><path id="bcd-ribs2" d="M30 78c-3-4-1.6-8 2.4-9m1.2 10.4c-2-3-1.2-5.8 1.8-6.8"/></g><use href="#bcd-ribs2" stroke="#d2c9aa" stroke-width="1.8"/></g>
    <!-- a bony hand flopped out -->
    <g fill="none"><g stroke-width="3.4"><path id="bcd-fingers" d="M58 84.4l3.6-3.4m-2.2 4.4l4.6-1.8m-4 3.4l4.6.4"/></g><use href="#bcd-fingers" stroke="#d2c9aa" stroke-width="1.6"/></g>
    <!-- the snapped antler -->
    <path d="M66 88.2c-.3-.7 3.3-2.5 4.4-3.6s2-3.2 2-3.2 .6 2.7 1.2 3 2.4-1.2 2.4-1.2 .1 2.3-.6 3.2-1.8 1.9-3.4 2.2-5.7.3-6-.4Z" fill="#d2c9aa" stroke-width="1.8"/>
    <!-- the skull, rolled free -->
    <g transform="translate(16 76) rotate(-16) scale(.82) translate(-57 -32)"><!-- the skull: big, tipped up to sing --><path d="M45.2 30.6c.2-2.1.8-5 2.2-6.6s3.9-2.6 6.2-3 5.3 0 7.4.8 4.2 2.6 5.4 4.2 1.6 3.8 1.8 5.6-.2 3.7-.8 5-1.4 2.3-3 3-4.5 1-6.8 1-5.1-.1-7-.8-3.3-1.7-4.2-3.2-1.4-3.9-1.2-6Z" fill="#d2c9aa"/><path d="M66 31.6c.7-.1.2 3.1-.4 4.2s-1.4 2-3 2.6-6.4 1.1-6.6.8 3.9-1.5 5.6-2.8 3.7-4.7 4.4-4.8Z" fill="#a39878" stroke="none"/><path d="M48.4 28.4c.1-.7 1-2.9 2-3.8s3.8-1.8 4-1.6-2.1 1.8-2.8 2.8-1.1 2.8-1.6 3.2-1.7.1-1.6-.6Z" fill="#faf4e0" stroke="none"/><!-- sunken sockets --><path d="M47.4 28.6c.4-1.4 2.4-3.5 3.8-4s3.1 1 4.6 1 3.1-1.4 4.6-1.2 3.3 1.2 4.2 2.2 1.2 2.8 1 4-1 2.7-2 3.4-2.8.8-4 .6-2.1-1.8-3.2-1.8-2.1 1.8-3.4 1.8-3.3-.6-4.2-1.6-1.8-3-1.4-4.4Z" fill="#7a6e8a" stroke="none"/><!-- nose hole --><path d="M61.6 34.4c-.8.8-1 2.2-.2 3 .8-.2 1.4-1 1.4-2-.2-.8-.6-1.2-1.2-1Z" fill="#2a1f3e" stroke-width="1"/><!-- X for eyes, a matched pair --><path d="M50.9 25.1c1.1-.2 3.2.4 4 1.2s1.4 2.7 1 3.7-2 2.5-3.1 2.8-3.2-.3-3.9-1.2-.7-3.1-.4-4.2 1.3-2.1 2.4-2.3Z" fill="#d6dcae" stroke-width="1.6"/><path d="M49.6 26.6l4.8 4.8m-.1-4.9l-4.8 4.8" fill="none" stroke-width="2.4"/><path d="M59.5 25.3c1.1-.2 3.2.4 4 1.2s1.4 2.7 1 3.7-2 2.5-3.1 2.8-3.2-.3-3.9-1.2-.7-3.1-.4-4.2 1.3-2.1 2.4-2.3Z" fill="#d6dcae" stroke-width="1.6"/><path d="M58.2 26.8l4.8 4.8m-.1-4.9l-4.8 4.8" fill="none" stroke-width="2.4"/><path d="M47.8 24c2.2-1.8 5.8-2 8.6-.6m1 .4c3.2-.8 6.4-.4 8.6 1" fill="none" stroke-width="2.3"/><path d="M51.6 38.6l1.6 3 1.6-2.8Zm6.8 1.2l.6 2.2 1.4-2.4Z" fill="#d2c9aa" stroke-width="1"/></g>
    <!-- the jaw, knocked off -->
    <path d="M40.4 85c.7-.2 2.8 1.4 4.6 1.6s4.4.1 6-.2 2.9-1.9 3.6-1.8 1.3 1.6.8 2.4-2.2 2-4 2.4-5 .4-6.8.2-3.3-.8-4-1.6-.9-2.8-.2-3Z" fill="#d2c9aa" stroke-width="1.8"/>
    <path d="M45 86.6l.6-2 1.2 2.2Zm5 0l.8-2.6 1 2.4Z" fill="#d2c9aa" stroke-width="1"/>
    <!-- the candle, out -->
    <g transform="translate(34 72) rotate(84) translate(-64.6 -8)"><path d="M62.8 11.4l3.6.4 .4-7-3.4-.4Z" fill="#efe6d2" stroke-width="1.6"/><path d="M63.6 6.6c-.6 1.4.2 2.6-.4 4" fill="none" stroke="#c9bc98" stroke-width="1.1"/></g>
  </g>
</svg>

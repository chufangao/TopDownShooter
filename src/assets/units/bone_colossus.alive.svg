  <!-- Bone Colossus, braced: two Tomb Knights and the Bone Chanter who bound them, fused into one towering thing of bone
       and corroded barrow plate, the chanter's soulfire burning in its ribs. Goofy pass: two helms on one neck that do not get
       along (the big one glares ahead with its tongue out, the little plumed one sulks, side-eyeing from under flat brows;
       each a matched pair of eyes); the soulfire in
       the ribs has a face; the front pauldron hiked high with a great curling horn, the back one's horn snapped; anvil fists,
       stubby legs. A 2x2 kind: lines at 1/1.75 weight. Flat cel: base + one shadow; ink offset down-right (filter). -->

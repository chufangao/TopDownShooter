<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Brass Sentry: a squat brass turret of the workshop on three stubby iron legs, a loaded crossbow bolted on top. Goofy
       pass: a round pot of a body with a purple livery band and rivets, a matched pair of googly lamp eyes in brass
       portholes, both on the foe, a toothy grille grin; a little chimney puffing steam, a dent with a sticking plaster, a
       wind-up key far too big in its back, big round brass feet; the crossbow cocked and loaded.
       Flat cel: base + one shadow; ink offset down-right. -->
  <defs>
    <filter id="bs-ink" x="-6%" y="-6%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#1d1427"/><feComposite in2="SourceAlpha" operator="in"/><feOffset dx="1.1" dy="1.3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

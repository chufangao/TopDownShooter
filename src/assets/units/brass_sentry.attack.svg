<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Brass Sentry, attack key pose: the bolt loosed. The crossbow has just twanged, its string snapped forward to the
       limbs and still humming, the bolt streaking off at the foe; the whole pot rocked back on its legs by the kick, the

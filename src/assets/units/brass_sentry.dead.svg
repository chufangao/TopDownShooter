<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Brass Sentry, wound down: slumped flat in a slick of oil, its stubby legs buckled and splayed out, the pot tipped back
       with X for eyes (a matched pair) in the portholes and the grille hanging slack; a spring boinged out of the top with a
       cog on it, the chimney bent and smoking, the big key drooped; the crossbow knocked off behind it, snapped at one limb,
       and the bolt it never shot fallen out on the ground. Same parts as the alive picture, a shade greyer. -->
  <defs>
    <filter id="bsd-ink" x="-6%" y="-6%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#1d1427"/><feComposite in2="SourceAlpha" operator="in"/><feOffset dx="1.1" dy="1.3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- a slick of oil under the wreck, and a last curl of smoke from the bent chimney (no ink) -->
  <path d="M5 88.6 C8 84.8 26 84.2 48 84.6 C70 85 88 84.8 92 87.8 C93.8 90.6 82 93 52 93.2 C26 93.4 4 92.2 5 88.6 Z" fill="#2a2230"/>
  <path d="M18 90.4 L26 90.6 M62 91.2 L70 91" fill="none" stroke="#5a5266" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M17.4 36 C15 32.6 18.4 30 17 26.6 C16 24 18 22 20 23" fill="none" stroke="#a39cab" stroke-width="2" stroke-linecap="round" opacity=".8"/>
  <g filter="url(#bsd-ink)" stroke="#1d1427" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <!-- the crossbow, knocked off behind, one limb snapped -->
    <path d="M4 82.6 L36 80.4 L36.4 85.6 L5 87.6 C3.4 87.6 2.6 86.4 2.8 85 Z" fill="#946448"/>
    <path d="M8 66.6 C10.8 70 12.4 74 12.6 78.4 L9.4 78.8 C9.4 75 8.2 71.4 5.8 68.4 Z" fill="#56504b" stroke-width="2.1"/>
    <path d="M6.4 67 L9.6 64.4 L9.4 68.6 Z" fill="#56504b" stroke-width="1.4"/>
    <path d="M12 79.4 C13.6 84 13.6 88 12.6 91 L9.8 90.6 C10.6 87.6 10.4 84 9 80 Z" fill="#56504b" stroke-width="2"/>
    <path d="M11.2 79.4 C16 80 21 82 24 84.4" fill="none" stroke="#e8dcc0" stroke-width="1.3"/>
    <!-- the back leg, buckled and splayed out -->
    <path d="M32.6 78 L20.6 82.4 L22 87 L34.4 83.2 Z" fill="#56504b"/>
    <path d="M14.6 90 C12.8 87.4 13.8 83.4 16.8 81.4 C19.8 79.4 23.2 80 24.6 82.8 Z" fill="#94703a"/>
    <!-- the big key, drooped -->
    <g transform="translate(24.4 63.4) rotate(-38) translate(-25 -54)">
      <path d="M25 52 L15.6 51 L15.4 55.6 L25 56.4 Z" fill="#94703a" stroke-width="2"/>
      <path d="M15.8 53.2 C13 47 6 45.6 4.6 50.6 C3.6 54.2 8.6 56 12 54 C8.4 57 9.4 61.4 13 61 C16.8 60.6 17.4 56.6 15.8 53.2 Z" fill="#c4a064" stroke-width="2.1"/>
    </g>
    <!-- the spring boinged out of the top, a cog on the end -->
    <path d="M47 44 C51.6 42.4 51.4 38.6 47.4 38.4 C43.6 38.2 43.8 34.4 47.6 33.8 C51.6 33.2 51.4 29.4 47.6 29.2 C44 29 44 25.4 47.6 24.6" fill="none" stroke-width="3.6"/>
    <path d="M47 44 C51.6 42.4 51.4 38.6 47.4 38.4 C43.6 38.2 43.8 34.4 47.6 33.8 C51.6 33.2 51.4 29.4 47.6 29.2 C44 29 44 25.4 47.6 24.6" fill="none" stroke="#b4aebc" stroke-width="1.5"/>
    <path d="M46.2 13.8 L49 13.8 L49.4 16 L51.4 16.8 L53 15.2 L55 17.2 L53.4 18.8 L54.2 20.8 L56.4 21.2 L56.4 24 L54.2 24.4 L53.4 26.4 L55 28 L53 30 L51.4 28.4 L49.4 29.2 L49 31.4 L46.2 31.4 L45.8 29.2 L43.8 28.4 L42.2 30 L40.2 28 L41.8 26.4 L41 24.4 L38.8 24 L38.8 21.2 L41 20.8 L41.8 18.8 L40.2 17.2 L42.2 15.2 L43.8 16.8 L45.8 16 Z" fill="#6e5a8e" stroke-width="1.8"/>

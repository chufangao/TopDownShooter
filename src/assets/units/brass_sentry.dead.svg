    <path d="M27.6 42 L24.4 34 L19.6 31.4 L23.6 27.8 L29.6 31.6 L33.8 39.2 Z" fill="#56504b"/>
    <path d="M16.6 32.6 L18.8 29.4 L24.6 25.4 L22.8 29 Z" fill="#7d766f" stroke-width="2"/>
    <!-- the body: a squat round brass pot -->
    <path d="M23.4 56 C23.4 42.4 33.4 33.6 46.2 33.6 C59 33.6 69 42.4 69 56 C69 65.6 65 73.6 58.6 77.4 L34 77.4 C27.6 73.6 23.4 65.6 23.4 56 Z" fill="#c4a064"/>
    <path d="M64.6 45 C67.6 50.4 68.2 58 66 65 C64 71 60.6 75.2 57.2 77.2 L48.6 77.2 C56.6 72.6 63 63 64.6 45 Z" fill="#94703a" stroke="none"/>
    <path d="M28.4 50 C29.2 44.2 33 39.4 38.4 36.8 C34.6 41 32 45.4 28.4 50 Z" fill="#dcc488" stroke="none"/>
    <!-- the purple livery band, riveted -->
    <path d="M23.8 59.4 C31 61.6 39 62.6 46.4 62.6 C54 62.6 61.6 61.6 68.6 59.4 L68 65.6 C61.4 67.8 54 68.8 46.4 68.8 C38.6 68.8 30.6 67.8 24.8 65.6 Z" fill="#6e5a8e" stroke-width="2.1"/>
    <path d="M56.4 68 C60.6 67.4 64.6 66.6 68 65.6 L68.4 62 C64.4 64.8 60.4 66.6 56.4 68 Z" fill="#4e3e6a" stroke="none"/>
    <path d="M29.4 63.6 L29.5 63.7 M37.6 65.2 L37.7 65.3 M46.4 65.6 L46.5 65.7 M55.2 65.2 L55.3 65.3 M63.4 63.6 L63.5 63.7" fill="none" stroke="#dcc488" stroke-width="2.2"/>
    <!-- the bottom rim -->
    <path d="M31.8 75.8 L60.8 75.8 L59.4 79.6 L33.2 79.6 Z" fill="#7d766f" stroke-width="2"/>

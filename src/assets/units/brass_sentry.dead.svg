    <path d="M33.8 45.6 L40.2 50.6 L39 52.2 L32.6 47.2 Z M39.4 45.4 L33.4 51 L34.8 52.4 L40.8 46.8 Z" fill="#d8c0a0" stroke-width="1"/>
    <!-- the grille hanging slack -->
    <path d="M51.4 55.6 C55.6 56.6 61 56.2 65.6 54 C66 59.4 62.4 63.4 58 63.4 C54.4 63.4 52 60 51.4 55.6 Z" fill="#3d2e50" stroke-width="1.8"/>
    <path d="M55 57 L55.4 60.6 M58.4 57.2 L58.6 61.6 M61.8 56.8 L61.8 60.6" fill="none" stroke="#b4aebc" stroke-width="1.4"/>
    <!-- X for eyes, a matched pair, in the portholes -->
    <path d="M43.4 45.6 C43.4 41.6 46.4 38.6 50.4 38.6 C54.4 38.6 57.4 41.6 57.4 45.6 C57.4 49.6 54.4 52.6 50.4 52.6 C46.4 52.6 43.4 49.6 43.4 45.6 Z M56.4 44.8 C56.4 40.8 59.4 37.8 63.4 37.8 C67.4 37.8 70.4 40.8 70.4 44.8 C70.4 48.8 67.4 51.8 63.4 51.8 C59.4 51.8 56.4 48.8 56.4 44.8 Z" fill="#dcc488" stroke-width="2"/>
    <path d="M45.6 45.6 C45.6 42.8 47.8 40.8 50.4 40.8 C53 40.8 55.2 42.8 55.2 45.6 C55.2 48.4 53 50.4 50.4 50.4 C47.8 50.4 45.6 48.4 45.6 45.6 Z M58.6 44.8 C58.6 42 60.8 40 63.4 40 C66 40 68.2 42 68.2 44.8 C68.2 47.6 66 49.6 63.4 49.6 C60.8 49.6 58.6 47.6 58.6 44.8 Z" fill="#d8d2de" stroke-width="1.4"/>
    <path d="M47.6 42.8 L53.2 48.4 M53.2 42.8 L47.6 48.4 M60.6 42 L66.2 47.6 M66.2 42 L60.6 47.6" fill="none" stroke-width="2.1"/>
    <!-- the bracket, the crossbow torn off it -->
    <path d="M42 35 L43.6 30.4 L47 31.6 L49.4 29.4 L52.6 31.4 L52.6 34.6 Z" fill="#56504b" stroke-width="2.2"/>
    </g>
    <!-- the front leg, buckled and splayed out -->
    <path d="M60 80 L72.6 82.6 L71.8 87.4 L58.6 85 Z" fill="#7d766f"/>
    <path d="M70.4 90 C69.6 86.6 71.4 82.8 75 81.4 C78.6 80 82 81.4 82.8 84.4 Z" fill="#c4a064"/>
    <path d="M76.6 83.4 C79 82.8 81.2 83.4 82.2 84.6 L77.6 86.4 C78 85.4 77.6 84.2 76.6 83.4 Z" fill="#94703a" stroke="none"/>
    <!-- the bolt it never shot, fallen out on the ground -->
    <path d="M77 89.2 L90 87.6" fill="none" stroke-width="3.6"/>
    <path d="M77 89.2 L90 87.6" fill="none" stroke="#d4bc8a" stroke-width="1.6"/>
    <path d="M75.4 89.4 L77.6 85.8 L81 85.4 L79.6 89 L82 92 L78.6 92.4 Z" fill="#6e5a8e" stroke-width="1.6"/>
    <path d="M89.4 85.2 L95.2 87 L89.8 90 C90.2 88.4 90 86.8 89.4 85.2 Z" fill="#b8bec8" stroke-width="1.8"/>
    <path d="M35 40 L32.6 37.4 M58 34.8 L60.4 32.4 M62.4 40 L65.6 39" fill="none" stroke="#e4dce8" stroke-width="1.5"/>

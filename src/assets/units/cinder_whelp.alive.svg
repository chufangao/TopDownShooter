<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Cinder Whelp: a drake hatchling barely out of the egg, a little spitter of embers. Goofy pass: a huge round head with a
       stubby snout, the top of its eggshell still stuck on like a helmet and pulled down over the brows, a matched pair of
       googly slit-pupil eyes, both on the foe, a toothy grin with one fang and an ember hiccup on the lip, smoke from one
       nostril; a pot-belly with a cream plate, T-rex arms, one crumpled baby wing, big clown feet, a curled tail with a
       candle-flame tip. Flat cel: base + one shadow; ink offset down-right. -->
  <defs>
    <filter id="cw-ink" x="-6%" y="-6%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#1d1427"/><feComposite in2="SourceAlpha" operator="in"/><feOffset dx="1.1" dy="1.3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

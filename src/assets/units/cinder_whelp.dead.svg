    <g transform="translate(86 79) rotate(172) scale(.72) translate(-56 -21)">
      <path d="M44 28.2 C43.2 20.2 47.8 13.4 55.4 12.6 C62.6 12 67.8 16.6 68.8 23.4 L66 21.6 L64.2 25.8 L60.8 22.8 L57.8 27 L54.6 23.4 L51.4 27.4 L48.6 24.2 L46.4 28.6 Z" fill="#e4ded2" stroke-width="2.1"/>
      <path d="M44.6 20.6 C44 23 44 25.6 44 28.2 L46.4 28.6 L47.6 26 C46 24.4 45 22.6 44.6 20.6 Z" fill="#c8bfac" stroke="none"/>

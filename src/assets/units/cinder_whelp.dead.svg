<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Cinder Whelp, fallen: tipped over backwards onto its back in a drift of ash, clown feet stuck up stiff, the head
       flopped back with X for eyes (a matched pair) and the tongue spilled out, the baby wing squashed underneath; the
       tail-flame snuffed to a curl of smoke and the eggshell cap rolled off, rocking upside down. Same parts as the alive
       picture, a shade greyer. -->
  <defs>
    <filter id="cwd-ink" x="-6%" y="-6%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#1d1427"/><feComposite in2="SourceAlpha" operator="in"/><feOffset dx="1.1" dy="1.3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- a drift of ash -->
  <path d="M5 88.6 C8 84.6 26 84 48 84.4 C70 84.8 88 84.6 92 87.6 C94 90.6 82 93.2 52 93.4 C26 93.6 4 92.4 5 88.6 Z" fill="#4a4250"/>
  <!-- the snuffed tail-flame, a curl of smoke -->
  <path d="M78.6 78.6 C76.4 75 79.6 72.6 78.4 69 C77.6 66.6 79.4 64.8 81.4 65.8" fill="none" stroke="#a39cab" stroke-width="2" stroke-linecap="round" opacity=".8"/>
  <g filter="url(#cwd-ink)" stroke="#1d1427" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <!-- the baby wing, squashed flat underneath -->
    <path d="M30 84 C34 80.4 40 79.6 46 80.6 L44.6 85.4 L49.6 84 L48.4 88.6 L42 88.8 C37 88.8 32.6 87.6 30 84 Z" fill="#a84a3a" stroke-width="2"/>
    <path d="M44.2 81.2 L32.4 84.6 M45.6 84.4 L36 87.4" fill="none" stroke="#d27a4a" stroke-width="1.4"/>
    <!-- the tail, laid out along the ground, its tip smoking -->
    <path d="M58 79 C64 80.4 69 81.8 73.4 82.6 C75.6 83 77.4 82.4 78.2 81.2 C79.8 82.6 79.4 85.6 76.6 86.6 C71 88.2 65 88 58.6 86 Z" fill="#d27a4a"/>
    <path d="M60 85.2 C66 86.8 72 87.2 76.4 86.4 C72 88.2 66 88.2 59.6 86.8 Z" fill="#9c4c2e" stroke="none"/>
    <path d="M66.4 81.2 L68.2 78 L70.2 81.6 Z" fill="#ddd2bc" stroke-width="1.3"/>
    <path d="M77.4 82 C76.6 80.6 77.4 79 78.8 78.8 C80.4 78.8 81.2 80.4 80.4 81.8 C79.8 82.8 78.2 83 77.4 82 Z" fill="#6c6474" stroke-width="1.4"/>

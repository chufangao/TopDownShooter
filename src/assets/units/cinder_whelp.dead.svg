    <path d="M40.6 51.6 C39.4 50 40 48 41.8 47.6 C43.6 47.2 45.2 48.6 45 50.4 C44.8 52 43 53 41.6 52.6 C41.2 52.4 40.8 52 40.6 51.6 Z" fill="#d27a4a" stroke-width="1.8"/>
    <path d="M40.6 47.6 L39.8 45.6 M43.2 47.2 L43.4 45" fill="none" stroke-width="1.3"/>

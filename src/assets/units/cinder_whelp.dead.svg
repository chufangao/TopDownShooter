    <g transform="translate(20 70.6) rotate(-38) scale(.8) translate(-62 -36)">
      <path d="M42 36 C41.4 27 47.6 20.4 56.6 20 C63 19.8 68 22.6 70.6 27 C75.6 27.4 81 29.4 84 33 C86.4 36 85.6 40.6 82.6 43 C79 46 73 47.4 66 47.6 C61 50.4 53 51.4 47.6 48.6 C43.6 46.4 42.2 41.6 42 36 Z" fill="#d27a4a"/>

      <path d="M50 17.2 L50.1 17.3 M61.6 19.2 L61.7 19.3 M48.4 21.6 L48.5 21.7 M53.8 15.6 L53.9 15.7" fill="none" stroke="#b89a68" stroke-width="1.4"/>

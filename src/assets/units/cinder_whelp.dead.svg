      <path d="M73.4 42.6 L74.2 45 L75.6 42.4 Z" fill="#fff4dc" stroke-width="1"/>
      <!-- X for eyes, a matched pair -->
      <path d="M48.6 33.4 C48.6 29.8 51.4 27.4 54.8 27.4 C58.2 27.4 60.8 30 60.8 33.4 C60.8 37 58 39.6 54.6 39.6 C51.2 39.6 48.6 37 48.6 33.4 Z M61 32.8 C61 29.2 63.8 26.8 67.2 26.8 C70.6 26.8 73.2 29.4 73.2 32.8 C73.2 36.4 70.4 39 67 39 C63.6 39 61 36.4 61 32.8 Z" fill="#f2eee8" stroke-width="1.8"/>
      <path transform="rotate(38 54.8 33.4)" d="M52.2 30.8 L57.4 36 M57.4 30.8 L52.2 36" fill="none" stroke-width="2"/>
      <path transform="rotate(38 67.2 32.8)" d="M64.6 30.2 L69.8 35.4 M69.8 30.2 L64.6 35.4" fill="none" stroke-width="2"/>
    </g>
    <!-- the tongue, spilled out on the ash -->
    <path d="M33.4 66.6 C36.4 68.2 38 72 37.6 75.6 C37.2 78.2 34.6 79.6 32.6 78.2 C31 76.8 31.8 74.2 32 71.8 C32.2 69.8 32.4 67.8 33.4 66.6 Z" fill="#d8708a" stroke-width="1.6"/>
    <path d="M34.2 70 L34.8 75" fill="none" stroke="#a8473a" stroke-width="1.1"/>

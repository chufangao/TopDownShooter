    <path d="M61 70 C60.8 64.6 62.4 59.6 65.6 55.6 L70.4 57.6 C68 61 67 64.8 67.4 69.4 Z" fill="#9c4c2e"/>
    <path d="M62.6 56.4 C62.6 54 64.6 52.6 67.4 52.6 L76 52.6 C78.2 52.6 79.4 53.6 79.6 55 C79.8 56.4 78.8 57.2 77.4 57.4 C73.4 58 68.4 58.2 64.6 57.8 C63.4 57.6 62.6 57.2 62.6 56.4 Z" fill="#9c4c2e"/>
    <path d="M78.8 54 L82 53 L80.4 55.8 Z" fill="#ddd2bc" stroke-width="1.3"/>
    <!-- the pot-belly, on its back, the cream plate to the sky -->
    <path d="M30 76 C30 67 38 61.6 48 61.6 C58 61.6 66.6 66.6 66.6 75 C66.6 82 60 86.6 48 86.6 C37 86.6 30 83 30 76 Z" fill="#d27a4a"/>

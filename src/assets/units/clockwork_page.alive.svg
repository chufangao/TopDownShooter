<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Clockwork Page: a sly brass automaton page-boy, wound up and creeping, a card for the mark and a stiletto for the back
       rank. Goofy pass: a huge cracked porcelain head with a wide painted grin and a rosy cheek; a matched pair of arcane lamp
       eyes, the right one behind a brass monocle; a floppy cap with a feather drooping off the back; a little purple barrel
       of a body on spindly legs in striped stockings and big curly brass shoes; the wind-up key far too big; offering a card
       with one hand, the stiletto hidden behind its back in the other. Flat cel: base + one shadow; ink offset down-right. -->
  <defs>
    <filter id="cp-ink" x="-6%" y="-6%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#1d1427"/><feComposite in2="SourceAlpha" operator="in"/><feOffset dx="1.1" dy="1.3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

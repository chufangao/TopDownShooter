<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Clockwork Titan, attack key pose (Piston Hook): a big right hook, the front anvil fist leading, its piston driven
       out to full stroke, knuckles first into whatever stands to the right; the hull twisted into the swing, the front shoulder
       thrown forward, the little back fist cocked at its hip; the core flares, steam blasts from the vent; the mask's lamps
       squinting to slits with effort. The back foot planted on the feet line. -->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Ember Drake: a young drake rearing on its hind legs, jaws full of fire. Goofy pass: a huge lumpy head tipped up on a pot-belly,
       a matched pair of googly slit-pupil eyes glaring at the fight, a lopsided grin with one buck fang
       and a forked tongue out the corner, an ember hiccup on the lip and smoke out of one nostril; one big scalloped wing and one
       crumpled stub; T-rex arms; clown feet; a lopsided candle-flame on the tail; one horn chipped. Flat cel, ink offset down-right. -->
  <defs>
    <filter id="ed-ink" x="-6%" y="-6%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#1d1427"/><feComposite in2="SourceAlpha" operator="in"/><feOffset dx="1.1" dy="1.3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

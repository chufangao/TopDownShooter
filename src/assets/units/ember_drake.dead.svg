  <path d="M37 84.6 C29 86.4 18.6 86.8 12 83.6 C7.2 81.2 6.6 75.4 9.6 72.4 C12 70 15.8 70.4 17.2 72.8 C17.8 74.2 17.2 75.6 15.8 76.2 C16.6 74.6 15.6 73.2 13.8 73.6 C11.6 74.2 11.2 77.6 13.4 79.4 C17.6 82 27 80.6 36.4 75.2 Z" fill="url(#edd-scale)" stroke="#0d0a12" stroke-width="1.1" stroke-linejoin="round"/>

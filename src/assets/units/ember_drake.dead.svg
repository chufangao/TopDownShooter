<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Ember Drake, fallen: slumped on its side in a drift of ash, wings broken, its belly fire gone cold and the tail flame snuffed to a curl of smoke. -->
  <defs>
    <linearGradient id="edd-scale" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cf8556"/>
      <stop offset="0.5" stop-color="#b14a2c"/>
      <stop offset="1" stop-color="#651a20"/>
    </linearGradient>
    <linearGradient id="edd-scale-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a63e2a"/>
      <stop offset="1" stop-color="#4a0f17"/>
    </linearGradient>
    <linearGradient id="edd-head" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#e0915a"/>
      <stop offset="0.5" stop-color="#b9502e"/>
      <stop offset="1" stop-color="#6e1c21"/>
    </linearGradient>
    <linearGradient id="edd-belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8dabd"/>
      <stop offset="0.6" stop-color="#c4ac86"/>
      <stop offset="1" stop-color="#8a7254"/>
    </linearGradient>
    <linearGradient id="edd-wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a3030"/>
      <stop offset="0.55" stop-color="#5a171d"/>
      <stop offset="1" stop-color="#330c13"/>
    </linearGradient>
    <linearGradient id="edd-wing-far" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6e2428"/>
      <stop offset="1" stop-color="#2e0a12"/>
    </linearGradient>
    <linearGradient id="edd-horn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2d6bc"/>
      <stop offset="0.5" stop-color="#b09878"/>
      <stop offset="1" stop-color="#5e4c3a"/>
    </linearGradient>
    <radialGradient id="edd-ash" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3a3338"/>
      <stop offset="0.7" stop-color="#2a2329"/>
      <stop offset="1" stop-color="#1c171e"/>
    </radialGradient>
    <radialGradient id="edd-smoke" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9a94a2" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#9a94a2" stop-opacity="0"/>
    </radialGradient>
  </defs>


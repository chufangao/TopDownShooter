  <path d="M16.4 74 C14.6 70.6 18.6 68.4 16.6 64.8 C15 62 11.2 62.4 11.2 59.2" fill="none" stroke="#c4c0cc" stroke-width="0.4" stroke-linecap="round" opacity="0.6"/>
  <path d="M17.6 68 Q20.4 65 19.4 61.6" fill="none" stroke="#8b8798" stroke-width="0.6" stroke-linecap="round" opacity="0.4"/>


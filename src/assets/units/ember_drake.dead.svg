  <path d="M10 85 Q14 79 24 78 M70 77 Q82 78 86 82 M20 91 Q40 93 60 92" fill="none" stroke="#4a4248" stroke-width="0.6" opacity="0.8"/>
  <path d="M12 80 Q18 77.6 26 77.2" fill="none" stroke="#5c545c" stroke-width="0.5" opacity="0.6"/>


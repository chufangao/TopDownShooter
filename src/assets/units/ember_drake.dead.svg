  <path d="M66 64.2 L68.6 63.6 L67.6 66.4 Z" fill="#2a2329" stroke="#0d0a12" stroke-width="0.5" stroke-linejoin="round"/>
  <path d="M71 61 L73.4 58.6 M72.4 66 L70.6 68.6" stroke="#1a0810" stroke-width="0.6"/>
  <!-- veins gone dark -->

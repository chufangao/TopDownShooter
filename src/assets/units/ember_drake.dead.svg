<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Ember Drake, fallen: keeled over on its side in a drift of ash, one clown foot stuck stiff in the air, the big wing
       draped over it like a blanket, X for eyes (a matched pair), the forked tongue spilled on the ground, the tail
       flame snuffed to a curl of smoke and a last ember hiccup going out. Same parts, a little greyer. -->
  <defs>
    <filter id="edd-ink" x="-6%" y="-6%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#1d1427"/><feComposite in2="SourceAlpha" operator="in"/><feOffset dx="1.1" dy="1.3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

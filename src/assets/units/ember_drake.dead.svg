  <path d="M70.6 55.4 L88.2 57.4 M70.6 55.4 L77 61.6 L84 63.8 M70.6 55.4 Q73 64 76.2 70.2" fill="none" stroke="#8a3226" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>

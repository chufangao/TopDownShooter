  <path d="M76.4 60.6 l0.9 0.5 l-0.3 0.8 l0.9 0.3" fill="none" stroke="#d8c8a8" stroke-width="0.45" stroke-linejoin="round"/>
  <path d="M54 68 L62.4 60.6 L70.6 55.4" fill="none" stroke="#0d0a12" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M54 68 L62.4 60.6 L70.6 55.4" fill="none" stroke="#9a3a28" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M55.6 66 L62 60 L69.6 55" fill="none" stroke="#d27a4e" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="62.4" cy="60.6" r="1.5" fill="#8a3226" stroke="#0d0a12" stroke-width="0.5"/>
  <path d="M70 55.6 Q69 52 71.6 50.4 Q71.4 53 72.6 55 Z" fill="url(#edd-horn)" stroke="#0d0a12" stroke-width="0.6" stroke-linejoin="round"/>
  <circle cx="70.8" cy="55.6" r="1.3" fill="#9a3a28" stroke="#0d0a12" stroke-width="0.5"/>

  </g>


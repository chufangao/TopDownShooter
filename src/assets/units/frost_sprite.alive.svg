<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Frost Sprite: a fae skirmisher hovering on ice wings, a crystal lance in hand. Goofy pass: a big head under a white cowlick,
       an icicle crown sliding off one side, a big matched pair of eyes, both on the foe, a smug crooked
       smirk with one buck tooth; one big wing and one crumpled little one with a plaster on it; spindly dangling legs, one in
       a striped sock; the lance far too long and kinked in the middle. Flat cel: base + one shadow; ink offset down-right. -->
  <defs>
    <filter id="fs-ink" x="-6%" y="-6%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#1d1427"/><feComposite in2="SourceAlpha" operator="in"/><feOffset dx="1.1" dy="1.3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

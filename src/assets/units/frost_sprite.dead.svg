<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Frost Sprite, fallen: knocked flat on its back in a puddle of meltwater, eyes spun to spirals, tongue out; one leg (the
       striped sock) stuck up in the air, the wings snapped to shards, the kinked lance broken in two, and its icicle crown rolled
       off and melting. Same parts as the alive picture, a shade greyer. -->
  <defs>
    <filter id="fsd-ink" x="-6%" y="-6%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#1d1427"/><feComposite in2="SourceAlpha" operator="in"/><feOffset dx="1.1" dy="1.3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- the meltwater puddle, a pale rim and two glints -->
  <path d="M4.6 88.4 C6 84.6 22 83.4 46 83.8 C70 84.2 89.4 84.6 92.4 88 C94.6 91.4 80 93.6 50 93.6 C22 93.6 3.4 92.2 4.6 88.4 Z" fill="#4f7ea8" opacity=".75"/>
  <path d="M14 90.4 L22 90.8 M64 91.2 L74 91" fill="none" stroke="#cfeeff" stroke-width="1.2" stroke-linecap="round" opacity=".7"/>
  <g filter="url(#fsd-ink)" stroke="#1d1427" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
    <!-- wing shards scattered over the water -->
    <path d="M8.6 86.6 L14 82.4 L13.4 88 Z M88.4 87.6 L92.4 82.6 L93.4 88.4 Z M60.4 89.6 L64.6 86.6 L65 90.6 Z" fill="#9cc8e2" stroke-width="1.5"/>
    <!-- the lance's shaft, snapped, lying behind -->
    <g fill="none">
      <g stroke-width="4.6"><path id="fsd-shaft" d="M44 90.6 L66 88.4 L83 82.6"/></g>
      <use href="#fsd-shaft" stroke="#ddd5c2" stroke-width="2.4"/>
    </g>
    <path d="M82.4 80.4 L84.6 81 L83.2 83.2 L85.2 84.4 L82.4 85" fill="#ddd5c2" stroke-width="1.2"/>
    <!-- wing stumps broken off jagged, poking out from under the back -->
    <path d="M40 71.2 L35.4 64 L41.4 66.6 L43 61.4 L45.6 68.6 Z M46.6 72 L49.6 64.4 L51.4 68.4 L55 63.6 L54.2 71.6 Z" fill="#9cc8e2" stroke-width="1.6"/>
    <!-- the leg that stuck up in the air, in its striped sock -->
    <path d="M55.6 79.4 C59.6 75.6 62.6 71.4 64.6 66.4 L69.4 68.2 C67.4 73.4 63.6 78.4 59.2 82.4 Z" fill="#a6cde4"/>
    <path d="M64.4 67.4 C65.2 62.6 66.6 58 68.8 54 L73 55.8 C71 59.6 70 63.8 69.4 68.6 Z" fill="#e8f2fa"/>
    <path d="M65.2 63.2 L69.8 64.6 M66.4 59.4 L71 60.8 M67.8 55.8 L72.2 57.2" fill="none" stroke="#3f6f99" stroke-width="2.4" stroke-linecap="butt"/>
    <path d="M68.8 54.2 C68.4 51 69.8 48.4 72 48 C73.8 48.8 74.4 51.6 73 55.8 Z" fill="#a6cde4" stroke-width="1.6"/>
    <!-- the other leg flat on the ground -->
    <path d="M58 84.4 C64 85 70 85.6 75.6 86 L75.6 88.6 C69.6 88.4 63.4 88 57.4 87.4 Z" fill="#6f97b8"/>
    <path d="M75.2 85.6 C77.4 85.2 79 85.8 79.4 87 C78.6 88.2 76.8 88.6 75 88.4 Z" fill="#6f97b8" stroke-width="1.6"/>
    <!-- torso, skirt and collar on its back -->
    <g transform="translate(47 79) rotate(-80) scale(.86) translate(-51 -56)">
      <path d="M43 62 L40.6 70 L44.6 67.4 L46.4 72 L49.4 67.8 L52.4 72.6 L54.6 67.6 L58 70.6 L58.6 62.4 Z" fill="#46799e"/>
      <path d="M45 50 C48 47.6 54 47.4 57.4 49.6 C59 54 59 59 57.4 63.6 C53 65.4 47.6 65.4 44 63.6 C42.6 59 43 54 45 50 Z" fill="#5f93b6"/>
      <path d="M44.2 61 C48.6 62.4 53.6 62.2 58 60.6" fill="none" stroke="#c9d3e2" stroke-width="1.6"/>
      <path d="M45.4 49.6 L47 52.6 L48.6 50.4 L50.4 53.2 L52.2 50.4 L54.2 53 L55.6 50.2 L57.6 51.6 L57.2 48.8 C53 46.8 48.6 47 45.4 49.6 Z" fill="#dbe6f0" stroke-width="1.5"/>
    </g>
    <!-- an arm flopped up, palm open; the other limp at its side -->
    <path d="M41.4 72.4 C40.4 68.6 40.6 64.6 42 61 L44.6 61.8 C43.6 65.4 43.6 68.8 44.6 72 Z" fill="#a6cde4"/>
    <path d="M40.4 61.8 C39.4 60 39.8 58 41.4 57.4 C41.4 56 42.4 55.4 43.4 56 C44.2 55.4 45.4 56 45.2 57.2 C46.4 57.4 46.6 58.6 45.8 59.6 C45.4 61.4 43.8 62.6 42 62.4 C41.2 62.4 40.6 62.2 40.4 61.8 Z" fill="#a6cde4" stroke-width="1.6"/>
    <path d="M48 85.4 C50.6 87.2 53.4 88.4 56.6 88.6 L56.4 91 C52.8 90.8 49.6 89.6 46.8 87.6 Z" fill="#a6cde4"/>
    <!-- the head, face up, back of the skull in the water -->
    <g transform="translate(25 72.6) rotate(-84) scale(.84) translate(-52 -30)">
      <path d="M40.4 28 C35.4 25.6 30.4 21.6 26.4 16 C30.4 16.8 33.6 18.2 36.2 20.2 C37.4 22.6 39 25.2 41.4 26.8 Z" fill="#a6cde4"/>
      <path d="M66 35.6 C69.6 36.2 72.4 38.2 74 41.6 C70.6 41.6 67.4 40.6 64.6 38.6 Z" fill="#8fb6d4"/>
      <path d="M37.4 30 C36.6 21 43 14.4 52 14 C61 13.6 67.6 19.4 68.4 27.4 C69 33 67 38 63.4 41.6 C60.4 44.6 56.6 46.4 52.8 46.2 C46 46 38.4 40 37.4 30 Z" fill="#a6cde4"/>
      <path d="M65.6 33.6 C65.2 38 62 42.4 57.4 44.2 C55.4 45 53.4 45 51.6 44.6 C57.6 42.6 62.6 38.6 65.6 33.6 Z" fill="#7199bc" stroke="none"/>
      <path d="M36.6 32 C33 28 32 22 34.4 16.6 C32.8 14.8 31.6 12.2 31.8 9.2 C34.4 10.8 36.6 11.2 38.4 10.8 C38.6 7.6 40 5 42.6 3 C43.2 5.8 44.6 7.8 46.6 8.8 C48.6 6.2 51.8 4.6 55.2 4.6 C54 6.8 53.8 9 54.6 10.8 C58.8 9.6 63.2 10.8 66.8 13.6 C64.2 13.8 62.6 14.8 61.6 16.4 C65.4 17.6 68.6 20.4 70.4 24.4 C66.2 22.8 61.4 22.4 57.4 23.4 C52.4 21.4 46.4 22 42.4 25.4 C40.8 27.6 40 30 39.8 32.6 Z" fill="#e2e8f2"/>
      <!-- eyes spun to spirals -->
      <path d="M41.1 30.6 C40.8 26.5 43.3 23.5 46.7 23.3 C50.3 23.1 52.8 26 52.8 29.9 C52.8 34 50.2 36.9 46.9 36.9 C43.8 36.9 41.5 34.2 41.1 30.6 Z M53.7 30.9 C53.4 26.8 55.9 23.8 59.3 23.6 C62.9 23.4 65.4 26.3 65.4 30.2 C65.4 34.3 62.8 37.2 59.5 37.2 C56.4 37.2 54.1 34.5 53.7 30.9 Z" fill="#f2f6fa" stroke-width="1.6"/>
      <path d="M46.9 30.2 C47.7 30 48 31 47.4 31.5 C46.4 32.2 45.1 31.2 45.4 29.9 C45.8 28.4 47.9 27.9 49 29.1 C50.3 30.4 49.7 33 47.7 33.7 C45.9 34.1 43.9 33.3 43.5 31.5 M59.5 30.5 C60.3 30.3 60.6 31.3 60 31.8 C59 32.5 57.7 31.5 58 30.2 C58.4 28.7 60.5 28.2 61.6 29.4 C62.9 30.7 62.3 33.3 60.3 34 C58.5 34.4 56.5 33.6 56.1 31.8" fill="none" stroke-width="1.3"/>
      <!-- mouth slack, tongue lolled out the side -->
      <path d="M52 40 C55 42 60 42 63.6 39.4 C63 42.4 60 44.6 56.6 44.4 C54.2 44.2 52.6 42.4 52 40 Z" fill="#3b1630" stroke-width="1.4"/>
      <path d="M60 42 C62 43.4 63 45.6 62.4 48 C61.6 49.6 59.4 49.4 58.6 47.8 C58.2 46 58.6 43.8 60 42 Z" fill="#d880a0" stroke-width="1.3"/>
      <path d="M54.6 41.4 L54.8 43.4 L56.6 43.4 L56.6 41.8 Z" fill="#ffffff" stroke-width="0.9"/>
    </g>
    <!-- the crystal head of the lance, snapped off -->
    <path d="M86.6 79 C84.2 76.6 84 73 86 70.4 L89.6 67.6 L90.2 71.6 C91.8 74 91.8 77 90.2 79.4 Z" fill="#b8dcec" stroke-width="1.7"/>
    <path d="M89.4 68.6 L88.2 79" fill="none" stroke="#7cb4d4" stroke-width="1.1"/>
    <!-- the icicle crown, rolled off and melting -->
    <path d="M6.4 80.6 L4.8 73.8 L8.6 77 L9.6 70 L12.4 76.6 L15 72.8 L15.2 79.4 C12.4 81.2 9.2 81.6 6.4 80.6 Z" fill="#9fd2ea" stroke-width="1.6"/>
    <path d="M9 81.4 C9 83 9.6 84 10.4 84.6 C11 83.8 11 82.6 10.6 81.4 Z" fill="#cfeeff" stroke-width="1"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Frost Wyrm, fallen: keeled over on its side in a spreading pool of frost, the paunch up, one foot stuck stiff in the
       air, X for eyes (a matched pair), the tongue out, the icicle moustache snapped off and lying in the frost, the
       ram horn cracked, its spines shattered and strewn about, a last thin breath of mist. Same parts, greyer. -->
  <defs>
    <filter id="fwd-ink" x="-6%" y="-6%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#1d1427"/><feComposite in2="SourceAlpha" operator="in"/><feOffset dx="1.1" dy="1.3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
<!-- a pool of frost -->
<path d="M6 110.6 C9 105.6 30 104.6 60 105 C88 105.4 110 105 114 108.6 C116.4 112.4 102 115.6 62 115.8 C30 116 5 114.6 6 110.6 Z" fill="#4f7ea8" opacity=".7"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Grave Ghoul: a hunched corpse-eater crawled up from the grave, shackle still on its ankle. Goofy pass: a huge lumpy head,
       a matched pair of googly eyes in sunken sockets, both staring at its next meal, an underbite of
       crooked teeth and a lolling tongue, spindly arms with giant claws, a ribby little potbelly on tiny bowed legs, a patched
       shroud and a sticking plaster on its skull. Flat cel: base + one shadow; ink offset down-right (filter). -->
  <defs>
    <filter id="gg-ink" x="-6%" y="-6%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#1d1427"/><feComposite in2="SourceAlpha" operator="in"/><feOffset dx="1.1" dy="1.3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#gg-ink)" stroke="#1d1427" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">

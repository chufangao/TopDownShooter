<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Grave Ghoul, attack key pose (Gnaw): lunging in, the front claw raked down and through, leaving three pale claw-trails;
       the jaw dropped wide, tongue flapping, both eyes popped wide and locked on the meal; the other
       claw flung back. Same parts as the alive picture, same feet line. -->
  <defs>
    <filter id="gga-ink" x="-6%" y="-6%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#1d1427"/><feComposite in2="SourceAlpha" operator="in"/><feOffset dx="1.1" dy="1.3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

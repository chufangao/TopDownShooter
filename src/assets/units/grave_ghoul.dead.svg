      <path d="M49.4 45 L50.2 47.2 L51.8 45.4 Z M62.4 45.8 L63.2 48 L64.6 45.6 Z M71 44.4 L71.6 46.2 L72.8 44 Z" fill="#e8dfc0" stroke-width="1"/>

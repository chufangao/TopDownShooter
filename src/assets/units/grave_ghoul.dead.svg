<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Grave Ghoul, fallen: face-planted forward in a slick of grave-ichor, chin in the dirt, X for eyes (a matched pair),
       the tongue spilled out on the ground, a tooth knocked loose; the shroud rucked over the hump, the shackled foot sole-up,
       the chain slack, its gnawed bone rolled out of its hand. Same parts as the alive picture, a little greyer. -->
  <defs>
    <filter id="ggd-ink" x="-6%" y="-6%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#1d1427"/><feComposite in2="SourceAlpha" operator="in"/><feOffset dx="1.1" dy="1.3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- a slick of grave-ichor -->
  <path d="M5 88.6 C6.6 85 20 84 40 84.4 C60 84.8 84 84.2 91.4 87.4 C94.6 90.4 84 93.2 60 93.4 C36 93.6 9.6 93.2 5 88.6 Z" fill="#33203d"/>

  <!-- Hive Drone: a small armoured wasp-bee of the hive hovering on a blur of wings, banded abdomen and a long stinger
       trailing. Goofy pass: a big round head tipped down at the target, a matched pair of compound eyes, both
       fixed below, a buck-toothed grin; one springy antenna, one bent at a right angle; a dented little armour
       plate on a fuzzy thorax, a fat striped bum far too big for it and a huge wobbly stinger; one big wing, one small; little
       legs in pointy boots. Drawn as before (the engine lifts it). -->
  <defs>
    <filter id="hd-ink" x="-6%" y="-6%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#1d1427"/><feComposite in2="SourceAlpha" operator="in"/><feOffset dx="1.1" dy="1.3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

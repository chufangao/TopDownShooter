<path d="M14 88.6 C16 86 30 85.4 48 85.6 C66 85.8 80 85.8 84 88 C85.6 90.4 76 92 50 92.2 C28 92.4 12 91.4 14 88.6 Z" fill="#4a4250" opacity=".9"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Hive Drone, dead: dropped out of the air onto its back, legs curled to the sky, eyes spun to spirals, one wing
       crumpled up and the other crushed flat, the big stinger limp with a bead of venom on its tip, the bent antenna flopped.
       Same parts, greyer. -->
  <defs>
    <filter id="hdd-ink" x="-6%" y="-6%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#1d1427"/><feComposite in2="SourceAlpha" operator="in"/><feOffset dx="1.1" dy="1.3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

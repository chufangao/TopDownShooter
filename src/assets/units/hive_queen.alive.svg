<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Hive Queen: two wardens and a reaper fused into one towering bee-mantis queen, resin crown, white-gold ruff, a swollen
       gold-banded abdomen, two scythes raised and two hands on a sceptre of glowing royal resin. Goofy pass: a huge swollen
       royal bum on dainty stick legs in pointed slippers, an enormous wonky ruff, a resin crown too big and perched askew, a
       haughty heart-shaped head with a matched pair of compound eyes looking down her nose at you (a
       monocle on the back one), a regal smirk and a beauty mark; one scythe curled up like a question; a crooked sceptre with a bit of comb
       stuck to it. A 2x2 kind: line weights and ink offset scaled down by ~1.75. -->
  <defs>
    <filter id="hq-ink" x="-6%" y="-6%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#1d1427"/><feComposite in2="SourceAlpha" operator="in"/><feOffset dx="0.65" dy="0.75"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

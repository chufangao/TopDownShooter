<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Hive Queen, dead: collapsed on her back with her legs curled to the sky and her scythes fallen limp, wings crushed
       beneath her, eyes spun to spirals, the monocle popped out on its chain; the resin crown knocked off and rolled aside,
       the sceptre snapped in two in a spreading pool of honey. Same parts, greyer. -->
  <defs>
    <filter id="hqd-ink" x="-6%" y="-6%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#1d1427"/><feComposite in2="SourceAlpha" operator="in"/><feOffset dx="0.65" dy="0.75"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
<!-- a spreading pool of honey -->
<path d="M4 88.6 C7 84.6 26 84 48 84.4 C70 84.8 89 84.6 93 87.6 C95 90.6 82 93.2 52 93.4 C26 93.6 3 92.4 4 88.6 Z" fill="#d8901e" opacity=".85"/>
<path d="M14 90.4 L22 90.8 M58 91.2 L68 91" fill="none" stroke="#ffe08a" stroke-width=".9" stroke-linecap="round" opacity=".8"/>
  <g filter="url(#hqd-ink)" stroke="#1d1427" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">

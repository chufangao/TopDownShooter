<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Hive Spitter: a gangly spitting-bug of the hive that keeps well back of the line, a sac of acid for a bum and a long
       snout to spit it through. Goofy pass: a big round head on a skinny neck, a matched pair of compound eyes, both
       fixed down the snout at the target, a drip of acid on the tip; one antenna springy, one drooping; a huge sloshing
       green sac far too big for it, banded and bubbling; a weedy little thorax with two stub wings; six spindly knobbly
       legs, one bandaged. Flat cel: base + one shadow; ink offset down-right. -->
  <defs>
    <filter id="hp-ink" x="-6%" y="-6%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#1d1427"/><feComposite in2="SourceAlpha" operator="in"/><feOffset dx="1.1" dy="1.3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

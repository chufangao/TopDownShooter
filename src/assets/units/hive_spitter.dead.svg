<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Hive Spitter, dead: keeled over onto its back, its six spindly legs curled up to the sky, the snout planted in the dirt
       and the eyes spun to spirals; the acid sac burst and gone flat as a balloon, spilled out in a fizzing green puddle,
       one antenna snapped. Same parts as the alive picture, a shade greyer. -->

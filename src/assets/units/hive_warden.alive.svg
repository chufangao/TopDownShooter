<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Hive Warden: a four-armed bee-knight priest of the hive, a honeycomb shield and a lantern of living resin on a staff.
       Goofy pass: a big fuzzy lump of a head on a barrel thorax, a matched pair of compound eyes, both
       watching the road, a smug crooked grin between its mandibles and a curl of proboscis; one antenna
       long and curled, one short and bent; wings much too small to lift it; one arm on its hip, one licking honey off a dipper;
       a lopsided comb shield dripping honey, a crooked staff, a badge pinned on crooked, skinny legs in big round boots. -->
  <defs>
    <filter id="hw-ink" x="-6%" y="-6%" width="116%" height="116%" color-interpolation-filters="sRGB">

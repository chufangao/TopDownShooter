<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Hive Warden, fallen: flipped on its back with its legs and arms curled to the sky, eyes spun to spirals, the
       proboscis lolled out; the lantern smashed in a spreading pool of honey, the comb shield cracked and the dipper dropped.
       Same parts, greyer. -->
  <defs>
    <filter id="hwd-ink" x="-6%" y="-6%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#1d1427"/><feComposite in2="SourceAlpha" operator="in"/><feOffset dx="1.1" dy="1.3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
<!-- a spreading pool of honey -->
<path d="M5 88.6 C8 84.6 26 84 48 84.4 C70 84.8 88 84.6 92 87.6 C94 90.6 82 93.2 52 93.4 C26 93.6 4 92.4 5 88.6 Z" fill="#d8901e" opacity=".85"/>
<path d="M16 90.4 L24 90.8 M60 91.2 L70 91" fill="none" stroke="#ffe08a" stroke-width="1.2" stroke-linecap="round" opacity=".8"/>
  <g filter="url(#hwd-ink)" stroke="#1d1427" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
<!-- the staff, dropped, and the smashed lantern -->
<g fill="none"><g stroke-width="4.6"><path id="hwd-staff" d="M8 87.6 L30 84.6 L50 86.6"/></g><use href="#hwd-staff" stroke="#a07c4c" stroke-width="2.4"/></g>

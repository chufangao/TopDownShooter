<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Iron Golem, attack key pose (Quake): the instant the big right anvil fist, hammered down from overhead, smashes into the
       floor ahead of it, while the left fist stays cocked back at its hip; the whole barrel squashes down on its stubby legs, the
       furnace roars white-hot, both stacks blast steam, both lamp eyes squint to slits with the effort, cracks and a shockwave run
       out over the stone to the right and rock chips fly. Same parts as the alive picture, feet on the same line. -->
  <defs>
    <filter id="iga-ink" x="-6%" y="-6%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#1d1427"/><feComposite in2="SourceAlpha" operator="in"/><feOffset dx="1.2" dy="1.4"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

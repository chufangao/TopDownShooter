<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Iron Golem, destroyed: toppled onto its back like a beetle, stubby legs in the air; the little helm knocked clean off and
       rolled away, its lamps gone dark (a matched pair of X's), a spring boinging out of the empty neck; the chained right forearm torn off
       and lying apart; the furnace cold and grey, one last curl of smoke rising from the bars; rivets and rubble strewn about.
       Same parts as the alive picture, a shade darker. -->
  <defs>
    <filter id="igd-ink" x="-6%" y="-6%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#1d1427"/><feComposite in2="SourceAlpha" operator="in"/><feOffset dx="1.2" dy="1.4"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- one last curl of smoke (no ink) -->
  <path d="M58 72 C54 66 60 62 58.6 56 C57.4 51 61.6 47.4 64.4 49.6 C61.6 50.4 60.6 53.4 61.6 56.4 C63 61.6 57.6 65.6 60.6 71.6 Z" fill="#8e8896" opacity=".8"/>
  <!-- oil and grit under the wreck -->
  <path d="M4 110.4 C8 106.8 30 106 60 106.4 C90 106.8 112 107 116 110 C118.6 113 100 115.6 60 115.6 C24 115.6 1 114 4 110.4 Z" fill="#2a2230"/>
  <g filter="url(#igd-ink)" stroke="#1d1427" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <!-- stubby legs up in the air, soles to the sky -->
    <path d="M75 84 L79.6 70 L90.4 72.4 L86.4 87.6 Z" fill="#4e4743"/>
    <path d="M84 92.6 L91.4 79.4 L101 84.6 L93.4 97.6 Z" fill="#4e4743"/>
    <path d="M76.4 72 C75.6 69 77 66.4 79.8 66 L91.4 64.6 C94.2 64.2 96 66 96 68.6 L96 71.4 C96 73 94.8 74 93.2 74.2 L79.6 75.8 C77.8 76 76.8 74.6 76.4 72 Z" fill="#776f68"/>
    <path d="M77.6 66.6 L95 64.6 L95 67.2 L78 69.2 Z" fill="#4e4743" stroke-width="1.4"/>
    <path d="M88.6 81.6 C88.6 78.8 90.4 77 93 77.2 L104.4 78.2 C107 78.4 108.6 80.4 108.2 83 L107.8 85.4 C107.6 87 106.4 87.8 104.8 87.6 L91.2 86.4 C89.4 86.2 88.6 84.6 88.6 81.6 Z" fill="#776f68"/>
    <path d="M90 77.6 L107.6 79.2 L107.2 81.8 L89.6 80.2 Z" fill="#4e4743" stroke-width="1.4"/>
    <!-- the short stack, snapped, poking out from under the shoulder -->
    <path d="M22 84.6 L12 81.4 L14 74.8 L24.4 78 Z" fill="#544c47"/>
    <path d="M13.4 83.2 L9.8 82 L12.6 73.2 L16.2 74.4 Z" fill="#b48a45"/>
    <!-- the barrel body on its back, the cold furnace face-up -->
    <path d="M20 94 C20 82 32 72.6 52 71.4 C74 70.2 87 76 90.6 88 C93.4 99 85 109.4 61 110.6 C37 111.6 20 106 20 94 Z" fill="#776f68"/>
    <path d="M87.4 90 C89 98.6 83 106.4 65 108.4 C53 109.6 41 109 32 106 C49 106.4 67 104.6 77.6 99.6 C83 96.6 86.4 93.6 87.4 90 Z" fill="#4e4743" stroke="none"/>
    <path d="M26 97.6 C38 101.6 72 102 89.4 96" fill="none" stroke-width="1.5"/>
    <g fill="#aaa196" stroke-width="1">
      <path d="M32 99 l2 0 l0 2 l-2 0 Z M46 101 l2 0 l0 2 l-2 0 Z M62 101.4 l2 0 l0 2 l-2 0 Z M77 99.6 l2 -.2 l.2 2 l-2 .2 Z"/>
    </g>
    <path d="M42 78 C50 74.4 66 74 76 76.6 C78.4 81.4 78 88 75.4 92 C64 94.4 52 94.6 43 92.4 C40.6 88 40.4 82.4 42 78 Z" fill="#3a3238"/>
    <path d="M49 80 C56 78.6 64 78.4 70 80" fill="none" stroke="#5a4a4a" stroke-width="2"/>
    <g fill="none">
      <g stroke-width="5"><path id="igd-bars" d="M47.4 77 L48 92.6 M54.6 75.4 L55 93.6 M62 75 L61.6 93.8 M69 75.6 L69.6 93.4"/></g>
      <use href="#igd-bars" stroke="#5c544e" stroke-width="2.6"/>
    </g>
    <!-- the rusty patch, hanging by one rivet -->
    <path d="M27 84 L36.4 81.4 L39.6 92.6 L30.4 95.4 Z" fill="#8f5a36" stroke-width="1.8"/>
    <path d="M29.6 85 l1.4 -.4" fill="none" stroke-width="2"/>
    <!-- the left shoulder and its rune band -->
    <path d="M14.6 92 C12 84 16.4 76.4 24.4 74.6 C32 73 38.6 77 39.6 83.6 C40.4 89 37 93.6 31.4 95 C24.6 96.6 17 96.6 14.6 92 Z" fill="#776f68"/>
    <path d="M36.4 87.4 C35 91.4 31.4 93.6 26 94.4 C21.6 95 17.8 94.4 16 92.6 C22 92.4 30 91.2 36.4 87.4 Z" fill="#4e4743" stroke="none"/>
    <g fill="none">
      <g stroke-width="5.4"><path id="igd-band" d="M17.2 81.4 C23 77.6 31 76.6 38.6 78.6"/></g>
      <use href="#igd-band" stroke="#b48a45" stroke-width="3"/>
    </g>
    <!-- the empty neck, and the spring boinging out of it -->
    <g fill="none">
      <g stroke-width="3.6"><path id="igd-spring" d="M14.6 80 C11 79 9.4 75.4 11.6 73.2 C13.4 75 15.6 75 16.4 73 C14 72 13.4 68.6 15.6 67.4 C16.8 69.4 19 69.6 19.8 67.6 C17.4 66.4 17 63.4 19 62"/></g>
      <use href="#igd-spring" stroke="#c9c0b4" stroke-width="1.6"/>
    </g>
    <path d="M17 62.6 C15.6 60 16.6 57.2 19.4 57 C22.2 56.8 23.4 59.8 21.6 62 Z" fill="#c9c0b4" stroke-width="1.4"/>
    <!-- the chained right forearm, torn off at the elbow, its big fist lying apart -->
    <g transform="translate(1.8 0)">
    <path d="M28.6 96.6 L28 110.4 L10 110.6 L10.4 96.4 Z" fill="#6a625c"/>
    <path d="M30 95.4 L32.6 98.4 L29.6 100.6 L32.8 103.2 L29.8 105.6 L32.4 108.4 L29.4 111" fill="none" stroke-width="1.6"/>
    <path d="M34 101 C36.4 100.6 37.4 102.6 36 104.2 M33.6 106 C36 106 36.8 108.4 35 109.6" fill="none" stroke="#d8a650" stroke-width="1.3"/>
    <g fill="none">
      <g stroke-width="5"><path id="igd-chain" d="M25.4 95 L23.6 111.4 M19.6 95.2 L17.6 111.4 M14 95.4 L12.2 111"/></g>
      <use href="#igd-chain" stroke="#8a8d95" stroke-width="2.6"/>
    </g>
    <path d="M2 98.4 C2 94.8 4.6 93 8 93 L11.6 93.2 C12.4 99 12.6 105.6 12 111.6 L6.4 111.6 C3.4 111.6 1.6 109.6 1.6 106.6 Z" fill="#776f68" stroke-width="2.2"/>
    <path d="M2.2 99.6 L11.6 99.4 M2.2 105 L11.8 104.8" fill="none" stroke-width="1.4"/>
    </g>
    <!-- the helm, knocked off and rolled away, its lamps out -->
    <g transform="translate(41 66) rotate(16 60 32)">
      <path d="M48.4 41.6 C47.6 34 48 27.6 50.6 21.6 C53.6 19.4 56.4 21.2 58.6 20.4 C61.8 19.2 67 19 70.4 21.2 C72.8 26.4 73.2 34 72.2 41.4 C64.6 43.2 55.6 43.4 48.4 41.6 Z" fill="#857c73"/>
      <path d="M70.2 25.6 C71.4 30.6 71.4 36.4 70.6 40.4 C66 41.6 60.6 41.8 56.6 41.6 C62.6 40 67.4 35 70.2 25.6 Z" fill="#4e4743" stroke="none"/>
      <path d="M50.4 27 C56.6 25.4 64.4 25.4 71 27 L70.6 35.6 C64 34 57.2 34 50.8 35.6 Z" fill="#2a2028" stroke-width="1.8"/>
      <path d="M54 28.4 L58.8 33.2 M58.8 28.4 L54 33.2 M62.6 28.4 L67.4 33.2 M67.4 28.4 L62.6 33.2" fill="none" stroke="#7a7070" stroke-width="1.9"/>
      <g fill="none">
        <g stroke-width="3.4"><path id="igd-bolt" d="M60.6 19.6 C60.4 16 59.4 13.4 56.4 12.4"/></g>
        <use href="#igd-bolt" stroke="#8a8d95" stroke-width="1.6"/>
      </g>
      <path d="M52.6 38.2 l1.6 0 M60 38.6 l1.6 0 M67.2 38 l1.6 0" fill="none" stroke-width="2"/>
    </g>
    <!-- rivets and rubble strewn about -->
    <path d="M42 112.4 l2 -1 l1 2 l-2 1 Z M70 113 l2.4 -.6 l.4 2.2 l-2.4 .4 Z M90 111.8 l2 0 l0 2 l-2 0 Z M54 112.8 l1.6 0 l0 1.6 l-1.6 0 Z" fill="#8a7f6e" stroke-width="1.2"/>
  </g>
</svg>

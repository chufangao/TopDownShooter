<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Mantis Reaper: a lean emerald mantis assassin in a tattered cowl, twin serrated scythes folded to strike. Goofy
       pass: a tall skinny stalk of a body on four stick legs with big flat feet, a huge triangular head with a matched pair of
       amber eyes at its corners, both bulging at the prey, a sly lopsided smirk, one long antenna and one bent;
       the cowl far too big and slipped back, a patch sewn on it crooked; a little hourglass on a string round its neck; the
       scythes folded up prayerfully, one bigger than the other. Flat cel, ink offset down-right. -->

<path d="M56 10.3 C57.7 10.9 59.8 14.4 59.8 16.5 S57.9 22.4 56.2 23.1 S50.7 22.2 49.5 20.4 S48.1 14.4 49.2 12.7 S54.2 9.7 56 10.3 Z" fill="#d8c890" stroke-width="1.6"/>
<path d="M50.9 13 L57.5 20.2 M57.5 13 L50.9 20.2" fill="none" stroke-width="2.5"/>
<path d="M69.4 10.6 C71.1 11.2 73.2 14.7 73.2 16.8 S71.3 22.7 69.6 23.4 S64.1 22.5 62.9 20.7 S61.5 14.7 62.6 13 S67.6 10 69.4 10.6 Z" fill="#d8c890" stroke-width="1.6"/>

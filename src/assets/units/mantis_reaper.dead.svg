<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Mantis Reaper, dead: flipped on its back with its stick legs curled stiff in the air, X for eyes (a matched
       pair), the cowl slipped off behind it, one scythe snapped at the wrist and the blade lying apart in a pool of green
       ichor, the hourglass run out beside it. Same parts, greyer. -->
  <defs>
    <filter id="mrd-ink" x="-6%" y="-6%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#1d1427"/><feComposite in2="SourceAlpha" operator="in"/><feOffset dx="1.1" dy="1.3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
<!-- a pool of green ichor -->
<path d="M5 88.6 C8 84.6 26 84 48 84.4 C70 84.8 88 84.6 92 87.6 C94 90.6 82 93.2 52 93.4 C26 93.6 4 92.4 5 88.6 Z" fill="#4e6a2a" opacity=".9"/>
  <g filter="url(#mrd-ink)" stroke="#1d1427" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
<!-- the cowl, slipped off behind -->
<path d="M6 88.6 C6 88.6 6.7 82.1 8 80 S11.7 76.3 14 76 S20 76.7 22 78 S25 82.2 26 84 S28 88.6 28 88.6 L6 88.6 Z" fill="#4a3366"/>
<path d="M12 82.4 L17 81.4 L17.6 86 L12.6 86.8 Z" fill="#867494" stroke-width="1.2"/>
<!-- the abdomen and thorax on their back -->
<path d="M24 86 C23.3 84.6 26.7 81.6 30 80 S39 77.1 44 76.4 S56 75.4 60 76 S67 78.2 68 80 S69 85.6 66 87 S55.3 88.3 50 88.6 S38.3 89 34 88.6 S24.7 87.4 24 86 Z" fill="#7fa648"/>
<path d="M36 78.6 L37 87 M44 77.4 L44.6 87.6 M52 77 L52.4 88" fill="none" stroke-width="1.2" stroke="#557a2c"/>
<!-- stick legs curled stiff to the sky -->
<g fill="none"><g stroke-width="3.8"><path id="mrd-legs" d="M36 78 L32 68 L36 60 M44 77 L44 66 L48 60 M52 77 L56 68 L54 60 M60 77 L66 68 L70 62"/></g><use href="#mrd-legs" stroke="#557a2c" stroke-width="1.9"/></g>
<!-- wings crushed under it -->
<path d="M28 88.4 C26 88.3 24 89 22 89.4 S15.3 90.3 16 90.6 S23 91.1 26 91 S33.7 90.4 34 90 S30 88.5 28 88.4 Z" fill="#b4cc94" stroke-width="1.6"/>
<!-- one scythe still on, limp; the other snapped at the wrist -->
<path d="M60 78 C60.7 76.7 64 75.3 66 74 S70.7 70.2 72 70 S74.7 71.3 74 72.6 S70 76.4 68 78 S63.3 82 62 82 S59.3 79.3 60 78 Z" fill="#7fa648"/>
<path d="M72 70 C72.8 69.5 75.7 69.3 78 70 S84 72.3 86 74 S90 79.3 90 80 S88 78.9 86 78 S80.2 75.4 78 74.6 S74 73.8 73 73 S71.2 70.5 72 70 Z" fill="#ccdca6" stroke-width="1.8"/>
<path d="M78 74 L79 76.6 L81 75.4 L82 78 L84 76.6 Z" fill="#ccdca6" stroke-width="1.1"/>
<!-- the head, upside down, X eyes, mandibles agape -->
<g transform="translate(70 80) rotate(160) scale(.74) translate(-62 -20)"><path d="M47 15 C47.8 12.7 50.8 10.6 54 9.4 S62.3 7.6 66 8 S74.2 10 76 12 S77.7 17.3 77 20 S73.8 25.7 72 28 S68 32.8 66 34 S61.8 35.7 60 35 S56.8 32 55 30 S50.3 25.5 49 23 S46.2 17.3 47 15 Z" fill="#7fa648"/>

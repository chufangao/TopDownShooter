<path d="M58 30 C58.2 29.8 62 33.3 64 33.4 S68.7 31.8 70 30.6 S72 26 72 26 C72 26 70.5 30.2 69 31.6 S64.8 34.9 63 34.6 S57.8 30.2 58 30 Z" fill="#3b1630" stroke-width="1.4"/>
<path d="M62 33.6 C61.5 33.9 62 36.6 62.4 37.4 S64.1 38.9 64.6 38.6 S65.8 36.4 65.4 35.6 S62.5 33.3 62 33.6 Z" fill="#c9667e" stroke-width="1.2"/>
<g fill="none"><g stroke-width="3"><path id="mrd-ant" d="M58 10 C58 5 61 3 66 3.6 M54 11 C50 7 47 6.4 44.6 7.6"/></g><use href="#mrd-ant" stroke="#557a2c" stroke-width="1.3"/></g></g>
<!-- the snapped-off blade lying apart, and the hourglass, run out -->
<path d="M30 90 C30.3 89.4 36.7 88 40 87.6 S47.3 87.5 50 87.8 S56.3 89.1 56 89.6 S51 90.5 48 90.8 S41 91.5 38 91.4 S29.7 90.6 30 90 Z" fill="#ccdca6" stroke-width="1.6"/>
<path d="M84.6 84 L90.6 84.6 L88 88 L90.4 91.6 L84.6 91.2 L87.4 87.6 Z" fill="#dfe8ea" stroke-width="1.2"/>
<path d="M85.6 90.6 L89.4 90.8 L87.6 88.8 Z" fill="#e8d080" stroke="none"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Marsh Hag: a crooked bog witch hunched under a shawl of woven reeds and wet moss, one milky eye, muttering over a
       gnarled driftwood staff hung with bone charms and a tiny cage, violet hex-light flickering at its tip. Goofy pass: a
       huge hump, the head thrust forward and low, a huge hooked warty nose, a matched pair of eyes (one beady, one milky)
       both staring at you, a crooked mouth with one snaggle tooth, a chin wart with two whiskers; lank stringy hair with one
       strand stuck up; a frog sat on her head like a hat; long crooked nails; big webbed bog feet; patched purple rags. -->
  <defs>
    <filter id="mh-ink" x="-6%" y="-6%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#1d1427"/><feComposite in2="SourceAlpha" operator="in"/><feOffset dx="1.1" dy="1.3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

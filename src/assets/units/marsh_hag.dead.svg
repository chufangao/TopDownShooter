<path d="M88 82 C86 78 89 75.6 87.6 72 C86.8 69.6 88.6 67.6 90.6 68.4" fill="none" stroke="#c48aff" stroke-width="1.8" stroke-linecap="round" opacity=".7"/>
  <g filter="url(#mhd-ink)" stroke="#1d1427" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
<!-- the staff snapped in two -->
<g fill="none"><g stroke-width="4.6"><path id="mhd-staff" d="M6 88 L30 86 M62 90.6 L80 89.4 C84 89 86.6 86 85 83.4"/></g><use href="#mhd-staff" stroke="#a49478" stroke-width="2.6"/></g>

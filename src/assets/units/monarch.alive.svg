<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- The Monarch: a tall hooded necromancer in layered grave-robes, leaning on a staff of black bone topped by a skull lantern, a crown of pale flame floating over its hood. Lit from the upper left, rim-lit pale green by its own crown. -->
  <defs>
    <linearGradient id="mo-robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a4f72"/>
      <stop offset="0.45" stop-color="#2f2842"/>
      <stop offset="1" stop-color="#14101e"/>
    </linearGradient>
    <linearGradient id="mo-robe-back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2338"/>
      <stop offset="1" stop-color="#0e0b15"/>
    </linearGradient>
    <linearGradient id="mo-mantle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a5a56"/>
      <stop offset="0.5" stop-color="#26302f"/>
      <stop offset="1" stop-color="#111716"/>
    </linearGradient>
    <linearGradient id="mo-hood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#655a80"/>
      <stop offset="0.5" stop-color="#342c48"/>
      <stop offset="1" stop-color="#16121f"/>
    </linearGradient>
    <radialGradient id="mo-hood-in" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#1d2a26"/>
      <stop offset="1" stop-color="#05070a"/>
    </radialGradient>
    <linearGradient id="mo-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b3352"/>
      <stop offset="1" stop-color="#1a1526"/>
    </linearGradient>
    <linearGradient id="mo-bone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1ead6"/>
      <stop offset="0.55" stop-color="#cfc5a8"/>
      <stop offset="1" stop-color="#8f846c"/>
    </linearGradient>
    <linearGradient id="mo-staff" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a4152"/>
      <stop offset="0.5" stop-color="#26202d"/>
      <stop offset="1" stop-color="#110d16"/>
    </linearGradient>
    <linearGradient id="mo-flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f4fff6"/>
      <stop offset="0.4" stop-color="#c8f5d2"/>
      <stop offset="1" stop-color="#7fe0a4" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="mo-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e9fff0"/>
      <stop offset="0.35" stop-color="#9ff0bc"/>
      <stop offset="1" stop-color="#9ff0bc" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- the crown's light, a soft halo behind the head -->
  <circle cx="50" cy="12" r="15" fill="url(#mo-glow)" opacity="0.35"/>

  <!-- under-robe: the older burial layer, longer and darker, trailing on the ground -->
  <path d="M35 34 C30 50 25 68 19 87 L25 85 L29 89 L34 86 L39 89.5 L44 86.5 L50 89.5 L55 86.5 L60 89.5 L65 86 L70 89 L75 85.5 L79 87 C72 68 67 50 62 34 Z" fill="url(#mo-robe-back)" stroke="#0d0a12" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M26 82 l-0.6 3 M37 84 l0 3.4 M48 84.5 l0.2 3.6 M58 84.4 l0 3.4 M69 83.6 l0.6 3" stroke="#2c2439" stroke-width="0.5" stroke-linecap="round"/>

  <!-- main robe: deep grave-violet, falling in long folds -->
  <path d="M36 33 C32 48 29 64 25 84 L30 82 L33 86 L38 83 L42 86.5 L47 83.4 L52 86.4 L56 83.2 L61 86 L65 82.4 L70 84.6 C67 64 64 48 60 33 Z" fill="url(#mo-robe)" stroke="#0d0a12" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- folds: shadowed creases and lit ridges -->
  <path d="M37 46 C35 58 33 70 31 81 M43 50 C42 62 41.5 72 41.6 84 M55 52 C56 64 56.6 74 57 83 M60 44 C62 56 64 68 66 81" fill="none" stroke="#0e0a16" stroke-width="0.9" stroke-linecap="round" opacity="0.9"/>
  <path d="M35.6 44 C33.8 56 32 68 30 79 M41.4 49 C40.6 60 40.2 70 40.2 80" fill="none" stroke="#8a7fa6" stroke-width="0.6" stroke-linecap="round" opacity="0.7"/>
  <!-- the pale hem, a band of faded embroidery -->
  <path d="M27.4 79 Q47 75.4 68.4 79" fill="none" stroke="#8fbfa2" stroke-width="0.7" stroke-dasharray="1.4 1.2" opacity="0.55"/>

  <!-- inner panel down the front, edged in tarnished silver, stitched with grave-glyphs -->
  <path d="M43 40 L53 40 L55 84 L51 82 L48 85 L45 82 L41 84 Z" fill="url(#mo-panel)" stroke="#0d0a12" stroke-width="1" stroke-linejoin="round"/>
  <path d="M43.6 42 L42 82.6 M52.4 42 L54 82.6" stroke="#9aa3a8" stroke-width="0.6" opacity="0.8"/>
  <g fill="none" stroke="#9ff0bc" stroke-width="0.6" stroke-linecap="round" opacity="0.75">
    <path d="M48 50 l0 5 M46 52.5 l4 0 M46.4 50.4 l3.2 4.2"/>
    <path d="M48 62 q-2 2 0 4 q2 2 0 4"/>
    <path d="M46.2 75 l1.8 -2.6 l1.8 2.6 Z"/>
  </g>

  <!-- sash and a hanging chain of finger bones -->
  <path d="M37.6 56 Q48 60 59.4 56 L59.6 59.4 Q48 63.6 37.4 59.4 Z" fill="#251c33" stroke="#0d0a12" stroke-width="0.9" stroke-linejoin="round"/>
  <path d="M38.4 57.4 Q48 61.2 58.6 57.4" fill="none" stroke="#6f6290" stroke-width="0.5"/>
  <circle cx="48" cy="60" r="2" fill="#b8c2c4" stroke="#0d0a12" stroke-width="0.7"/>
  <circle cx="48" cy="60" r="0.8" fill="#9ff0bc"/>
  <path d="M55.6 59.6 Q56.6 64 55.8 68.6" fill="none" stroke="#5b5163" stroke-width="0.6"/>
  <g fill="url(#mo-bone)" stroke="#0d0a12" stroke-width="0.45">
    <rect x="55" y="62" width="1.6" height="2.4" rx="0.7"/>
    <rect x="55.2" y="65.2" width="1.5" height="2.2" rx="0.7"/>
    <rect x="55" y="68.2" width="1.6" height="2.6" rx="0.7"/>
  </g>

  <!-- the mantle: a ragged moss-dark cape over both shoulders -->
  <path d="M31 33 Q48 25 65 33 L67 46 L63.4 43.6 L61.6 48 L58 44.4 L55 48.6 L52 45 L48.6 49 L45.4 45 L42 48.8 L39.4 44.6 L35.4 48 L33.4 43.6 L29.6 46 Z" fill="url(#mo-mantle)" stroke="#0d0a12" stroke-width="1.1" stroke-linejoin="round"/>
  <path d="M33 35 Q42 30.4 50 30.4" fill="none" stroke="#9db5ad" stroke-width="0.9" stroke-linecap="round" opacity="0.7"/>
  <path d="M37 37 L37.6 43 M44 36.6 L44.4 44.6 M52 36.6 L51.6 44.4 M59 37 L58.6 42.6" fill="none" stroke="#0b100f" stroke-width="0.6"/>
  <!-- a bone clasp at the throat -->
  <path d="M45 33.6 L51 33.6 L50 37 L46 37 Z" fill="url(#mo-bone)" stroke="#0d0a12" stroke-width="0.7" stroke-linejoin="round"/>
  <circle cx="48" cy="35.2" r="0.8" fill="#4f6e66"/>

  <!-- the free arm, folded at the waist under the mantle; a gaunt pale hand with a green pulse at the fingertips -->
  <path d="M59 42 Q66 48 64 56 Q60 58.6 56 56.4 Q57.6 50 56 45 Z" fill="url(#mo-robe)" stroke="#0d0a12" stroke-width="1" stroke-linejoin="round"/>
  <path d="M59.6 44 Q63.4 48.6 62.6 54" fill="none" stroke="#7d729a" stroke-width="0.5" opacity="0.8"/>
  <path d="M56.4 55.4 Q58.6 54 61 55 Q61.6 57.6 59.6 58.6 L56.6 58.6 Q55.4 57.4 56.4 55.4 Z" fill="url(#mo-bone)" stroke="#0d0a12" stroke-width="0.7" stroke-linejoin="round"/>
  <path d="M56.6 58.4 l-1 1.6 M58 58.6 l-0.4 2 M59.4 58.4 l0.2 1.8" stroke="#0d0a12" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M56.6 58.4 l-1 1.6 M58 58.6 l-0.4 2 M59.4 58.4 l0.2 1.8" stroke="#d6cdb3" stroke-width="0.5" stroke-linecap="round"/>
  <circle cx="57.6" cy="61" r="1.6" fill="url(#mo-glow)" opacity="0.8"/>

  <!-- the staff of black bone, planted beside it, gnarled and banded -->
  <path d="M21.6 18 L24.6 18 L25.4 88 L22.2 88 Z" fill="url(#mo-staff)" stroke="#0d0a12" stroke-width="1" stroke-linejoin="round"/>
  <path d="M22.4 22 L23 86" stroke="#7a6f86" stroke-width="0.5" opacity="0.7"/>
  <g fill="url(#mo-bone)" stroke="#0d0a12" stroke-width="0.6">
    <ellipse cx="23.5" cy="34" rx="2.6" ry="1.1"/>
    <ellipse cx="23.8" cy="62" rx="2.6" ry="1.1"/>
    <ellipse cx="24" cy="76" rx="2.4" ry="1"/>
  </g>
  <path d="M22.4 40 q1.6 1 0.4 3 M23.8 68 q-1.4 1.2 0 2.6" fill="none" stroke="#0d0a12" stroke-width="0.6"/>

  <!-- staff hand: a bony grip under a falling sleeve -->
  <path d="M33 38 Q27 44 26.4 50 Q29 53.4 32.6 52 Q33.6 46 36.6 42 Z" fill="url(#mo-robe)" stroke="#0d0a12" stroke-width="1" stroke-linejoin="round"/>
  <path d="M31.6 40.4 Q28.4 44.6 27.6 49" fill="none" stroke="#8a7fa6" stroke-width="0.6" opacity="0.8"/>
  <path d="M21 47.4 Q23.4 45.4 27 46.4 Q28.4 49.2 26.8 51.6 Q23.6 52.6 21.2 50.8 Z" fill="url(#mo-bone)" stroke="#0d0a12" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M21.6 48.6 L26.6 48.4 M21.8 50 L26.2 50" stroke="#6e6452" stroke-width="0.45"/>

  <!-- the skull lantern atop the staff: a small horned skull with a pale flame inside -->
  <circle cx="23.2" cy="11.6" r="7" fill="url(#mo-glow)" opacity="0.5"/>
  <path d="M18.6 12.6 Q18.2 7 23.2 6.6 Q28.2 7 27.8 12.6 Q27.6 15.4 26 16.4 L25.6 18.4 L20.8 18.4 L20.4 16.4 Q18.8 15.4 18.6 12.6 Z" fill="url(#mo-bone)" stroke="#0d0a12" stroke-width="0.9" stroke-linejoin="round"/>
  <path d="M19.6 11 Q20.4 8.2 23 7.8" fill="none" stroke="#fbf6e8" stroke-width="0.7" stroke-linecap="round"/>
  <path d="M19.8 12.6 Q20.4 11 21.8 11.4 Q22.6 12.6 21.6 13.8 Q20.2 14 19.8 12.6 Z M26.6 12.6 Q26 11 24.6 11.4 Q23.8 12.6 24.8 13.8 Q26.2 14 26.6 12.6 Z" fill="#0b120f"/>
  <circle cx="20.9" cy="12.6" r="0.75" fill="#c8f5d2"/><circle cx="25.5" cy="12.6" r="0.75" fill="#c8f5d2"/>
  <path d="M22.6 14.4 L23.2 15.6 L23.8 14.4 Z" fill="#0b120f"/>
  <path d="M21.4 17 l0 1.2 M22.6 17 l0 1.3 M23.8 17 l0 1.3 M25 17 l0 1.2" stroke="#5c5444" stroke-width="0.4"/>
  <!-- little horns of bone -->
  <path d="M19 9.6 Q16.4 7.6 16.6 4.4 Q18.4 6.6 20.4 7.6 Z M27.4 9.6 Q30 7.6 29.8 4.4 Q28 6.6 26 7.6 Z" fill="url(#mo-bone)" stroke="#0d0a12" stroke-width="0.6" stroke-linejoin="round"/>

  <!-- the hood: tall and pointed, its peak bowed forward -->
  <path d="M36.6 33.6 C35 26 36 18 41 12.6 Q46 7.6 52.6 9.6 Q60 12.6 61 22 C61.6 27 60.6 31 59.6 34 Q48 37.4 36.6 33.6 Z" fill="url(#mo-hood)" stroke="#0d0a12" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M38.6 28 C38 21 40.4 15.4 45 12.4" fill="none" stroke="#a69bc2" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
  <path d="M57.6 18 Q59.6 24 58.6 31" fill="none" stroke="#0e0a16" stroke-width="0.8"/>
  <!-- the hood's mouth: dark, a gaunt pale face half-seen, two eyes of pale fire -->
  <path d="M41.4 31.6 C40.4 25 42.6 19 48.4 17.4 C54 18.6 56.4 24.4 55.2 31.6 Q48.4 34 41.4 31.6 Z" fill="url(#mo-hood-in)" stroke="#0d0a12" stroke-width="0.9" stroke-linejoin="round"/>
  <path d="M44.6 30.4 Q44.2 25.6 48.2 24 Q52.2 25.6 51.8 30.4 Q48.2 32 44.6 30.4 Z" fill="#9e9a8e" opacity="0.28"/>
  <ellipse cx="48.2" cy="25.6" rx="6" ry="2.4" fill="url(#mo-glow)" opacity="0.45"/>
  <path d="M45 25.4 Q46 24.4 47 25.4 M49.6 25.4 Q50.6 24.4 51.6 25.4" fill="none" stroke="#e9fff0" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="46" cy="25.6" r="0.7" fill="#ffffff"/><circle cx="50.6" cy="25.6" r="0.7" fill="#ffffff"/>
  <path d="M41.8 31 Q48.4 33.2 55 31" fill="none" stroke="#7d729a" stroke-width="0.6"/>

  <!-- the crown: a thin circlet of tarnished silver around the hood, and above it a ring of pale flame -->
  <path d="M40.2 16.4 Q48.6 12.6 58.4 16.4 L58.2 18.4 Q48.6 14.8 40.4 18.4 Z" fill="#9aa3a8" stroke="#0d0a12" stroke-width="0.7" stroke-linejoin="round"/>
  <path d="M41.2 16.6 Q48.6 13.4 57.4 16.6" fill="none" stroke="#e6ecef" stroke-width="0.4"/>
  <g stroke="#0d0a12" stroke-width="0.5" stroke-linejoin="round">
    <path d="M41.6 16.4 Q40.4 12 42.6 8.4 Q42.8 11.6 44.6 14 Z" fill="url(#mo-flame)"/>
    <path d="M45 14.6 Q44.4 9 47 4.8 Q47.4 9.4 48.6 13.2 Z" fill="url(#mo-flame)"/>
    <path d="M48.8 13.6 Q49.2 7.4 51.6 2.8 Q51.8 8.4 52.8 13.4 Z" fill="url(#mo-flame)"/>
    <path d="M53 14 Q54.2 9 56.8 6.4 Q56 10.4 56.6 14.8 Z" fill="url(#mo-flame)"/>
    <path d="M56.6 15.4 Q58.4 12 60.6 10.8 Q59.4 13.6 58.6 16.6 Z" fill="url(#mo-flame)"/>
  </g>
  <g fill="#f4fff6">
    <circle cx="42.8" cy="13.2" r="0.6"/><circle cx="47" cy="10" r="0.7"/><circle cx="51.4" cy="8.6" r="0.7"/><circle cx="55.6" cy="11.4" r="0.6"/>
  </g>
  <!-- motes drifting up off the crown -->
  <g fill="#c8f5d2">
    <circle cx="53.6" cy="2.6" r="0.6" opacity="0.8"/><circle cx="44.4" cy="3.6" r="0.45" opacity="0.6"/><circle cx="59.4" cy="7" r="0.5" opacity="0.7"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- The Monarch: a tall hooded necromancer in layered grave-robes, leaning on a staff of black bone topped by a skull
       lantern, crowned. Goofy pass, dignified: a gold crown a size too big, slipping down over the hood, soulfire on its tines;
       a long nose and a pointed little beard poking out of the hood; a matched pair of essence-lit eyes sizing up the
       field, one brow hiked in disdain, a regal smirk with one gold tooth; the skull lantern goofy
       too; a big pale hand held up, pinky out, an essence mote over it; tiny curly slippers under a ragged hem.
       Flat cel: base + one shadow; ink offset down-right (filter). -->
  <defs>
    <filter id="mo-ink" x="-6%" y="-6%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#1d1427"/><feComposite in2="SourceAlpha" operator="in"/><feOffset dx="1.1" dy="1.3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- the essence mote over its palm (no ink) -->
  <path d="M73.6 46.6c-.4-1 .3-3.8.8-4.2s2 2 2 2 .6-4.7 1.2-4.8 2.1 2.7 2.4 4 0 3.2-.6 4-1.8 1.2-2.8 1-2.6-1-3-2Z" fill="#5ef0c0" stroke="none" opacity=".9"/>

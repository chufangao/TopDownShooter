    <g transform="translate(30 72) rotate(-78) scale(.8) translate(-56 -34)"><!-- the hood: deep, its point poking up behind the crown --><path d="M37.6 46c-2.1-1.6-3.3-5-4.2-8s-1.2-6.8-1-10 1-6.6 2-9.4 3-5.3 4.2-7.6 3-6.2 3-6.2 1.5 5.1 3.4 6.6 5.2 1.5 8 2.2 6.1.6 8.6 1.8 4.7 3.1 6.2 5.4 2.5 5.5 2.8 8.2-.1 5.6-1 8-1.9 4.7-4.2 6.4-6.2 2.9-9.4 3.6-6.9.8-10 .6-6.3 0-8.4-1.6Z" fill="#433a5e"/><path d="M36.2 30c-.3-1.4.2-5.6.8-8s2.6-6.5 3-6.4-.2 4.5-.4 7-.4 6.6-1 7.8-2.1 1-2.4-.4Z" fill="#4e4470" stroke="none"/><path d="M67.4 33c.4.5 0 4.8-1 6.6s-2.7 3.4-4.8 4.4-7.3 2-7.6 1.6 4.3-2.5 6-4 2.8-3.6 4-5 3-4.1 3.4-3.6Z" fill="#2c2440" stroke="none"/><!-- the dark inside of the hood --><path d="M45.4 23c1.6-1.3 5.3-2.9 8.2-3.4s6.9-.3 9.4.6 4.5 2.8 5.6 4.8 1.3 4.6 1 7-1.1 5.6-3 7.4-5.7 2.9-8.6 3.2-6.8.2-9-1.2-3.6-5.1-4.4-7.4-.7-4.8-.6-6.6-.2-3.1 1.4-4.4Z" fill="#231a36" stroke-width="1.8"/><!-- the face: pale, a long nose poking out of the hood --><path d="M48 25c1.5-1.2 5-2.5 7.6-2.8s6 .3 8 1.2 2.7 2.8 3.8 4 1.5 1.9 3 3.2 6.2 4.6 6.2 4.6-4.8.4-6.2 1.2-.7 2.5-2 3.6-3.7 2.4-5.8 3.2-5 1.6-7 1.4-3.6-1.2-5-2.6-2.6-3.9-3.2-6-.7-4.8-.6-6.6-.3-3.2 1.2-4.4Z" fill="#b8b0c6"/><path d="M67.4 37.2c.9 0-.6 2.8-1.8 3.8s-3.8 1.9-5.6 2.4-5.5.8-5.4.4 3.7-1.7 5.8-2.8 6.1-3.8 7-3.8Z" fill="#857c9a" stroke="none"/><path d="M71 33.2c.7-.1 4.1 1.6 4 2s-3.7.7-4.4.4-.3-2.3.4-2.4Z" fill="#857c9a" stroke="none"/><path d="M50 28c.2-.9 1.6-2.7 2.6-3.4s3.4-1.3 3.4-1-2.6 1.9-3.4 3-1 3.2-1.4 3.4-1.4-1.1-1.2-2Z" fill="#cfc8da" stroke="none"/><!-- the hollow round the eyes --><path d="M48.8 28c.4-1.4 2.4-2.7 3.8-3s3.3 1.4 4.8 1.4 2.7-1.4 4.2-1.4 3.6.5 4.6 1.4 1.6 2.8 1.6 4.2-.8 3.4-1.8 4.2-3.1.8-4.4.6-2.4-1.8-3.6-1.8-2.3 1.6-3.6 1.6-3.5-.4-4.4-1.6-1.6-4.2-1.2-5.6Z" fill="#857c9a" stroke="none"/><!-- X for eyes, a matched pair --><path d="M52.6 26.1c1.1-.2 3.2.4 4 1.2s1.4 2.7 1 3.7-2 2.5-3.1 2.8-3.2-.3-3.9-1.2-.7-3.1-.4-4.2 1.3-2.1 2.4-2.3Z" fill="#d6e4de" stroke-width="1.6"/><path d="M51.3 27.6l4.8 4.8m-.1-4.9
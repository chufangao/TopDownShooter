<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- The Monarch, fallen: its grave-robes collapsed into an empty heap, the hood flat and dark, the staff fallen across the ground with its skull lantern cold, and the crown rolled free, a dull circlet with its flame gone to a thread of grey smoke. -->
  <defs>
    <linearGradient id="mod-robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c435f"/>
      <stop offset="0.5" stop-color="#2a2439"/>
      <stop offset="1" stop-color="#120f1a"/>
    </linearGradient>
    <linearGradient id="mod-robe-back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#262033"/>
      <stop offset="1" stop-color="#0c0a12"/>
    </linearGradient>
    <linearGradient id="mod-mantle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3e4b48"/>
      <stop offset="0.5" stop-color="#222a29"/>
      <stop offset="1" stop-color="#0f1413"/>
    </linearGradient>
    <linearGradient id="mod-hood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#574d6e"/>
      <stop offset="0.55" stop-color="#2f2841"/>
      <stop offset="1" stop-color="#14111c"/>
    </linearGradient>
    <radialGradient id="mod-hood-in" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#15181a"/>
      <stop offset="1" stop-color="#05060a"/>
    </radialGradient>
    <linearGradient id="mod-bone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2d9c1"/>
      <stop offset="0.55" stop-color="#bdb196"/>
      <stop offset="1" stop-color="#837863"/>
    </linearGradient>
    <linearGradient id="mod-staff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#433b4b"/>
      <stop offset="0.5" stop-color="#241e2b"/>
      <stop offset="1" stop-color="#100c15"/>
    </linearGradient>
    <radialGradient id="mod-ash" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#262a2a"/>
      <stop offset="1" stop-color="#121516"/>
    </radialGradient>
    <radialGradient id="mod-ember" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5f7a6c" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#5f7a6c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- grave-dust where it fell -->
  <path d="M8 84 Q10 75 28 72 Q48 67.4 70 70 Q87 73 88.6 82 Q89.4 90.4 74 92.8 Q50 95.6 26 93.8 Q7 92 8 84 Z" fill="url(#mod-ash)" stroke="#0d0a12" stroke-width="1" stroke-linejoin="round"/>
  <path d="M14 80 Q22 75.6 32 74.6 M66 72.6 Q78 74.4 84 80" fill="none" stroke="#3a4342" stroke-width="0.6" opacity="0.7"/>

  <!-- the staff, fallen behind the heap -->
  <path d="M30 63.4 L84 70.6 L83.6 73.6 L29.6 66.4 Z" fill="url(#mod-staff)" stroke="#0d0a12" stroke-width="1" stroke-linejoin="round"/>
  <path d="M31 64.4 L83.4 71.4" stroke="#6f667a" stroke-width="0.45" opacity="0.6"/>
  <g fill="url(#mod-bone)" stroke="#0d0a12" stroke-width="0.6">
    <ellipse cx="46" cy="66" rx="1.1" ry="2.4" transform="rotate(8 46 66)"/>
    <ellipse cx="66" cy="68.6" rx="1.1" ry="2.4" transform="rotate(8 66 68.6)"/>
  </g>
  <!-- its skull lantern, tipped over, the sockets cold -->
  <g transform="rotate(20 86 70)">
    <path d="M81.4 70.6 Q81 65 86 64.6 Q91 65 90.6 70.6 Q90.4 73.4 88.8 74.4 L88.4 76.4 L83.6 76.4 L83.2 74.4 Q81.6 73.4 81.4 70.6 Z" fill="url(#mod-bone)" stroke="#0d0a12" stroke-width="0.9" stroke-linejoin="round"/>
    <path d="M82.6 70.6 Q83.2 69 84.6 69.4 Q85.4 70.6 84.4 71.8 Q83 72 82.6 70.6 Z M89.4 70.6 Q88.8 69 87.4 69.4 Q86.6 70.6 87.6 71.8 Q89 72 89.4 70.6 Z" fill="#0b0d0e"/>
    <path d="M85.4 72.4 L86 73.6 L86.6 72.4 Z" fill="#0b0d0e"/>
    <path d="M81.8 67.6 Q79.2 65.6 79.4 62.4 Q81.2 64.6 83.2 65.6 Z M90.2 67.6 Q92.8 65.6 92.6 62.4 Q90.8 64.6 88.8 65.6 Z" fill="url(#mod-bone)" stroke="#0d0a12" stroke-width="0.6" stroke-linejoin="round"/>
    <path d="M87.4 66 L88.2 67.8 L87.2 69" fill="none" stroke="#0d0a12" stroke-width="0.6"/>
  </g>

  <!-- under-robe, splayed flat -->
  <path d="M12 82 Q14 74 24 72 Q32 68 44 69 Q56 68 62 74 Q66 80 64 86 L60 88 L58 91 L54 88.6 L50 91.4 L46 89 L42 92 L38 89.4 L34 92 L30 89 L26 91.6 L22 88.4 L18 90.4 L15.6 87 Q11 86 12 82 Z" fill="url(#mod-robe-back)" stroke="#0d0a12" stroke-width="1.1" stroke-linejoin="round"/>

  <!-- the grave-violet robe, collapsed into an empty mound -->
  <path d="M16 80 Q17 72 26 69 Q34 64.6 44 66.4 Q54 66 59 71 Q63 76 61 83 L57.6 85.4 L55.6 88.6 L52 86.4 L48.6 89.4 L45 87 L41.4 89.8 L38 87.2 L34.4 89.6 L31 86.8 L27.4 88.6 L24.4 85.6 L20.6 87 Q15.6 85 16 80 Z" fill="url(#mod-robe)" stroke="#0d0a12" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M19 80 Q24 76.6 29 78.6 M22 85 Q28 80.6 34 83 M46 82 Q51 78.6 56.4 80.6 M36 84.6 Q39 82 42 84" fill="none" stroke="#0e0a16" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M18.4 78 Q22 74.6 26.4 75 M21.6 82.6 Q26 79.4 29.6 80.4" fill="none" stroke="#8a7fa6" stroke-width="0.6" opacity="0.6" stroke-linecap="round"/>
  <!-- the inner panel, its glyphs gone dark -->
  <path d="M36 70 L44 69.6 L45.6 82 L42 80.4 L39.6 83 L37 80.2 L34.6 82 Z" fill="#251f33" stroke="#0d0a12" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M40 73 l0 4 M38.4 75 l3.2 0" fill="none" stroke="#56645c" stroke-width="0.5"/>

  <!-- the mantle, draped over the heap -->
  <path d="M22 70 Q32 63 44 64 Q54 64.4 58 69 Q59.6 73 57 76 L54.4 74.6 L53 78.4 L50 75.6 L47.6 79.4 L45 76 L42 79.6 L39.6 75.6 L36.4 78.6 L34.6 74.8 L31.2 77.2 L30 73.6 L26.6 75.2 Q23 73.6 22 70 Z" fill="url(#mod-mantle)" stroke="#0d0a12" stroke-width="1.1" stroke-linejoin="round"/>
  <path d="M28 68 Q36 64.6 44 65.4" fill="none" stroke="#8ea29b" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>
  <path d="M35 69.6 L35.4 74 M42 69.4 L42.4 77 M50 69 L49.6 74.6" fill="none" stroke="#0b100f" stroke-width="0.6"/>
  <!-- the bone clasp, come loose -->
  <path d="M46 63.6 L51 64.4 L50.2 67.2 L45.6 66.6 Z" fill="url(#mod-bone)" stroke="#0d0a12" stroke-width="0.7" stroke-linejoin="round"/>
  <circle cx="48.2" cy="65.4" r="0.7" fill="#3f4a46"/>

  <!-- a gaunt hand slid out from under the sleeve, open on the dust -->
  <path d="M58 80 Q62 77.4 66 79 Q67.6 81.6 65.6 83.6 Q61 85 58.4 83.4 Z" fill="url(#mod-robe)" stroke="#0d0a12" stroke-width="0.9" stroke-linejoin="round"/>
  <path d="M65.6 80.4 Q68.2 79.6 69.2 81.6 Q68.8 83.6 66.6 83.6 Z" fill="url(#mod-bone)" stroke="#0d0a12" stroke-width="0.7" stroke-linejoin="round"/>
  <g fill="none" stroke-linecap="round">
    <path d="M69 81 L71.4 80 L72.6 81 M69.2 82.4 L71.8 82.6 L72.6 84 M68.4 83.4 L70 85.4 L70 87" stroke="#0d0a12" stroke-width="1.6"/>
    <path d="M69 81 L71.4 80 L72.6 81 M69.2 82.4 L71.8 82.6 L72.6 84 M68.4 83.4 L70 85.4 L70 87" stroke="#d6cdb3" stroke-width="0.8"/>
  </g>

  <!-- the hood, fallen flat, its mouth gaping sideways and empty -->
  <path d="M10 62.4 C13 59.6 16.6 57.6 21 56.8 C27 55.8 33.4 56.6 37 59.6 C39.6 62 40 65.6 38.4 68.4 Q33 72.4 25 72.6 Q18.6 72.4 15.4 68.6 C14 66.6 12.4 64.6 10 62.4 Z" fill="url(#mod-hood)" stroke="#0d0a12" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M12.4 61.6 Q16.6 58.4 22.4 57.6" fill="none" stroke="#a69bc2" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  <path d="M13.6 62.6 Q21 63.4 27.6 67.4 M15.2 61 Q23 60.4 30.4 62.6" fill="none" stroke="#14101e" stroke-width="0.6" stroke-linecap="round"/>
  <path d="M33.4 60.4 Q38.8 61 39.2 65.4 Q38.8 69.6 34 70.8 Q36.2 65.6 33.4 60.4 Z" fill="url(#mod-hood-in)" stroke="#0d0a12" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M33.8 61 Q35.8 65.4 34.4 70" fill="none" stroke="#6a6084" stroke-width="0.6" opacity="0.8"/>

  <!-- the crown, rolled free: a dull circlet, its flame dead -->
  <g transform="rotate(-12 18 84)">
    <path d="M8.6 84.6 a9.4 3 0 1 0 18.8 0 a9.4 3 0 1 0 -18.8 0 Z M10.8 84.4 a7.2 1.8 0 1 0 14.4 0 a7.2 1.8 0 1 0 -14.4 0 Z" fill="#7d8589" fill-rule="evenodd" stroke="#0d0a12" stroke-width="0.8"/>
    <path d="M9.6 85.8 Q14 88 20 87.8" fill="none" stroke="#c0c7ca" stroke-width="0.4"/>
    <path d="M12 82 L12.6 79.6 L13.6 82 Z M17.4 81.4 L18 78.6 L19 81.4 Z M23 82 L23.8 79.8 L24.4 82.2 Z" fill="#6c7478" stroke="#0d0a12" stroke-width="0.5" stroke-linejoin="round"/>
  </g>
  <circle cx="18" cy="80" r="4" fill="url(#mod-ember)"/>
  <!-- a thread of grey smoke where the flame was -->
  <path d="M18 80 C15.6 75.6 20.4 72 18 67.4 C16.2 63.6 20 60.4 18.4 56.4 C17.4 53.8 19 51.6 20.8 51.2" fill="none" stroke="#8b8798" stroke-width="2.4" stroke-linecap="round" opacity="0.15"/>
  <path d="M18 80 C15.6 75.6 20.4 72 18 67.4 C16.2 63.6 20 60.4 18.4 56.4 C17.4 53.8 19 51.6 20.8 51.2" fill="none" stroke="#9894a4" stroke-width="0.8" stroke-linecap="round" opacity="0.55"/>

  <!-- scattered finger bones from the broken chain -->
  <g fill="url(#mod-bone)" stroke="#0d0a12" stroke-width="0.45">
    <rect x="66" y="88" width="1.6" height="2.6" rx="0.7" transform="rotate(60 66.8 89.3)"/>
    <rect x="74" y="86" width="1.5" height="2.2" rx="0.7" transform="rotate(-30 74.8 87.1)"/>
    <rect x="80.4" y="89.4" width="1.6" height="2.4" rx="0.7" transform="rotate(20 81.2 90.6)"/>
  </g>
</svg>

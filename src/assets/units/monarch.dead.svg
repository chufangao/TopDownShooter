<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- The Monarch, fallen: flat on its back in a heap of robe, X for eyes, tongue out, the long nose pointing at the sky;
       the slippers up; the staff fallen across the ground with its skull lantern gone cold (x-eyed too), and the crown rolled
       free, its flames out to a thread of grey smoke. Same parts, a shade greyer. -->
  <defs>
    <filter id="mod-ink" x="-6%" y="-6%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#1d1427"/><feComposite in2="SourceAlpha" operator="in"/><feOffset dx="1.1" dy="1.3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- a dark slick of spilt essence -->
  <path d="M6 88.6c-.3-1.3.3-2.9 6-3.6s17.7-.7 28-.8 25.7 0 34 .4 12.9 1 16 1.8 4.3 2.2 2.6 3.2-4.8 2.4-12.6 3-23 .8-34 .8-25.3.2-32-.6-7.7-2.9-8-4.2Z" fill="#2a2440" stroke="none"/>
  <!-- smoke from the crown (no ink) -->
  <path d="M19.4 66c-2.4-4.4 1.6-7.4-.4-11.4-1.4-3 .6-6-.4-8.6" fill="none" stroke="#a39cab" stroke-width="1.8" opacity=".8"/>
  <g filter="url(#mod-ink)" stroke="#1d1427" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">

    <g transform="translate(59.8 60.800000000000004) rotate(18 20.8 26)"><!-- the skull lantern: a goofy skull, a matched pair of sockets, its jaw hanging, soulfire in its crown --><path d="M13.4 18.6c0-1.5 0-4.2 1-5.6s3.2-2.7 5-3 4.3.1 5.8 1 2.9 2.8 3.4 4.4 .3 3.9-.2 5.2-2.3 1.6-2.8 2.4 1.2 2.1-.2 2.6-6.8.6-8.2.2 .1-1.7-.4-2.4-2-.8-2.6-1.6-.8-1.7-.8-3.2Z" fill="#cfc6aa" stroke-width="2"/><path d="M26.6 17.6c.3.1.4 2.6 0 3.4s-1.3 1.2-2.2 1.6-3 1-3 .6 2.3-1.9 3.2-2.8 1.7-2.9 2-2.8Z" fill="#a39878" stroke="none"/><path d="M17.2 15.3c.8-.1 2.2.8 2.8 1.4s.8 1.4.5 2.1-1.5 1.8-2.2 2-1.8-.5-2.3-1.1-.6-1.9-.3-2.6 .8-1.8 1.5-1.8Z" fill="#2a1f3e" stroke-width="1.2"/><path d="M23.2 15.3c.8-.1 2.2.8 2.8 1.4s.8 1.4.5 2.1-1.5 1.8-2.2 2-1.8-.5-2.3-1.1-.6-1.9-.3-2.6 .8-1.8 1.5-1.8Z" fill="#2a1f3e" stroke-width="1.2"/><path d="M17.6 25.4l1 5.2 7.6-1.2-.6-4.2Z" fill="#cfc6aa" stroke-width="1.6"/><path d="M20 25.6l.4 2.4m2.2-2.6l.2 2.4" fill="none" stroke-width="1.1"/><path d="M16.6 16.6l2.8 2.8m0-2.8l-2.8 2.8m6-2.8l2.8 2.8m0-2.8l-2.8 2.8" fill="none" stroke="#b9ad88" stroke-width="1.3"/></g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Pale Court: three Will-o'-Wisps made one, a tall spectral noble of blue-white mist in a high lace collar and a gown
       that trails off into vapour, crowned with three witchflames, holding a rusted bog lantern on a long crook sceptre while
       two small flame-faces orbit it. Goofy pass: haughty to the point of comedy: chin in the air, a matched pair of
       heavy-lidded eyes looking down its nose at you, a pursed crooked smirk and a beauty mark, a hand
       on its hip with a lace hanky; the lace collar a vast lopsided fan; the crown's three wisps each with a face of
       their own (one asleep); the crook kinked; the attendants pulling faces. Flat cel; ink offset down-right. -->
  <defs>
    <filter id="pc-ink" x="-6%" y="-6%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#1d1427"/><feComposite in2="SourceAlpha" operator="in"/><feOffset dx="1.1" dy="1.3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

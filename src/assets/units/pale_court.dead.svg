    <path d="M32.6 83.2c-.9-1.3-.5-3.8 0-5.4s2.1-3.3 3.2-4.4 2.8-2.5 3.9-2.1 1.9 2.3 2.6 4.3 2.5 5.9 1.7 7.6-4.1 2.1-6 2.1-4.5-.9-5.4-2.1Z" fill="#9a8cc4" stroke-width="1.5"/>
    <path d="M35.6 77.6c.7-.1 2.1.3 2.5.7s.6 1.4.4 2-1 1.3-1.6 1.5-1.8-.1-2.2-.6-.6-1.9-.4-2.5 .7-1.1 1.3-1.1Z" fill="#ece8f6" stroke-width="1"/><path d="M36.4 79.7l0 .1 0 .1-.1 0-.2 0-.1-.2 0-.3 .2-.2 .4-.1 .4.2 .2.4-.1.5-.4.4-.6.1-.6-.4-.3-.6 .2-.7 .6-.6 .8 0 .8.4 .3.9-.2 1-.8.6" fill="none" stroke-width=".8"/><path d="M40.2 77.7c.6 0 2 .3 2.5.8s.5 1.4.3 2-.9 1.3-1.6 1.4-1.7-.1-2.2-.6-.5-1.8-.4-2.4 .7-1.1 1.4-1.2Z" fill="#ece8f6" stroke-width="1"/><path d="M40.9 79.9l.1 0 0 .1-.2.1-.1 0-.2-.2 0-.3 .2-.3 .4 0 .4.2 .2.4-.1.5-.4.4-.6 0-.6-.3-.3-.6 .2-.8 .6-.5 .9-.1 .7.5 .4.9-.3.9-.8.7" fill="none" stroke-width=".8"/>
    <path d="M42.1 84.7c-.7-1-.4-3 0-4.3s1.6-2.6 2.6-3.4 2.2-2 3.1-1.7 1.5 1.8 2 3.4 2 4.7 1.4 6-3.3 1.7-4.8 1.7-3.6-.7-4.3-1.7Z" fill="#9a8cc4" stroke-width="1.5"/>
    <path d="M45.1 80.2c.5 0 1.2.4 1.5.8s.3 1 .1 1.5-.6 1.1-1 1.2-1.5-.2-1.9-.6-.5-1.4-.3-1.9 1-1 1.6-1Z" fill="#ece8f6" stroke-width="1"/><path d="M45.1 82l.1 0-.1.1 0 0-.2 0-.1-.1 0-.3 .2-.1 .3-.1 .3.1 .1.4 0 .4-.4.3-.4 0-.5-.2-.2-.5 .1-.6 .5-.4 .7-.1 .6.4 .3.7-.2.7-.7.6" fill="none" stroke-width=".8"/><path d="M48.7 80.3c.5 0 1.2.4 1.5.8s.3 1 .1 1.5-.6 1.2-1 1.3-1.5-.3-1.9-.7-.5-1.4-.3-1.9 1.1-.9 1.6-1Z" fill="#ece8f6" stroke-width="1"/><path d="M48.7 82.1l.1 0 0 .1-.1.1-.2-.1-.1-.1 0-.2 .2-.2 .3-.1 .3.2 .1.3 0 .4-.3.3-.5.1-.5-.3-.2-.5 .1-.6 .5-.4 .7-.1 .6.4 .3.7-.2.8-.7.5" fill="none" stroke-width=".8"/>
  </g>
</svg>

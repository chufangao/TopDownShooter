<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Pale Court, dispersed: the body gone to mist, leaving the empty lace collar, lopsided as ever, slumped on the
       ground on a crumple of gown; the little crown of three wisps huddled in front of it, eyes spun to spirals; the rusted
       lantern on its side and the sceptre snapped; the last of the mist drifting up and thinning away. A shade greyer. -->
  <defs>
    <filter id="pcd-ink" x="-6%" y="-6%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#1d1427"/><feComposite in2="SourceAlpha" operator="in"/><feOffset dx="1.1" dy="1.3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <path d="M8 88.4c-.3-1.3.7-3 6-3.8s16.3-.9 26-1 23.8 0 32 .4 13.8 1.1 17 2 3.8 2.3 2 3.4-5.5 2.5-13 3.2-21.7.8-32 .8-23.7 0-30-.8-7.7-2.9-8-4.2Z" fill="#2a2c40" stroke="none"/>
  <!-- the mist drifting up (no ink) -->
  <path d="M30 62c-4-6 2-10-1-16-2-4 1-8-.4-12m33.4 32c2-6-2-10 1-15" fill="none" stroke="#dfe6ff" stroke-width="2" opacity=".6"/>
  <g filter="url(#pcd-ink)" stroke="#1d1427" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <!-- the snapped sceptre -->
    <g fill="none"><g stroke-width="4.6"><path id="pcd-crook" d="M54 87l18-1.4m4 .4l10-.6c3.6-.4 5-4 3.4-6.4"/></g><use href="#pcd-crook" stroke="#9a8866" stroke-width="2.4"/></g>
    <g transform="translate(-6 55) rotate(84 84 18)"><path d="M84 17.6l0 3" fill="none" stroke-width="1.4"/><path d="M79.6 20.4l8.8-.4 .2 2.4-9.2.4Z" fill="#6a5a54" stroke-width="1.6"/><path d="M80.4 22.6l7.4-.2 .4 8-8.2.4Z" fill="#8a96a0" stroke-width="1.6"/><path d="M84.2 22.6l.2 7.8" fill="none" stroke-width=".9"/><path d="M79.2 30.4l9.6-.4 .4 2.6-9.8.4Z" fill="#6a5a54" stroke-width="1.6"/></g>
    <!-- the empty lace collar, slumped on its back -->
    <g transform="translate(40 70) rotate(-14) scale(.84) translate(-47 -30)"><!-- the lace collar: a vast fan behind the head, one side taller than the other, its edge scalloped --><path d="M40 46c-4.2-1-5.1-3.7-7-6s-4.4-8-4.4-8 2.2-1.7 2-3-3-5-3-5 3.4-.2 3.8-1.4-1.4-6-1.4-6 3.7 1.8 4.6 1 1-6 1-6 3 3.4 4.4 3 4-5.2 4-5.2 1 2.8 3 3.6 6.5.2 9 1 4.6 2.6 6 4 2.4 4.6 2.4 4.6 2.1 4.5 2 7.4-1 7.3-2.4 10-2 5-6 6-13.8 1-18 0Z" fill="#cfd4ea"/><path d="M34 38c-1-1-2.2-4.7-2.4-7s.4-6.9 1-7 1.6 4.4 2.4 6.6 2.6 5.2 2.4 6.4-2.4 2-3.4 1Z" fill="#99a2c4" stroke="none"/><path d="M40.4 44l-6.8-17m9.4 17l-5-24.4m8.4 24.4l-1.8-28.6" fill="none" stroke="#99a2c4" stroke-width="1"/></g>

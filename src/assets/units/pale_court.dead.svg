    <path d="M25.5 84.4c-.7-1-.4-3.2 0-4.5s1.7-2.7 2.7-3.6 2.3-2.1 3.2-1.8 1.6 1.9 2.2 3.6 2 5 1.4 6.3-3.4 1.8-5 1.8-3.7-.8-4.5-1.8Z" fill="#9a8cc4" stroke-width="1.5"/>

    <linearGradient id="ph-hide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6e646c"/>
      <stop offset="0.45" stop-color="#38323c"/>
      <stop offset="1" stop-color="#16131b"/>
    </linearGradient>
    <linearGradient id="ph-hide-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#433c46"/>
      <stop offset="1" stop-color="#0e0c12"/>
    </linearGradient>
    <linearGradient id="ph-head" x1="0.1" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#7a7078"/>
      <stop offset="0.5" stop-color="#3c3540"/>
      <stop offset="1" stop-color="#17141c"/>
    </linearGradient>
    <linearGradient id="ph-flame" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffb04a"/>
      <stop offset="0.45" stop-color="#ff7a32"/>
      <stop offset="1" stop-color="#c22e1c"/>
    </linearGradient>
    <linearGradient id="ph-flame-mid" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.4" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
    <linearGradient id="ph-claw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b6aa"/>
      <stop offset="1" stop-color="#3e353a"/>
    </linearGradient>
    <radialGradient id="ph-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.3" stop-color="#ffd27a"/>
      <stop offset="0.6" stop-color="#ff8a3d" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ph-glow-soft" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8a3d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ph-eye" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset="0.45" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#ff7a2a"/>
    </radialGradient>
    <radialGradient id="ph-smoke" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8e8896" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#8e8896" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ph-shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0d0a12" stop-opacity="0.5"/>
      <stop offset="0.65" stop-color="#0d0a12" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#0d0a12" stop-opacity="0"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Pyre Hound: a lean, long-legged hound of the funeral pyre at a low-headed trot, charcoal hide split with ember cracks, a mane and tail of flame, smoke curling off it. Lit from the upper left. -->

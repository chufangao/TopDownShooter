<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Pyre Hound: a lean hound of the funeral pyre at a trot, charcoal hide split with ember cracks, a mane and tail of flame.
       Goofy pass: a long saggy noodle of a body on spindly legs with clown paws, a long dopey muzzle with a big shiny nose,
       a matched pair of googly slit eyes locked on the prey, the tongue lolling out the side; one big
       floppy ear and one small perky one alight like a candle wick; a ragged flame mohawk, a lopsided plume of a tail, a
       spiked collar with a crooked bronze tag. Flat cel, ink offset down-right. -->
  <defs>
    <filter id="ph-ink" x="-6%" y="-6%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#1d1427"/><feComposite in2="SourceAlpha" operator="in"/><feOffset dx="1.1" dy="1.3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

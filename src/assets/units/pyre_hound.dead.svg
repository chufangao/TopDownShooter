<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Pyre Hound, fallen: keeled over on its side in a drift of grey ash, legs stuck out stiff, X for eyes (a matched
       pair), the tongue flopped out on the ground; the ember cracks gone dark, the flame mane burnt down to a charred
       ridge, the candle-wick ear snuffed, the tail plume snuffed to a curl of smoke. Same parts, greyer. -->
  <defs>
    <filter id="phd-ink" x="-6%" y="-6%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#1d1427"/><feComposite in2="SourceAlpha" operator="in"/><feOffset dx="1.1" dy="1.3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
<!-- a drift of grey ash -->
<path d="M5 88.6 C8 84.6 26 84 48 84.4 C70 84.8 88 84.6 92 87.6 C94 90.6 82 93.2 52 93.4 C26 93.6 4 92.4 5 88.6 Z" fill="#6b6270"/>
<!-- the tail snuffed to a curl of smoke, the ear to a wisp -->
<path d="M10 80 C7.6 76 11 73.4 9.4 69.4 C8.4 66.6 10.4 64.6 12.6 65.6" fill="none" stroke="#c9c2d0" stroke-width="2" stroke-linecap="round" opacity=".8"/>
<path d="M72 56 C70.4 53 73 51.4 72 48.6" fill="none" stroke="#c9c2d0" stroke-width="1.6" stroke-linecap="round" opacity=".7"/>
  <g filter="url(#phd-ink)" stroke="#1d1427" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
<!-- the tail, limp -->
<g fill="none"><g stroke-width="5.4"><path id="phd-tail" d="M24 80 C18 80 14 79 11 77"/></g><use href="#phd-tail" stroke="#665e6c" stroke-width="3"/></g>

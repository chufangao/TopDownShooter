<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Rime Drake: an Ember Drake and two Frost Sprites fused into one. Goofy pass: where the ember drake rears, this one
       hunkers down on all fours like a lizard on a cold morning: a chunky barrel stitched down a zigzag seam (ember behind,
       frost in front), a ragged frost crest of icicles from brow to rump, one big faceted sprite wing raised and one
       smouldering stub folded on its flank; the head stitched the same way, a matched pair of eyes (one ember, one frost) both
       glaring, a bushy frosted brow, an icicle beard and a fat tongue; the tail flame curled up behind, steam off the frost
       nostril. Flat cel, ink offset down-right. -->
  <defs>
    <filter id="rd-ink" x="-6%" y="-6%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#1d1427"/><feComposite in2="SourceAlpha" operator="in"/><feOffset dx="1.1" dy="1.3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Rime Drake, fallen: keeled over on its side in a pool of slush, half frozen and half melted: the ember leg stuck stiff
       in the air and furred with frost, the tail flame caught in a shell of ice, the ice wing snapped to shards, the crest
       icicles broken off and strewn about, X for eyes (a matched pair), one last curl of steam off the seam. -->
  <defs>
    <filter id="rdd-ink" x="-6%" y="-6%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#1d1427"/><feComposite in2="SourceAlpha" operator="in"/><feOffset dx="1.1" dy="1.3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
<!-- a pool of slush -->
<path d="M5 88.6 C8 84.6 26 84 48 84.4 C70 84.8 88 84.6 92 87.6 C94 90.6 82 93.2 52 93.4 C26 93.6 4 92.4 5 88.6 Z" fill="#4f7ea8" opacity=".7"/>
<!-- a curl of steam off the seam -->
<path d="M58 60 C56 56.6 59 54.4 57.6 50.6 C56.8 48 58.6 46.2 60.6 47" fill="none" stroke="#c9c2d0" stroke-width="2" stroke-linecap="round" opacity=".8"/>

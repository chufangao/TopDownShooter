  <path d="M20.7 24.5c1.3-.2 4.1.8 4.9 1.8s.9 3.2 0 3.9-3.8 1.1-5.2.6-2.9-2.2-2.9-3.3 1.8-2.7 3.2-3Zm-2.8 2.8c.8-.1 2.6.5 3.1 1s.2 1.7-.3 2.2-2 .7-2.7.5-1.6-1.4-1.6-2 .7-1.6 1.5-1.7Zm6.9-3.3c.7-.1 1.8.8 2.1 1.3s-.1 1.5-.6 1.9-1.6 1.1-2.2.8-1.5-1.5-1.4-2.2 1.4-1.7 2.1-1.8Z" fill="#b4dc5e" stroke="none" opacity=".4"/>

    <path d="M13 40.6c-.8-.7-.8-2.6-.6-3.6s1.3-2.3 1.8-2.4 1 2.1 1.4 2 .3-2.3.8-2.6 1.7.2 2 1 .2 2.6 0 3.6-.1 2.1-1 2.4-3.6.3-4.4-.4Z" fill="#a8b67a" stroke-width="2"/>
    <path d="M71.6 44c.8.2 2.6 3 3 4.6s.2 3.8-.6 5-2.8 2.3-4 2.4-2.9-.8-3-1.6 2.1-1.9 2.6-3 .1-2.6.4-3.8 .8-3.8 1.6-3.6Z" fill="#a8b67a"/>
    <path d="M68.4 53.4l2 1" fill="none" stroke-width="1"/>
    <!-- the head: small, but the eyes are not -->
    <path d="M54.4 26c.2-2.2.6-5.9 2-8s3.9-3.7 6.2-4.4 5.3-.4 7.4.4 4.2 2.6 5.4 4.4 1.8 4.4 2 6.6 0 4.8-.8 6.6-2.1 3.4-4 4.4-5.2 1.7-7.6 1.6-5-1.1-6.6-2.2-2.5-2.8-3.2-4.4-1-2.8-.8-5Z" fill="#a8b67a"/>

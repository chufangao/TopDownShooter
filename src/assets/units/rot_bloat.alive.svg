<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Rot Bloat, waddling: a gas-swollen corpse, belly first, its stitched seams and weeping boils leaking green miasma.
       Goofy pass: the belly a great lumpy drum sagging to one side, a cork stuffed in one seam to keep the gas in, a mauve patch
       sewn on crooked; a little head with a matched pair of eyes far too big for it, both on you, a drooling
       lopsided grin with one buck tooth and its tongue out; tiny arms, one patting the belly and one waving; tiny bowed legs on
       big flat feet; a fly doing laps. Flat cel: base + one shadow; ink offset down-right (filter). -->
  <defs>
    <filter id="rb-ink" x="-6%" y="-6%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#1d1427"/><feComposite in2="SourceAlpha" operator="in"/><feOffset dx="1.1" dy="1.3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- miasma (no ink) -->
  <path d="M17.1 59.5c2.1-.1 6 1.8 7.1 3s.9 3.6-.7 4.6-6.9 2-8.9 1.3-3.5-3.7-3-5.2 3.4-3.6 5.5-3.7Zm-4.7 3.5c1.1-.2 3.2.2 3.8 1s.7 2.8-.1 3.6-3.5 1.2-4.6.9-2-2.2-1.8-3.1 1.7-2.1 2.7-2.4Zm8.8-5c1-.2 3.3.6 3.9 1.4s.6 2.8-.1 3.6-3.1 1.1-4.1.7-2.2-2.2-2.2-3.1 1.4-2.4 2.5-2.6Z" fill="#b4dc5e" stroke="none" opacity=".5"/>

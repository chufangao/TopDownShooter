<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Rot Bloat, attack key pose (Bile): a heavy belly-first lurch to the right, the head thrown forward retching a gout
       of green bile out ahead; the cork popped out of its seam on a jet of gas; both eyes bulging.
       Back foot planted on the feet line. Same parts as the alive picture. -->

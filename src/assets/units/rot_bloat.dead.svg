  <path d="M20.6 85.6 C18.6 81.6 21 76.6 26 74.6 C29 73.4 31 71 34 69.6 L37 70.6 L38.4 67 L41.6 69.2 L44.4 65.6 L47 68.6 L50.6 64.8 L52.6 68.4 L56.6 65.4 L58 69.2 L61.6 67.4 L62.4 71 C66 71.2 70 72.6 73.4 74.6 C78.4 77.4 81.6 81 80.2 85.2 C76 88.6 66 89.6 56 89.6 C46 89.8 34 89.6 26 88.4 C23.4 88 21.4 87.2 20.6 85.6 Z" fill="url(#rbd-skin)" stroke="#0d0a12" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- the slack folds of a drum gone empty -->
  <g fill="none" stroke-linecap="round">
    <path d="M23.4 82.6 Q28 79.8 32.4 81.6 Q36.6 83.4 41 81 M24.6 86.2 Q30 84.2 35 85.8 Q40 87.4 45.4 85.4 M48 86.4 Q54 84 59 86 Q64 87.6 69.4 85.6 M56 81.6 Q62 79.6 66 81.4 Q70 83 75.4 81 M65 76.4 Q69.4 75.4 73 77.6 M28.4 77.6 Q31.6 75.6 34.6 76.6" stroke="#2a3322" stroke-width="0.75"/>
    <path d="M23.6 81.6 Q28 78.8 32.4 80.6 Q36.6 82.4 40.6 80.2 M25 85.2 Q30 83.2 35 84.8 M56.4 80.6 Q62 78.6 65.8 80.4 M28.6 76.6 Q31.6 74.8 34.4 75.6" stroke="#dfe6c8" stroke-width="0.45" opacity="0.55"/>
  </g>
  <!-- lividity pooled on the low side -->
  <ellipse cx="66" cy="84" rx="7" ry="2.6" fill="#6a5872" opacity="0.3"/>
  <ellipse cx="34" cy="86.4" rx="6" ry="1.8" fill="#6a5872" opacity="0.25"/>

  <!-- the stitched patch, still holding on its corner of the hide -->
  <g transform="translate(6 2)">
  <path d="M25.4 77.4 L32.4 76.2 L33.8 82.4 L27 83.8 Z" fill="url(#rbd-patch)" stroke="#0d0a12" stroke-width="0.7" stroke-linejoin="round"/>
  <g stroke="#1f1712" stroke-width="0.5" stroke-linecap="round">
    <path d="M26.4 76.2 l0.3 1.8 M28.6 75.8 l0.3 1.8 M30.8 75.4 l0.3 1.8 M33 78 l-1.8 0.4 M33.6 80.4 l-1.8 0.4 M31.4 83.6 l-0.4 -1.8 M28.8 84.2 l-0.4 -1.8 M26.2 81.2 l1.8 -0.4"/>
  </g>
  <path d="M26.4 78.2 L31.8 77.2" stroke="#e4d6b6" stroke-width="0.35" opacity="0.6"/>

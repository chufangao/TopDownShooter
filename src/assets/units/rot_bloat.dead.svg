    <path d="M57.4 19.6 C56.8 13.8 60.4 10.8 64.6 10.8 C69.2 10.8 72.2 14 72.2 18.6 C72.2 21.8 71.2 24.4 69.6 26 C68 27.6 66 28.2 64 28 C60.4 27.6 58 24.4 57.4 19.6 Z" fill="url(#rbd-skin)" stroke="#0d0a12" stroke-width="1.1" stroke-linejoin="round"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Rot Bloat, burst: the drum split open along its seam and flopped flat and empty in a spreading puddle of ichor, the
       little head lolled aside with X for eyes and its tongue out, a cloud of green miasma billowing out over everything; the

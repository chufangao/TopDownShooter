    <ellipse cx="66" cy="18.5" rx="1.8" ry="1.5" fill="#20261a"/>
    <circle cx="66.1" cy="18.7" r="1.15" fill="#d4d2b6"/>
    <ellipse cx="70.2" cy="18.7" rx="1.3" ry="1.3" fill="#141810"/>
    <path d="M69.2 18 L71.2 19.4 M71.2 18 L69.2 19.4" stroke="#4a5038" stroke-width="0.45"/>
    <path d="M71.2 20.6 L72.4 22.4 L70.6 22.2 Z" fill="#1a1410"/>
    <!-- jaw fallen open -->

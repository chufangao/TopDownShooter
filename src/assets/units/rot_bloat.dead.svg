    <path d="M66.4 23.8 l0.6 1.1 l0.6 -1.1 Z M68.6 23.6 l0.5 1 l0.6 -1 Z" fill="#c9c098" stroke="#0d0a12" stroke-width="0.25"/>
  </g>

  <path d="M46 70 C43.6 66 47.4 62.6 45 58.6 C43.2 55.6 45.6 52.4 48.6 51.6" fill="none" stroke="#e4fb9c" stroke-width="0.6" stroke-linecap="round" opacity="0.6"/>
  <path d="M54 70 C56.6 66.6 53.6 63 56.4 59.6 C58.4 57.2 61.6 57.6 62.6 54.8" fill="none" stroke="#a8d84a" stroke-width="2" stroke-linecap="round" opacity="0.28"/>
  <path d="M54 70 C56.6 66.6 53.6 63 56.4 59.6 C58.4 57.2 61.6 57.6 62.6 54.8" fill="none" stroke="#e4fb9c" stroke-width="0.5" stroke-linecap="round" opacity="0.55"/>

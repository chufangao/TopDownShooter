    <path d="M4.6 91 q1 -0.6 1.6 0.2 q-0.4 0.8 -1.2 0.6 Z"/>
  </g>
  <g fill="#6e8a2e">
    <circle cx="5" cy="80.4" r="0.35"/><circle cx="90.8" cy="76.6" r="0.35"/>
  </g>
  <!-- bubbles rising in the puddle -->
  <g fill="none" stroke="#9cbc4a" stroke-width="0.4" opacity="0.8">
    <circle cx="16" cy="86" r="0.9"/><circle cx="18" cy="87.6" r="0.6"/><circle cx="84" cy="86.4" r="0.8"/><circle cx="40" cy="91.4" r="0.7"/><circle cx="72" cy="90.4" r="0.6"/>
  </g>

  <!-- a stubby foot poking out from under the skin, sole up -->
  <g transform="translate(3 3.2)">
  <path d="M60.6 87.4 C61.4 84.2 64.4 82.4 67.6 82.6 C70.6 82.8 72.4 84.8 72 87.2 C71.4 89.6 68.6 90.6 65.4 90.4 C62.4 90.2 60.2 89.2 60.6 87.4 Z" fill="#7a856a" stroke="#0d0a12" stroke-width="1" stroke-linejoin="round"/>
  <path d="M62.6 86.8 Q66 85 69.8 86.2" fill="none" stroke="#3a4431" stroke-width="0.5"/>
  <path d="M62.4 85 Q64.4 83.6 67 83.6" fill="none" stroke="#c9d1b0" stroke-width="0.45"/>

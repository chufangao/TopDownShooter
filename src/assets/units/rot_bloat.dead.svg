    <circle cx="44" cy="73" r="0.8"/><circle cx="52.6" cy="72.4" r="1.1"/><circle cx="57" cy="73.6" r="0.6"/><circle cx="47.6" cy="74.8" r="0.5"/>
  </g>
  <!-- ragged flaps of hide peeled back by the blast, raw side up -->
  <path d="M35.4 72.2 C32.4 69.4 29.2 67.6 25.8 68 C27.2 70.6 30.2 72.8 34.6 74 Z" fill="url(#rbd-raw)" stroke="#0d0a12" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M42.4 69.8 C41.6 66.4 39.6 63.4 36.6 62.2 C36.6 65 38.4 68.2 40.6 70.4 Z" fill="url(#rbd-raw)" stroke="#0d0a12" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M48.4 69 C48.8 65.4 48 62 46.2 59.6 C45 62.4 45.4 66 46.4 69.2 Z" fill="url(#rbd-raw)" stroke="#0d0a12" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M53.4 69 C55 65.4 57.8 63 61 62.6 C60.2 65.8 58 68.4 55.4 70 Z" fill="url(#rbd-raw)" stroke="#0d0a12" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M62.6 71.8 C65.8 69.2 69.4 68.2 72.6 68.8 C71.2 71.4 68 73 63.6 73.8 Z" fill="url(#rbd-raw)" stroke="#0d0a12" stroke-width="0.8" stroke-linejoin="round"/>
  <!-- outer skin showing at the flap edges, and torn fringes -->
  <path d="M26.2 68.2 Q28.6 68 31 69.2 M36.8 62.6 Q38.4 64 39.4 66 M46.2 60 Q47.4 61.6 47.8 63.6 M60.8 62.8 Q59 63.6 57.6 65 M72.4 69 Q70 69 67.8 69.8" fill="none" stroke="#a9b28e" stroke-width="0.7" stroke-linecap="round"/>
  <path d="M25.8 68 l-1 -0.8 M27 69.6 l-1.4 0 M36.6 62.2 l-0.4 -1.2 M46.2 59.6 l-0.6 -1 M47 60.4 l0.2 -1.2 M61 62.6 l0.8 -0.8 M72.6 68.8 l1.2 -0.4 M71.4 70.4 l1.4 0.4" stroke="#0d0a12" stroke-width="0.6" stroke-linecap="round"/>
  <!-- glistening on the raw undersides -->
  <path d="M29 69.4 Q31 70.4 32.6 71.8 M39.2 65.4 Q40.4 67 41 68.6 M46.6 62.6 Q47 65 47.2 67 M57.6 66 Q56.6 67.4 55.6 68.4 M66.4 70.4 Q68.4 69.8 70.2 69.8" fill="none" stroke="#d6b4a4" stroke-width="0.45" stroke-linecap="round" opacity="0.7"/>

  <!-- ===== the miasma: a cloud billowing out over everything that stood near ===== -->
  <ellipse cx="48" cy="62" rx="26" ry="17" fill="url(#rbd-miasma)"/>
  <ellipse cx="22" cy="64" rx="16" ry="12" fill="url(#rbd-miasma)"/>
  <ellipse cx="75" cy="62" rx="17" ry="13" fill="url(#rbd-miasma)"/>
  <ellipse cx="36" cy="46" rx="14" ry="11" fill="url(#rbd-miasma)"/>
  <ellipse cx="60" cy="44" rx="15" ry="11" fill="url(#rbd-miasma)"/>
  <ellipse cx="48" cy="32" rx="12" ry="9" fill="url(#rbd-miasma)" opacity="0.7"/>
  <ellipse cx="10" cy="54" rx="9" ry="8" fill="url(#rbd-miasma)" opacity="0.8"/>
  <ellipse cx="87" cy="50" rx="9" ry="8" fill="url(#rbd-miasma)" opacity="0.8"/>
  <ellipse cx="48" cy="58" rx="13" ry="10" fill="url(#rbd-miasma-core)"/>
  <!-- the billows' lit crowns -->
  <g fill="none" stroke-linecap="round">
    <path d="M26 56 Q28 50.6 33.6 50.4 Q36 46 41.6 46.6 Q44.6 42 50 43.4 Q54.6 40.6 58.6 44.2 Q63.4 43.6 65.6 47.8 Q70.6 48.4 71.6 53.2" stroke="#d8f59a" stroke-width="0.8" opacity="0.45"/>
    <path d="M38 36.6 Q40.4 32.4 45 33 Q48.4 29.4 52.6 31.6 Q56.6 31 58 34.6" stroke="#d8f59a" stroke-width="0.6" opacity="0.35"/>

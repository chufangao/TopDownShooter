  <path d="M76.2 79.8 C80 78.6 84.4 79 87.4 80.6 C89 81.6 88.6 84 86.8 84.4 C83.6 85 80 84.6 77.4 84.8 Z" fill="url(#rbd-skin-dark)" stroke="#0d0a12" stroke-width="1" stroke-linejoin="round"/>
  <path d="M78.4 80.2 Q82.6 79.6 86 80.8" fill="none" stroke="#c9d2ae" stroke-width="0.5" opacity="0.7"/>
  <path d="M86.6 79.4 C88.8 78.4 91.6 79.2 92.2 81.4 C92.8 83.4 91 85 89 85 C87.2 85 86 83.6 86 82 Z" fill="#7d8966" stroke="#0d0a12" stroke-width="0.9" stroke-linejoin="round"/>
  <path d="M91.6 79.6 Q92.6 78 92.2 76.8 M92.2 81.4 Q93.8 80.8 94.4 79.6 M91.4 84.2 Q93 84.6 94 84" fill="none" stroke="#0d0a12" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M91.6 79.6 Q92.6 78 92.2 76.8 M92.2 81.4 Q93.8 80.8 94.4 79.6 M91.4 84.2 Q93 84.6 94 84" fill="none" stroke="#7d8966" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M87.6 81.6 Q89.2 82.6 90.8 82" fill="none" stroke="#2a3322" stroke-width="0.45"/>

  <!-- the small head, rolled onto its side at the end of the slack neck -->

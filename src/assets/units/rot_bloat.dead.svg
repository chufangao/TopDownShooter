  <!-- sheen on the wet ichor -->
  <path d="M12.6 83.2 Q18 79.6 26 79.2 M70 78.6 Q80 78.8 85.6 82" fill="none" stroke="#9cbc4a" stroke-width="0.7" stroke-linecap="round" opacity="0.6"/>
  <path d="M14 89.6 Q24 91.4 34 91 M60 90.6 Q70 90.6 80 89.2" fill="none" stroke="#6e8a2e" stroke-width="0.5" stroke-linecap="round" opacity="0.5"/>
  <!-- spatter flung out by the burst -->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Rot Bloat, burst: the drum split open, the skin flopped flat and empty in a spreading puddle of ichor, the small head lolled aside, a cloud of green miasma billowing out over everything near. -->
  <defs>
    <radialGradient id="rbd-shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0d0a12" stop-opacity="0.5"/>
      <stop offset="0.7" stop-color="#0d0a12" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0d0a12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rbd-ichor" cx="0.42" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#55682a"/>
      <stop offset="0.45" stop-color="#2e3a16"/>
      <stop offset="1" stop-color="#151b0b"/>
    </radialGradient>
    <linearGradient id="rbd-skin" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#b2bb98"/>
      <stop offset="0.45" stop-color="#7d8966"/>
      <stop offset="1" stop-color="#3e4634"/>
    </linearGradient>
    <linearGradient id="rbd-skin-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8c9876"/>
      <stop offset="1" stop-color="#363e2c"/>
    </linearGradient>
    <linearGradient id="rbd-raw" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#9a7f72"/>
      <stop offset="0.5" stop-color="#6a524a"/>
      <stop offset="1" stop-color="#3a2a28"/>
    </linearGradient>
    <radialGradient id="rbd-hole" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#6a8a24"/>
      <stop offset="0.4" stop-color="#2c3812"/>
      <stop offset="1" stop-color="#10140a"/>
    </radialGradient>
    <linearGradient id="rbd-patch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a8977a"/>
      <stop offset="1" stop-color="#5e4f3c"/>
    </linearGradient>
    <radialGradient id="rbd-miasma" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ccf272" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#a8d84a" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8ac03a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rbd-miasma-core" cx="0.45" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#e4fb9c" stop-opacity="0.6"/>
      <stop offset="0.6" stop-color="#b4e05a" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#9ccc40" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rbd-maw" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#3a1a1c"/>
      <stop offset="1" stop-color="#120708"/>
    </radialGradient>
  </defs>


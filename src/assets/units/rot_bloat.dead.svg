    <path d="M59.6 13.4 Q57.2 16.6 57.8 21.4 M61 12 Q58.4 15.2 59.2 19.4" fill="none" stroke="#2f2e22" stroke-width="0.5" stroke-linecap="round"/>
    <circle cx="61.4" cy="22.6" r="0.9" fill="#4f5c3a" opacity="0.5"/>
    <path d="M63.4 16.2 Q66.6 14.8 69.2 15.8 Q70.8 16.2 71.6 17.2" fill="none" stroke="#2a3322" stroke-width="0.9" stroke-linecap="round"/>

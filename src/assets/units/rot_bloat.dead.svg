    <path d="M30 60 C27 57 29.4 53.6 32.6 54.4 C35 55 35 58 32.8 58.4" stroke-width="0.6"/>
    <path d="M62 56 C65 53.4 68.6 55 68.2 58 C67.8 60.2 65 60.4 64.4 58.6" stroke-width="0.6"/>
    <path d="M44 40 C42.4 37 45.6 34.6 48.2 36.2 C50 37.4 49.2 40 47.4 39.8" stroke-width="0.5"/>

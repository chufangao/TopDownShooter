<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Thorn Dryad: a forest spirit of smooth bark and moss, a mane of leaves and antler-twigs, gowned in layered leaves,
       brambles coiling her arms, leaning on a living staff crowned with white blossoms. Goofy pass: a big bark head cocked to
       one side under a wild lopsided bush of leaves, a huge matched pair of fae eyes, both
       looking at you, a gap-toothed grin with the tongue tip out; a big antler with a nest and an
       egg in it, a little one with a single leaf; a moss tuft with one tiny flower; a lopsided bell of a gown and roots for
       feet; a crooked staff with drooping blossoms. Flat cel, ink offset down-right. -->

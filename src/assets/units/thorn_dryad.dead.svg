<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Thorn Dryad, fallen: keeled over on her side, wilted, eyes spun to spirals, the tongue out; her leaves gone limp
       and a few shed round her, the big antler snapped, the nest tipped out and the egg rolled away, the blossom staff broken
       in two and its flowers dead; one last bright sprout rises from her open palm. Same parts, a wilted green -->
  <defs>
    <filter id="tdd-ink" x="-6%" y="-6%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#1d1427"/><feComposite in2="SourceAlpha" operator="in"/><feOffset dx="1.1" dy="1.3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
<!-- damp moss and a few shed leaves -->
<path d="M5 88.6 C8 84.6 26 84 48 84.4 C70 84.8 88 84.6 92 87.6 C94 90.6 82 93.2 52 93.4 C26 93.6 4 92.4 5 88.6 Z" fill="#3c4a2c"/>

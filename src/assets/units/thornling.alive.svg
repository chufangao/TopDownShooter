  <!-- Thornling: a little fae of bramble and bark, a stump that got up and stood in the way, holding the line behind a shield
       sawn from a log. Goofy pass: a squat round stump of a body that is all head, a big matched pair of fae eyes, both
       on the foe, a stubborn underbite with one thorn for a tooth; a tangled crown of brambles with a few leaves, one pink
       blossom and a sprout sticking up; a thorny bramble arm curled up behind ready to swipe, the log-slice shield too big
       for it, rings and a crack; stubby root legs with splayed toes. Flat cel: base + one shadow; ink offset down-right. -->

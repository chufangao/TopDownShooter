<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Thornling, attack key pose: a thorny swipe. The bramble arm whipped right over the top and raked down at the foe, thorns
       first, a green-white crescent and torn leaves in its wake; the log-slice shield swung back out of the way, the
       stump of a body leaning into the blow, both eyes narrowed under knotted brows, the underbite open in a war-cry.
       Same parts as the alive picture. -->

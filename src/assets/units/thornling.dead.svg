<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Thornling, fallen: keeled over backwards like a felled stump, root legs stuck up stiff, eyes spun to spirals and the
       tongue out of the underbite; its bramble crown gone limp, the leaves wilted brown and one dropped, the blossom

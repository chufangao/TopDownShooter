<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Tomb Knight: a corroded knight risen from its barrow, soulfire in the visor. Goofy pass: a huge dented great helm
       tipped forward, a matched pair of googly eyes glaring out of the open visor, the
       breathing grille a crooked grin with its tongue poking through; the red plume snapped and flopped forward; the notched
       greatsword far too long and slung lazily over the shoulder; a goofy skull on the shield; tiny bowed legs in long pointed
       sabatons, a worm poking out of the knee. Flat cel: base + one shadow; ink offset down-right (filter). -->
  <defs>
    <filter id="tk-ink" x="-6%" y="-6%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#1d1427"/><feComposite in2="SourceAlpha" operator="in"/><feOffset dx="1.1" dy="1.3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

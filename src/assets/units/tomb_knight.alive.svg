  <path d="M27.8 49.7 L12.2 17.4 Q11.3 14.6 12.6 13.4 Q14.2 14 15.2 16.6 L30.6 48.6 Z" fill="url(#tk-blade)" stroke="#0d0a12" stroke-width="1" stroke-linejoin="round"/>
  <path d="M27.6 47.3 L13.4 17.6" stroke="#2a2f3a" stroke-width="0.5"/>
  <path d="M26.6 46.6 L13 18.4" stroke="#ffffff" stroke-width="0.5" opacity="0.8"/>
  <!-- runes etched near the fuller, lit by soulfire -->
  <path d="M24.2 41.3 l-0.9 -1.8 l1.6 -0.3 M22.6 37.8 l-0.8 -1.7 M21.4 35.2 l0.9 -0.6 l-0.6 -1.3 M19.8 31.7 l-0.8 -1.6 l1.2 -0.2" fill="none" stroke="#5ef0c0" stroke-width="0.6" stroke-linecap="round"/>
  <!-- nicks in the edge -->
  <path d="M18.4 26.7 l0.9 -0.4 l0.2 0.9 M23 35.6 l0.8 -0.4 l0.2 0.8" fill="#0d0a12" stroke="#0d0a12" stroke-width="0.4"/>
  <!-- crossguard, grip, pommel -->
  <path d="M23.4 51.6 Q29 47 35.6 46.4 L36.2 48.4 Q30.4 49.6 24.6 53.6 Z" fill="#c09048" stroke="#0d0a12" stroke-width="0.9" stroke-linejoin="round"/>
  <path d="M24.4 51.8 Q29.6 48 35.4 47.2" fill="none" stroke="#f1d08a" stroke-width="0.5"/>
  <circle cx="23.6" cy="52.8" r="1.4" fill="#a87a36" stroke="#0d0a12" stroke-width="0.6"/>
  <circle cx="36.2" cy="47.2" r="1.4" fill="#a87a36" stroke="#0d0a12" stroke-width="0.6"/>
  <path d="M30.6 50.4 L34.4 58" stroke="#3a2418" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M31 51.4 l1.6 -0.6 M31.8 53 l1.6 -0.6 M32.6 54.6 l1.6 -0.6 M33.4 56.2 l1.6 -0.6" stroke="#6a4a30" stroke-width="0.5"/>
  <circle cx="35" cy="59.2" r="1.9" fill="#c09048" stroke="#0d0a12" stroke-width="0.8"/>
  <circle cx="34.5" cy="58.7" r="0.6" fill="#f6dc9c"/>
  <!-- gauntlet wrapped around the grip -->
  <path d="M28.4 49.5 Q31.5 47.8 34.4 49.6 Q35.6 52.6 33.5 54.6 Q30.2 55.2 28.4 53 Z" fill="url(#tk-steel)" stroke="#0d0a12" stroke-width="1" stroke-linejoin="round"/>
  <path d="M29.3 51 Q31.6 49.6 33.8 50.8 M29.2 52.6 Q31.4 51.4 33.6 52.6" fill="none" stroke="#2a2e3b" stroke-width="0.5"/>
  <path d="M29.4 50.2 Q30.5 49.3 31.8 49.2" fill="none" stroke="#eef2f8" stroke-width="0.5"/>

  <!-- great helm -->
  <path d="M37.5 15.5 Q48 8.5 58.5 15.5 L59 29.5 Q48 33.5 37 29.5 Z" fill="url(#tk-steel)" stroke="#0d0a12" stroke-width="1.3" stroke-linejoin="round"/>
  <!-- ridge down the brow and dome highlight -->
  <path d="M48 9.8 L48 31.6" stroke="#2a2e3b" stroke-width="0.8"/>
  <path d="M47.1 10.4 L47.1 18.5" stroke="#f2f5fa" stroke-width="0.8"/>
  <path d="M39.6 16.4 Q42.5 12.6 46 11.6" fill="none" stroke="#f2f5fa" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/>
  <path d="M56.8 17 L57.2 28.6" stroke="#2a2e3b" stroke-width="0.9"/>
  <!-- the visor's eye slit and breaths, full of soulfire -->
  <ellipse cx="48" cy="21.3" rx="12" ry="4.5" fill="url(#tk-glow)" opacity="0.75"/>
  <path d="M39.2 20 L56.8 20 L56.6 22.6 L39.4 22.6 Z" fill="#0b0912" stroke="#0d0a12" stroke-width="0.6"/>
  <path d="M40.5 21.3 L46.4 21.3 M49.6 21.3 L55.5 21.3" stroke="#8ff7d6" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="43.4" cy="21.3" r="1.1" fill="#e9fff7"/><circle cx="52.6" cy="21.3" r="1.1" fill="#e9fff7"/>
  <path d="M46.9 23.6 L46.9 29.6 M49.1 23.6 L49.1 29.6" stroke="#0b0912" stroke-width="1.1"/>
  <path d="M41 25 l0 2.6 M43 25.3 l0 2.6 M53 25.3 l0 2.6 M55 25 l0 2.6" stroke="#262a35" stroke-width="0.8" stroke-linecap="round"/>
  <!-- brow band rivets -->
  <path d="M38 17.8 Q48 15 58.2 17.8" fill="none" stroke="#3c4250" stroke-width="0.7"/>
  <g fill="#e1e7ef" stroke="#0d0a12" stroke-width="0.3">
    <circle cx="40.2" cy="17.4" r="0.6"/><circle cx="44" cy="16.5" r="0.6"/><circle cx="52" cy="16.5" r="0.6"/><circle cx="55.8" cy="17.4" r="0.6"/>
  </g>
  <!-- tattered crimson plume streaming off the crest -->
  <path d="M48 9.6 Q53 4 61.5 5.5 Q67 7 70.5 12 L66.5 11 L68.5 15.5 L63.5 12.6 L64 17 L59.8 13 Q55 10.2 51 11.5 Z" fill="#7e1f2e" stroke="#0d0a12" stroke-width="1" stroke-linejoin="round"/>
  <path d="M50.5 9.2 Q55.5 5.8 62 7 M53 10.6 Q58.4 8.6 64.6 10.6" fill="none" stroke="#c4425a" stroke-width="0.7"/>
  <path d="M56 11.6 Q60.5 11 63 13.2" fill="none" stroke="#3f0d18" stroke-width="0.6"/>
  <rect x="45.8" y="8.2" width="4.4" height="2.8" rx="0.8" fill="#b9873c" stroke="#0d0a12" stroke-width="0.7"/>

  <!-- soulfire embers rising from the visor -->
  <circle cx="58.5" cy="18" r="0.8" fill="#8ff7d6" opacity="0.9"/>
  <circle cx="61" cy="15.5" r="0.55" fill="#8ff7d6" opacity="0.7"/>
  <circle cx="37" cy="17.8" r="0.6" fill="#8ff7d6" opacity="0.6"/>
</svg>

  <ellipse cx="30.8" cy="47.6" rx="3.6" ry="2.8" fill="#97a1b2" stroke="#0d0a12" stroke-width="0.9"/>
  <path d="M28.2 47.6 L33.5 47.8" stroke="#3a3f4c" stroke-width="0.5"/>


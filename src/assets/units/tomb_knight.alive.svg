  <path d="M39 44 L43.5 41.5 L42 43.6 L45 42.6" fill="none" stroke="#1c1f28" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M39.3 44.8 L43.6 42.3" stroke="#c9d1dd" stroke-width="0.4"/>
  <circle cx="36.8" cy="36.5" r="0.7" fill="#e6ebf2"/><circle cx="59" cy="36.5" r="0.7" fill="#7f889a"/>
  <path d="M55 38 Q56.5 42 55.6 45" stroke="#8a4b2a" stroke-width="0.7" fill="none" opacity="0.7"/>

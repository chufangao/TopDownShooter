  <path d="M35.8 55 Q48 61 60.5 55 L60.4 57.6 Q48 63 35.8 57.6 Z" fill="#3a2a22" stroke="#0d0a12" stroke-width="0.9"/>
  <rect x="45.6" y="57" width="4.8" height="3.8" rx="0.8" fill="#b9873c" stroke="#0d0a12" stroke-width="0.7"/>
  <rect x="47" y="58.1" width="2" height="1.6" fill="#3a2a22"/>

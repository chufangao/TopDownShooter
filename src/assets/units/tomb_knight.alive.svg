  <g stroke="#0d0a12" stroke-width="1" stroke-linejoin="round">
    <path d="M35 56 L45 57 L45 64 Q40 66 35.5 64 Z" fill="url(#tk-steel)"/>
    <path d="M51 57 L61 56 L60.5 64 Q56 66 51 64 Z" fill="url(#tk-steel-dark)"/>
  </g>
  <path d="M35.5 60 L45 60.6 M51 60.6 L60.8 60" stroke="#20232d" stroke-width="0.6"/>
  <circle cx="37" cy="58" r="0.7" fill="#d8dfe9"/><circle cx="43.5" cy="58.4" r="0.7" fill="#d8dfe9"/>
  <circle cx="52.5" cy="58.4" r="0.7" fill="#8a93a3"/><circle cx="59" cy="58" r="0.7" fill="#8a93a3"/>


  <path d="M61.5 63.5 L74 70 M74 63.5 L61.5 70" stroke="#c8bfa5" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="61.4" cy="63.3" r="1" fill="#c8bfa5"/><circle cx="74.1" cy="63.3" r="1" fill="#c8bfa5"/>
  <circle cx="61.4" cy="70.2" r="1" fill="#c8bfa5"/><circle cx="74.1" cy="70.2" r="1" fill="#c8bfa5"/>
  <!-- dents and a deep scratch across the shield face -->
  <path d="M59.5 44 L66 47.5 M72 66 L77 60.5" stroke="#0f0c16" stroke-width="0.8"/>
  <path d="M59.6 44.8 L65.8 48.2 M72.5 66.6 L77.3 61.3" stroke="#6e6680" stroke-width="0.4"/>
  <path d="M74.5 40.5 l1.5 1.2" stroke="#8a4b2a" stroke-width="0.8"/>

  <!-- gorget -->
  <path d="M39 29 Q48 26.5 57 29 L57.5 34 Q48 36.5 38.5 34 Z" fill="url(#tk-steel-dark)" stroke="#0d0a12" stroke-width="1"/>
  <path d="M39.5 31.4 Q48 29 56.8 31.4" fill="none" stroke="#aab3c2" stroke-width="0.6"/>

  <!-- sword arm: pauldron, rerebrace, couter, vambrace -->
  <path d="M26 34 Q28 27 37 28.5 Q41 31 40 37 Q35 41 28.5 40 Q25.5 38 26 34 Z" fill="url(#tk-steel)" stroke="#0d0a12" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M27.5 36.5 Q31 34.5 39 35.5 M28 38.7 Q32 37.5 38.6 38" fill="none" stroke="#2c303c" stroke-width="0.7"/>

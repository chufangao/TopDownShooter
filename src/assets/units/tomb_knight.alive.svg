  <path d="M35.5 51.5 Q48 57.5 60.8 51.5 L60.6 54.5 Q48 60 35.6 54.5 Z" fill="#4c5466" stroke="#0d0a12" stroke-width="0.9"/>
  <path d="M36 53 Q48 58.6 60.5 53" fill="none" stroke="#a9b2c2" stroke-width="0.5"/>

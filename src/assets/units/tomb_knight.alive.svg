  <path d="M42 50 L54 50 L55 72 L52.5 69.5 L50.5 73.5 L48 70 L45.5 73.5 L43.5 69.5 L41 72 Z" fill="url(#tk-tabard)" stroke="#0d0a12" stroke-width="1" stroke-linejoin="round"/>
  <path d="M43 52 L43.6 70 M53 52 L53.4 70" stroke="#c99a4a" stroke-width="0.7" opacity="0.85"/>
  <path d="M47 55 C46 61 46.5 66 45.8 71 M50 56 C50.5 62 50 66 50.6 72" stroke="#1d0d17" stroke-width="0.6" fill="none"/>
  <!-- tabard sigil: a small pale skull over crossed bones -->
  <path d="M45 66 L51.4 60.4 M45 60.4 L51.4 66" stroke="#d9cfb4" stroke-width="1" stroke-linecap="round"/>
  <path d="M45.6 59.6 Q48.2 56 50.8 59.6 Q51 62 49.6 62.6 L46.8 62.6 Q45.4 62 45.6 59.6 Z" fill="#e3dac0" stroke="#2d1424" stroke-width="0.5"/>
  <circle cx="47.2" cy="59.8" r="0.7" fill="#2d1424"/><circle cx="49.2" cy="59.8" r="0.7" fill="#2d1424"/>

  <!-- breastplate -->
  <path d="M34 34 Q48 29 62 34 L61 52 Q55 57 48 57 Q41 57 35 52 Z" fill="url(#tk-steel)" stroke="#0d0a12" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M48 31.5 L48 56.5" stroke="#2e3340" stroke-width="0.8"/>
  <path d="M47.2 32 L47.2 55.5" stroke="#dfe5ee" stroke-width="0.7" opacity="0.8"/>
  <path d="M37 38 Q42 35 46 35.5" fill="none" stroke="#eef2f8" stroke-width="1.1" stroke-linecap="round" opacity="0.85"/>
  <path d="M51 47 Q56 46 59.5 43" fill="none" stroke="#262a35" stroke-width="0.9" stroke-linecap="round"/>

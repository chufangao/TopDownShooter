<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Tomb Knight: a corroded knight risen from its barrow, soulfire in the visor. Lit from the upper left. -->
  <defs>
    <linearGradient id="tk-steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a7b0c0"/>
      <stop offset="0.45" stop-color="#6b7487"/>
      <stop offset="1" stop-color="#363b4b"/>
    </linearGradient>
    <linearGradient id="tk-steel-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7d8698"/>
      <stop offset="1" stop-color="#2a2e3b"/>
    </linearGradient>
    <linearGradient id="tk-cape" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2852"/>
      <stop offset="1" stop-color="#160f22"/>
    </linearGradient>
    <linearGradient id="tk-tabard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b2a44"/>
      <stop offset="1" stop-color="#2d1424"/>
    </linearGradient>
    <linearGradient id="tk-blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9eef6"/>
      <stop offset="0.5" stop-color="#9ea8b8"/>
      <stop offset="0.51" stop-color="#5d6676"/>
      <stop offset="1" stop-color="#3a404e"/>
    </linearGradient>
    <linearGradient id="tk-shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a4258"/>
      <stop offset="1" stop-color="#1f1b29"/>
    </linearGradient>
    <radialGradient id="tk-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d8fff0"/>
      <stop offset="0.35" stop-color="#5ef0c0"/>
      <stop offset="1" stop-color="#5ef0c0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- cape, behind everything, tattered at the hem -->
  <path d="M33 31 C27 44 24 62 21 82 L26 79 L29 86 L34 80 L38 87 L43 81 L48 86 L53 81 L58 87 L62 80 L67 86 L70 79 L75 82 C72 62 69 44 63 31 Z" fill="url(#tk-cape)" stroke="#0d0a12" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M30 50 C28 62 27 72 26 79 M35 58 C34 68 34 76 34 80 M64 56 C65 66 66 74 67 85 M68 48 C70 60 71 70 72 80" fill="none" stroke="#120b1b" stroke-width="0.8" opacity="0.8"/>
  <path d="M32 40 C29 52 27 64 25 76" fill="none" stroke="#5a4378" stroke-width="0.7" opacity="0.6"/>

  <!-- legs: greaves and sabatons -->
  <g stroke="#0d0a12" stroke-width="1.1" stroke-linejoin="round">
    <path d="M37 64 L46 64 L46.5 82 L37 82 Z" fill="url(#tk-steel)"/>
    <path d="M50 64 L59 64 L59 82 L49.5 82 Z" fill="url(#tk-steel-dark)"/>
    <path d="M34 82 Q34 79 37 79 L46 79 Q47.5 80 47.5 83 L47.5 88 L33 88 Q32 86 34 82 Z" fill="url(#tk-steel-dark)"/>
    <path d="M49 79 L59 79 Q62 79 62.5 83 Q63.5 86 62.5 88 L48.5 88 L48.5 83 Q48.5 80 49 79 Z" fill="#3b4150"/>
  </g>
  <!-- knee cops -->
  <ellipse cx="41.5" cy="71" rx="5.2" ry="3.6" fill="#8e98aa" stroke="#0d0a12" stroke-width="1"/>
  <ellipse cx="54.5" cy="71" rx="5" ry="3.5" fill="#596275" stroke="#0d0a12" stroke-width="1"/>
  <path d="M38 70 Q41.5 67.8 45 70" fill="none" stroke="#d3dae6" stroke-width="0.8"/>
  <circle cx="41.5" cy="71.3" r="0.9" fill="#2a2e3b"/><circle cx="54.5" cy="71.3" r="0.9" fill="#1d2029"/>
  <!-- sabaton lames and greave highlights -->
  <path d="M34.5 84 L47 84 M34 86 L47 86 M49 84 L62 84 M49 86 L62.5 86" stroke="#1a1d26" stroke-width="0.6"/>
  <path d="M38.5 75 L38.8 81" stroke="#c8d0dc" stroke-width="0.9" stroke-linecap="round"/>
  <path d="M57.5 75 L57.5 81" stroke="#232733" stroke-width="0.8"/>
  <!-- rust streaks -->
  <path d="M44 74 Q44.5 77 43.8 80 M52 66 Q52.6 69 52 72" stroke="#8a4b2a" stroke-width="0.7" fill="none" opacity="0.75"/>


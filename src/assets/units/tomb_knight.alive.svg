    <circle cx="79" cy="46" r="0.9"/><circle cx="78.6" cy="56" r="0.9"/><circle cx="76" cy="65" r="0.9"/>
    <circle cx="71.5" cy="73" r="0.9"/><circle cx="64" cy="75.6" r="0.9"/><circle cx="58.3" cy="66" r="0.9"/>
    <circle cx="57.4" cy="56" r="0.9"/><circle cx="57.4" cy="47" r="0.9"/>
  </g>
  <!-- painted sigil: bone-white skull with soulfire eyes, faded -->
  <path d="M61 50 Q67.5 42 74.5 49.5 Q75.5 55 72.5 57.5 L72.5 60.5 L63.5 61 L63.6 58 Q60.2 55.5 61 50 Z" fill="#d6cdb3" stroke="#0d0a12" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M62.3 50.5 Q67.5 44.5 73 49.6" fill="none" stroke="#f3ecd8" stroke-width="0.7"/>
  <path d="M63 52 Q65 50.5 67 52.3 Q66.5 55 64.4 54.9 Q62.8 54.2 63 52 Z" fill="#1a1622"/>
  <path d="M69 52.2 Q71 50.5 72.8 52 Q73 54.2 71.3 54.8 Q69.4 55 69 52.2 Z" fill="#1a1622"/>
  <circle cx="65" cy="52.8" r="1" fill="#5ef0c0"/><circle cx="70.9" cy="52.8" r="1" fill="#5ef0c0"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Tomb Knight, fallen: sprawled on its cape, helm dark, its sword driven into the earth as a grave marker. -->
  <defs>
    <linearGradient id="tkd-steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8d95a4"/>
      <stop offset="0.5" stop-color="#5a6172"/>
      <stop offset="1" stop-color="#2e323f"/>
    </linearGradient>
    <linearGradient id="tkd-steel-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a7283"/>
      <stop offset="1" stop-color="#252833"/>
    </linearGradient>
    <linearGradient id="tkd-blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9d0db"/>
      <stop offset="0.5" stop-color="#868f9e"/>
      <stop offset="0.51" stop-color="#4d5562"/>
      <stop offset="1" stop-color="#323742"/>
    </linearGradient>
    <linearGradient id="tkd-shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#433c50"/>
      <stop offset="1" stop-color="#1b1824"/>
    </linearGradient>
    <radialGradient id="tkd-cape" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2e2040"/>
      <stop offset="1" stop-color="#150e1e"/>
    </radialGradient>
  </defs>

  <!-- cape spread out under the body like a pool of shadow -->
  <path d="M14 78 Q16 68 30 66 Q46 63 62 66 Q76 68 82 76 Q85 84 76 89 L72 86 L69 91 L64 87 L59 92 L54 88 L48 92 L43 88 L37 92 L32 88 L26 91 L22 87 Q12 86 14 78 Z" fill="url(#tkd-cape)" stroke="#0d0a12" stroke-width="1.1" stroke-linejoin="round"/>
  <path d="M24 72 Q22 80 25 87 M40 68 Q38 78 40 89 M58 68 Q60 78 57 89 M72 72 Q75 80 71 87" fill="none" stroke="#0e0915" stroke-width="0.8"/>
  <path d="M30 68.5 Q44 65.5 58 67.5" fill="none" stroke="#4e3a68" stroke-width="0.6" opacity="0.7"/>

  <!-- the sword, planted in the ground behind the body -->
  <path d="M66.2 72 L68.8 34 Q69.4 31.5 70.3 31.6 Q71.2 31.8 71.2 34.4 L69.6 72.4 Z" fill="url(#tkd-blade)" stroke="#0d0a12" stroke-width="1" stroke-linejoin="round"/>
  <path d="M68.2 70 L70 35.5" stroke="#26292f" stroke-width="0.4"/>
  <path d="M67.3 69 L69.2 35.5" stroke="#eef1f5" stroke-width="0.45" opacity="0.7"/>
  <!-- runes gone cold -->
  <path d="M68.6 60 l-1 -1 l1.2 -0.6 M68.9 54.5 l-0.9 -1.2 M69.2 49 l0.9 -0.8 l-0.8 -1" fill="none" stroke="#5d6676" stroke-width="0.5" stroke-linecap="round"/>
  <!-- disturbed earth where the blade went in -->
  <path d="M62.5 72.6 Q68 70 73.5 72.6 Q68 75.4 62.5 72.6 Z" fill="#1a1520" stroke="#0d0a12" stroke-width="0.6"/>
  <path d="M63.4 72.3 Q66 71.4 68 71.6" fill="none" stroke="#3a3044" stroke-width="0.5"/>
  <!-- crossguard, grip, pommel -->
  <path d="M62.6 33.4 Q69.6 30.6 77 33.2 L76.6 35.2 Q69.6 33.2 62.8 35.6 Z" fill="#a17a3e" stroke="#0d0a12" stroke-width="0.9" stroke-linejoin="round"/>
  <path d="M63.4 33.8 Q69.6 31.6 76.4 33.8" fill="none" stroke="#d6b376" stroke-width="0.5"/>
  <circle cx="62.6" cy="34.6" r="1.3" fill="#8e6a32" stroke="#0d0a12" stroke-width="0.5"/>
  <circle cx="77" cy="34.2" r="1.3" fill="#8e6a32" stroke="#0d0a12" stroke-width="0.5"/>
  <path d="M70.2 31.8 L70.6 24" stroke="#3a2418" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M69.3 30 l1.8 -0.2 M69.4 28 l1.8 -0.2 M69.5 26 l1.8 -0.2" stroke="#5e412a" stroke-width="0.5"/>
  <circle cx="70.7" cy="22.4" r="1.8" fill="#a17a3e" stroke="#0d0a12" stroke-width="0.8"/>
  <circle cx="70.2" cy="21.9" r="0.55" fill="#e2c486"/>
  <!-- a torn strip of the crimson plume knotted to the hilt, hanging limp -->
  <path d="M71.4 27 Q75 26.6 76.2 29.6 Q77 33.5 75.4 37.4 L74.4 34.6 L73 38.6 L72.6 33.6 Q72.6 30.4 71.4 29 Z" fill="#62182a" stroke="#0d0a12" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M73 28.4 Q75.2 29.6 74.8 34" fill="none" stroke="#9c3248" stroke-width="0.5"/>

  <!-- legs, splayed toward the left, one knee bent -->
  <g stroke="#0d0a12" stroke-width="1" stroke-linejoin="round">
    <path d="M38 71 L25 66.5 L22.8 72.4 L36.4 77 Z" fill="url(#tkd-steel-dark)"/>
    <path d="M37.6 77.5 L24 80.2 L24.6 86.4 L38.4 83.6 Z" fill="url(#tkd-steel)"/>
    <!-- sabatons, toes up -->
    <path d="M25.4 65.6 Q21 63.6 17.8 66 Q16.6 69.2 19.2 71.6 L23.4 72.8 Z" fill="#363b48"/>
    <path d="M24.4 79.6 Q19.4 78.4 16.4 80.8 Q15.4 84.4 18 86.6 L24.8 86.8 Z" fill="url(#tkd-steel-dark)"/>
  </g>
  <ellipse cx="29.8" cy="69.4" rx="3.4" ry="4" fill="#5a6172" stroke="#0d0a12" stroke-width="0.9"/>
  <ellipse cx="30.4" cy="82" rx="3.6" ry="4" fill="#7f8899" stroke="#0d0a12" stroke-width="0.9"/>
  <path d="M28.6 79.6 Q30.4 78.2 32 79.8" fill="none" stroke="#c2c9d4" stroke-width="0.6"/>
  <path d="M19 81.6 L19.2 86 M21.2 81 L21.4 86.4 M19.8 66.4 L20.2 71 M22 66.2 L22.2 71.6" stroke="#1a1d26" stroke-width="0.5"/>
  <path d="M34 80 Q34.6 82.6 33.8 84.4" stroke="#7a4226" stroke-width="0.7" fill="none" opacity="0.75"/>

  <!-- tassets and the tabard, rucked up -->
  <path d="M41 68.6 L36.4 70.4 L36 84 L41.4 85.6 Z" fill="url(#tkd-steel)" stroke="#0d0a12" stroke-width="0.9" stroke-linejoin="round"/>
  <path d="M43 70 L33.6 74.2 L33.2 79.8 L43 81.6 Z" fill="#4f2238" stroke="#0d0a12" stroke-width="0.9" stroke-linejoin="round"/>
  <path d="M42.2 71.2 L34.6 75 M42.4 80.4 L34.4 78.8" stroke="#a78346" stroke-width="0.6" opacity="0.8"/>

  <!-- breastplate, facing the sky -->
  <path d="M42 67 Q44.5 64.6 53 64.6 Q61.2 64.8 63 67.6 L63.6 84.4 Q61 87.6 53 87.6 Q44.6 87.6 42 85 Z" fill="url(#tkd-steel)" stroke="#0d0a12" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M42.6 76.2 L63.2 76.2" stroke="#2a2e3a" stroke-width="0.8"/>
  <path d="M43.4 75.3 L62.4 75.3" stroke="#d5dbe4" stroke-width="0.6" opacity="0.8"/>
  <path d="M45 68 Q47 66.4 50 66.4" fill="none" stroke="#e6ebf2" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
  <!-- the killing blow: a crack through the plate -->
  <path d="M51.8 68.4 L54 72.6 L52.4 74.4 L55.6 79.6 L54 82.4" fill="none" stroke="#0d0a12" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M52.6 68.6 L54.6 72.4 L53.2 74.2 L56.2 79.2" fill="none" stroke="#c7cfdb" stroke-width="0.4"/>
  <path d="M57.4 70 Q58.6 73 57.6 76" stroke="#7a4226" stroke-width="0.7" fill="none" opacity="0.7"/>
  <path d="M46 82 q1.6 -1.1 2.8 0.5 q-0.6 1.4 -2.4 1.2 Z" fill="#4a7f6e" opacity="0.8"/>
  <!-- belt and buckle -->
  <path d="M42.2 70.2 L39.6 70.2 L39.6 82.2 L42.2 82.2 Z" fill="#33251e" stroke="#0d0a12" stroke-width="0.7"/>
  <rect x="38.9" y="74.4" width="3.2" height="3.6" rx="0.6" fill="#98713a" stroke="#0d0a12" stroke-width="0.5"/>

  <!-- arm flung up over the head, gauntlet open -->
  <path d="M58 65.6 Q60.8 60.6 66.6 61.2 Q69.4 63.2 67.6 67.4 Q63 69.6 59.4 68.8 Z" fill="url(#tkd-steel)" stroke="#0d0a12" stroke-width="1" stroke-linejoin="round"/>
  <path d="M60.4 63.4 Q63.4 61.6 66.4 62.4" fill="none" stroke="#dfe4ec" stroke-width="0.7"/>
  <path d="M51 66 L52.6 59 L57.6 59.8 L56.6 66.2 Z" fill="#6a7283" stroke="#0d0a12" stroke-width="0.9"/>
  <path d="M51.6 59.6 Q51.4 55.6 54.4 55 Q57.6 55.2 57.8 58.6 Q56 60.6 51.6 59.6 Z" fill="#7f8899" stroke="#0d0a12" stroke-width="0.9"/>
  <path d="M52.4 55.6 l-1.4 -2 M54.2 55 l-0.6 -2.4 M56 55.2 l0.4 -2.2" stroke="#0d0a12" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M52.4 55.6 l-1.4 -2 M54.2 55 l-0.6 -2.4 M56 55.2 l0.4 -2.2" stroke="#6a7283" stroke-width="0.8" stroke-linecap="round"/>
  <!-- other arm limp at the side -->
  <path d="M44 85.4 L50.6 85.8 L50.4 90 L43.6 89.6 Z" fill="#4c5364" stroke="#0d0a12" stroke-width="0.9"/>
  <path d="M50.4 85.6 Q54.6 85.4 55.6 88 Q54.6 91 50.6 90.4 Z" fill="#5a6172" stroke="#0d0a12" stroke-width="0.9"/>

  <!-- helm, still on, rolled toward the viewer: the visor dark -->
  <path d="M63.2 70 Q66 62.8 74 64 Q80.4 66.4 80.6 74 Q80 81.4 73.2 83.4 Q66 83.8 63.4 78.6 Z" fill="url(#tkd-steel)" stroke="#0d0a12" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M65.2 68.6 Q68 65.6 72 65.6" fill="none" stroke="#e4e9f0" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
  <path d="M65.8 73.4 Q72 70.6 79 72.4 L78.8 74.8 Q72 73 66 75.8 Z" fill="#08070c" stroke="#0d0a12" stroke-width="0.5"/>
  <path d="M72.4 75 L73.4 82.4 M74.6 74.6 L75.6 82" stroke="#08070c" stroke-width="1"/>
  <path d="M66.6 64.6 Q72 62 78.6 66" fill="none" stroke="#373c48" stroke-width="0.7"/>
  <!-- the plume's brass socket, empty -->
  <rect x="68.4" y="62" width="4" height="2.4" rx="0.7" fill="#98713a" stroke="#0d0a12" stroke-width="0.6" transform="rotate(-12 70.4 63.2)"/>
  <!-- a dent in the dome -->
  <path d="M75.4 67.4 Q77.6 68.6 77.2 70.6" fill="none" stroke="#1d2029" stroke-width="0.9"/>
  <!-- one last wisp of grey smoke from the visor -->
  <path d="M77 72 Q80 69 78.6 65.6 Q77.4 62.6 80.2 60" fill="none" stroke="#8b8798" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>

  <!-- the tower shield, fallen flat in front, its skull scratched and dull -->
  <path d="M2.6 86.4 Q4 80.6 14.8 79.6 Q26 79.2 30.4 82.8 Q31.6 87.6 24.6 90.6 Q14 93 5.4 91 Q2 89.4 2.6 86.4 Z" fill="url(#tkd-shield)" stroke="#0d0a12" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M4.2 86.4 Q5.4 81.8 14.8 81 Q25 80.6 29 83.4 Q29.8 87 24 89.4 Q14 91.6 6 90 Q3.6 88.8 4.2 86.4 Z" fill="none" stroke="#6b7384" stroke-width="1.2"/>
  <path d="M5 83.8 Q8 81.4 14.6 81" fill="none" stroke="#a9b1be" stroke-width="0.6"/>
  <g fill="#b9c0cc" stroke="#0d0a12" stroke-width="0.3">
    <circle cx="6.4" cy="83.4" r="0.7"/><circle cx="14.6" cy="81" r="0.7"/><circle cx="23.6" cy="81.4" r="0.7"/>
    <circle cx="28.6" cy="85.2" r="0.7"/><circle cx="22" cy="89.6" r="0.7"/><circle cx="12" cy="90.8" r="0.7"/><circle cx="5.2" cy="88.6" r="0.7"/>
  </g>
  <path d="M12.6 85.6 Q16.4 82.2 20.6 85.2 Q20.8 87.6 18.8 88.2 L14.2 88.2 Q12.2 87.6 12.6 85.6 Z" fill="#b2aa94" stroke="#0d0a12" stroke-width="0.6"/>
  <circle cx="15" cy="85.6" r="0.8" fill="#1a1622"/><circle cx="18.4" cy="85.6" r="0.8" fill="#1a1622"/>
  <path d="M10 84 L24 89.6" stroke="#0f0c16" stroke-width="0.8"/>
  <path d="M10.2 84.6 L23.8 90.2" stroke="#6e6680" stroke-width="0.35"/>

  <!-- scattered bone dust and pebbles -->
  <g fill="#3a3346" stroke="#0d0a12" stroke-width="0.4">
    <ellipse cx="86" cy="86" rx="1.6" ry="1"/><ellipse cx="34" cy="93" rx="1.4" ry="0.8"/><ellipse cx="80" cy="91" rx="1" ry="0.7"/>
  </g>
  <path d="M84.4 80.6 l3.2 1.2" stroke="#b9b09a" stroke-width="1.1" stroke-linecap="round"/>
</svg>

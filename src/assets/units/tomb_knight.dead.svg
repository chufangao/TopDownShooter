  <!-- Tomb Knight, fallen: flat on its back on its cape in a slick of grave-ichor, the great helm rolled back with X for
       eyes and the tongue out through the grille, the plume wilted; one pointed sabaton up in the air; the notched greatsword
       driven into the earth at its head as a grave marker; the shield dropped flat. Same parts, a shade greyer. -->
  <defs>

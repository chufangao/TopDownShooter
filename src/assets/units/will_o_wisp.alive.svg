<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Will-o'-Wisp: a sly marsh spirit, a teardrop of violet witchfire with a white-hot heart, dangling a rusted bog
       lantern to lure the lost. Goofy pass: a huge matched pair of googly eyes, both on the lost traveller, a sly crooked
       grin with one fang and the tongue tip out; the flame's tip flopped over like a cowlick;
       stubby little arms, the lantern far too big for it, a moth fussing round it; the tail curled just over the bog. -->
  <defs>
    <filter id="ww-ink" x="-6%" y="-6%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#1d1427"/><feComposite in2="SourceAlpha" operator="in"/><feOffset dx="1.1" dy="1.3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- bog mist under the tail (no ink) -->
  <path d="M30 88.4c0-.6 5-1.8 8-2s6.7.2 10 .6 10 1.1 10 1.6-6.7 1.4-10 1.6-7 .1-10-.2-8-1-8-1.6Z" fill="#c9c2d0" stroke="none" opacity=".5"/>
  <!-- a witchfire mote over its palm (no ink) -->
  <path d="M80.1 43.3l-2.4-1.8-2.3.2 1.1-2-.8-3.3 2.6 2.1 2.5-.3-1.3 2.1Z" fill="#8ef4f0" stroke="none" opacity=".9"/>
  <g filter="url(#ww-ink)" stroke="#1d1427" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <!-- the flame: a lumpy teardrop, its tip flopped over like a cowlick, licks of different sizes --><path d="M30 40c.5-3 .5-7 1.4-10s3.7-5.3 4.2-8-1-8-1-8 4.6 5.3 6.4 4.6 2.7-7 4.6-9 4.5-3 7-3.2 5.8 1 7.8 2.2 4 5 4 5-4.5-.7-5.8 0-3.2 2.6-2.2 4 5.8 2.3 8 4.4 4 5 5.2 8 1.6 6.3 2 10 .9 8.3.4 12-1.7 7-3.4 10-4.3 5.8-6.6 8-5.2 3.8-7.4 5.4-4.1 2.5-5.6 4-3.6 5.2-3.6 5.2-1-3-1.8-4.6-1.2-3.2-3-5-5.6-3.3-7.6-6-3.6-6.5-4.4-10-.4-7.8-.2-11 1.1-5 1.6-8Z" fill="#b8a2f6"/><path d="M69.4 46c.3 1 .1 6.8-.8 10s-2.4 6.3-4.6 9-6.2 5.3-8.4 7-5.2 3.9-5 3 4.3-5.6 6.4-8.4 4.7-5.8 6.4-8.6 2.6-6 3.6-8 2.1-5 2.4-4Z" fill="#7e66d6" stroke="none"/><path d="M33 46c-.3-1.6.5-6.5 1.6-9.4s4.3-8.1 4.8-8-1.3 5.5-1.8 8.4-.2 7.5-1 9-3.3 1.6-3.6 0Z" fill="#dcd0ff" stroke="none"/><!-- the white-hot heart, low in the belly --><path d="M38.6 70c-.7-2.2 1.8-4.2 3.4-5.4s3.8-1.6 6-1.6 5.2.5 7 1.6 3.9 3 3.6 5-3.5 5.5-5.6 6.8-4.6 2.3-7 1.2-6.7-5.4-7.4-7.6Z" fill="#d6caff" stroke="none"/><path d="M43.6 72.4c-.5-1.3 1.1-3.4 2-4.8s2.3-3.6 3.4-3.6 2.6 2.2 3.4 3.6 1.8 3.5 1.2 4.8-3.3 3-5 3-4.5-1.7-5-3Z" fill="#f6f2ff" stroke-width="1.5"/><path d="M48.7 68.8c.7-.1 1.6.6 1.9 1.1s.3 1.3.2 2-.7 1.6-1.3 1.7-1.8-.3-2.3-.9-.6-1.9-.4-2.5 1.3-1.4 1.9-1.4Z" fill="#8ef4f0" stroke="none"/>
    <!-- huge googly eyes: a matched pair, both on the lost traveller -->
    <path d="M41.8 36.4c1.8-.3 3.8.3 4.9 1.8s1.9 5.3 1.2 7.2-4.1 3.9-5.8 4.2-3.4-.6-4.5-2.2-2.3-5.5-1.6-7.3 4-3.4 5.8-3.7Z" fill="#ffffff" stroke-width="1.8"/><path d="M44.5 40.5c1-.3 2.7 1.1 3.2 2s.4 2.3-.5 3-3.5 1.2-4.4.9-1.5-1.5-1.2-2.5 1.9-3.2 2.9-3.4Z" fill="#5ac8e8" stroke="none"/><path d="M55.4 36.6c1.8-.3 3.8.3 4.9 1.8s1.9 5.3 1.2 7.2-4.1 3.9-5.8 4.2-3.4-.6-4.5-2.2-2.3-5.5-1.6-7.3 4-3.4 5.8-3.7Z" fill="#ffffff" stroke-width="1.8"/><path d="M58.1 40.7c1-.3 2.7 1.1 3.2 2s.4 2.3-.5 3-3.5 1.2-4.4.9-1.5-1.5-1.2-2.5 1.9-3.2 2.9-3.4Z" fill="#5ac8e8" stroke="none"/>
    <path d="M44.7 42.2c.4 0 1.1.3 1.4.7s.5 1.2.3 1.6-.8.9-1.3 1-1-.1-1.3-.5-.2-1.3-.1-1.8 .6-.9 1-1Zm13.6.2c.4 0 1.1.3 1.4.7s.5 1.2.3 1.6-.8.9-1.3 1-1-.1-1.3-.5-.2-1.3-.1-1.8 .6-.9 1-1Z" fill="#1d1427" stroke="none"/>
    <path d="M43.9 42.2l.8-.3m12.8.5l.8-.3" fill="none" stroke="#ffffff" stroke-width="1.2"/>
    <!-- brows: one hiked, one sly and low -->
    <path d="M35.4 34c2.4-3.4 7.2-4 10.8-1.6m3.2 2c4-2 9-2 13 .2" fill="none" stroke-width="2.5"/>
    <!-- a sly crooked grin, one fang, the tongue tip out -->
    <path d="M44.4 56.4c.2-.5 4.2 1.9 6.6 2s5.4-.5 7.6-1.4 4.7-3.9 5.4-3.8 .1 3-1 4.4-3.2 3.3-5.4 4-5.4.9-7.6 0-5.8-4.7-5.6-5.2Z" fill="#3b1630" stroke-width="1.5"/>
    <path d="M57 57.4l1 3.2 1.6-3.6Z" fill="#ffffff" stroke-width="1"/>
    <path d="M50.6 60c.5-.4 2.4-.4 3 0s1 2 .8 2.6-1.4 1-2 1-1.3-.6-1.6-1.2-.7-2-.2-2.4Z" fill="#e88aa8" stroke-width="1.1"/>
    <!-- little arms: one dangling the lantern, one waving -->
    <path d="M31.6 56c-.9-.1-3.1 1.7-4.2 2.6s-2.3 2.2-2.4 3 1.2 2 2 1.8 1.6-2.1 2.6-2.8 3.1-.4 3.4-1.2-.5-3.3-1.4-3.4Z" fill="#b8a2f6"/>
    <path d="M68.6 50c.3-1.1 2.9-1.5 4-2.4s1.6-2.8 2.4-3.2 2.4.2 2.6 1-.5 2.6-1.6 4-3.8 4.5-5 4.6-2.7-2.9-2.4-4Z" fill="#b8a2f6"/>
    <g transform="translate(0 0) rotate(0 24 60)"><!-- the rusted bog lantern, too big for it, its pane cracked --><path d="M19.4 63.4c-.8-.4 3.1-2.4 4.6-2.4s5.4 2 4.6 2.4-8.4.4-9.2 0Z" fill="none" stroke-width="1.6"/><path d="M18 64.6l12-.6 .6 2.6-13 .6Z" fill="#7a6a64" stroke-width="1.8"/><path d="M19 67l10.6-.4 .8 10-11.8.8Z" fill="#e8f0a0" stroke-width="1.8"/><path d="M21.6 75c-.9-.7-.6-2.9-.2-4s1.7-2.5 2.6-2.4 2.4 1.7 2.8 2.8 .7 3.4-.2 4-4.1.3-5-.4Z" fill="#fffbe0" stroke="none"/><path d="M27.4 67.6l2-.2 .4 8.6-2 .2Z" fill="#b8c46a" stroke="none"/><path d="M24.2 67l.2 10m-3.8-6.4l2 1.8-1.2 1.6" fill="none" stroke-width="1"/><path d="M17 76.6l14.2-.6 .4 3-14.2.6Z" fill="#7a6a64" stroke-width="1.8"/><path d="M28.5 77.1c.5-.1 1.4.1 1.7.3s.6.6.4.8-.8.6-1.3.7-1.3-.1-1.6-.3-.3-.7-.1-1 .5-.5.9-.5Z" fill="#a8693e" stroke="none"/></g>
    <!-- a moth, fussing at the lantern -->
    <path d="M13.6 70c-.6-.2-2.1-2.1-2.6-3s-.9-2.3-.6-2.6 1.9.4 2.6 1 1.3 1.8 1.4 2.6-.2 2.2-.8 2Z" fill="#e8dcc0" stroke-width="1"/>
    <path d="M14.6 70.4c0-.7.5-2.9 1-3.8s1.7-1.8 2-1.6 .3 2.1 0 3-1.5 2.2-2 2.6-1 .5-1-.2Z" fill="#e8dcc0" stroke-width="1"/>
    <path d="M13.9 69.2c.3 0 .9.3 1.1.6s.2 1 .1 1.3-.5.8-.8.8-.7 0-.8-.4-.3-1.2-.2-1.6 .3-.7.6-.7Z" fill="#6a5a54" stroke-width=".8"/>
  </g>
</svg>

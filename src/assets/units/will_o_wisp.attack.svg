    <g transform="translate(4 2) rotate(10 48 84)"><!-- eyes: both popped wide --><path d="M40.6 34.6c1.8-.3 4 .3 5 1.9s2.1 5.5 1.3 7.4-4.2 4-6 4.3-3.5-.6-4.6-2.2-2.4-5.7-1.7-7.6 4.2-3.5 6-3.8Z" fill="#ffffff" stroke-width="1.8"/><path d="M43.6 38.3c1-.2 2.6 1.1 3.1 1.9s.3 2.2-.5 2.8-3.3 1.2-4.2.9-1.4-1.5-1.1-2.4 1.8-3 2.7-3.2Z" fill="#5ac8e8" stroke="none"/><path d="M54.2 34.8c1.8-.3 4 .3 5 1.9s2.1 5.5 1.3 7.4-4.2 4-6 4.3-3.5-.6-4.6-2.2-2.4-5.7-1.7-7.6 4.2-3.5 6-3.8Z" fill="#ffffff" stroke-width="1.8"/><path d="M57.2 38.5c1-.2 2.6 1.1 3.1 1.9s.3 2.2-.5 2.8-3.3 1.2-4.2.9-1.4-1.5-1.1-2.4 1.8-3 2.7-3.2Z" fill="#5ac8e8" stroke="none"/><path d="M43.4 39.6c.5 0 1.3.3 1.6.7s.5 1.3.3 1.7-.9 1-1.4 1.1-1.1-.1-1.3-.5-.3-1.4-.2-1.9 .6-1 1-1.1Zm13.6.2c.5 0 1.3.3 1.6.7s.5 1.3.3 1.7-.9 1-1.4 1.1-1.1-.1-1.3-.5-.3-1.4-.2-1.9 .6-1 1-1.1Z" fill="#1d1427" stroke="none"/><path d="M42.6 39.8l.8-.3m12.8.5l.8-.3" fill="none" stroke="#ffffff" stroke-width="1.2"/><path d="M33.8 32.2c2.6-3 7.6-3.8 11.4-1.8m4 .2c4.2-2.2 9.6-2 13.8 1" fill="none" stroke-width="2.5"/><!-- a cackle: mouth flung open, the fang, the tongue --><path d="M44 55.4c.9-.5 4.6 1.6 7 1.6s5.2-.6 7.6-1.4 5.7-4.2 6.8-3.6 .7 5.2-.4 7.4-4 5.1-6.4 6-6 .5-8.2-.4-3.7-3.4-4.8-5-2.5-4.1-1.6-4.6Z" fill="#3b1630" stroke-width="1.6"/><path d="M57 56l1 3.4 1.6-3.8Z" fill="#ffffff" stroke-width="1"/><path d="M50 61.4c.7-.5 3.7-1.1 5-.8s2.8 1.7 2.6 2.4-2.8 1.5-4 1.6-2.4-.5-3-1-1.3-1.7-.6-2.2Z" fill="#e88aa8" stroke-width="1.1"/></g>
    <!-- the little arm flung out, the bolt leaving its palm -->
    <path d="M68 52c.7-1.2 3.8-1.4 5.4-2s3.3-1.7 4.2-1.4 1.6 2.4 1 3.4-3 1.8-4.6 2.6-4 2.8-5 2.4-1.7-3.8-1-5Z" fill="#b8a2f6"/>
  </g>
  <path d="M89.6 50.7l0-1.5-2.2-1 2.4-.4 .3-1.7 1 1.5 2.4-.7-1.8 1.8 .9 1.8-1.8-.8Z" fill="#ffffff" stroke="none" opacity="1"/>

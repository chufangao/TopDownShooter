  <path d="M78 40l4-4 2 3.4 4-4.4" fill="none" stroke="#8ef4f0" stroke-width="1.4" opacity=".9"/>
  <path d="M78 58l4 3.6 3-3 4 3.4" fill="none" stroke="#8ef4f0" stroke-width="1.4" opacity=".9"/>

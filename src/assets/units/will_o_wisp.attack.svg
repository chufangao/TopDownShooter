<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Will-o'-Wisp, casting Witchfire: the flame flares high and lunges right, flinging a crackling bolt from its palm;
       the lantern swings back wide on its chain; both eyes popped wide, cackling. Same parts as the alive
       picture. -->
  <defs>
    <filter id="wwa-ink" x="-6%" y="-6%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#1d1427"/><feComposite in2="SourceAlpha" operator="in"/><feOffset dx="1.1" dy="1.3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- the speed of the lunge (no ink) -->
  <path d="M8 46l12 .6m-14 9.4l12 .4" fill="none" stroke="#c9c2d0" stroke-width="1.8" opacity=".6"/>
  <!-- the Witchfire bolt (no ink) -->
  <path d="M72 48c.7-2 5.3-4.6 8-5.4s6-.4 8 .4 4.2 4.6 4.2 4.6-4.1.8-4.2 1.8 3.6 4.2 3.6 4.2-5 .2-7.6.4-6 1.6-8 .6-4.7-4.6-4-6.6Z" fill="#b8a2f6" stroke="none" opacity=".9"/>

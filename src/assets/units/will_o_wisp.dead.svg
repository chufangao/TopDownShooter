<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Will-o'-Wisp, snuffed out: the rusted lantern on its side in a bog puddle inside a scorched ring, a coil of grey
       smoke rising from its cracked pane; beside it all that is left, a last dim ember of witchfire with its eyes spun to
       spirals and its tongue out. -->
  <defs>
    <filter id="wwd-ink" x="-6%" y="-6%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#1d1427"/><feComposite in2="SourceAlpha" operator="in"/><feOffset dx="1.1" dy="1.3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- the bog puddle and the scorched ring -->
  <path d="M8 88.4c-.3-1.3.7-3 6-3.8s16.3-.9 26-1 23.8 0 32 .4 13.8 1.1 17 2 3.8 2.3 2 3.4-5.5 2.5-13 3.2-21.7.8-32 .8-23.7 0-30-.8-7.7-2.9-8-4.2Z" fill="#2c3a30" stroke="none"/>
  <path d="M14 88c10-3 56-3.4 70 0" fill="none" stroke="#5a4a6a" stroke-width="1.4" opacity=".9"/>
  <!-- smoke from the cracked pane (no ink) -->
  <path d="M66 70c-4-6 2-10-2-16-2-4 1-8-.6-12" fill="none" stroke="#a39cab" stroke-width="2" opacity=".8"/>
  <g filter="url(#wwd-ink)" stroke="#1d1427" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <g transform="translate(44 9) rotate(90 24 60)"><!-- the rusted bog lantern, too big for it, its pane cracked --><path d="M19.4 63.4c-.8-.4 3.1-2.4 4.6-2.4s5.4 2 4.6 2.4-8.4.4-9.2 0Z" fill="none" stroke-width="1.6"/><path d="M18 64.6l12-.6 .6 2.6-13 .6Z" fill="#6a5a54" stroke-width="1.8"/><path d="M19 67l10.6-.4 .8 10-11.8.8Z" fill="#8a8e7a" stroke-width="1.8"/><path d="M27.4 67.6l2-.2 .4 8.6-2 .2Z" fill="#6a6e5a" stroke="none"/><path d="M24.2 67l.2 10m-3.8-6.4l2 1.8-1.2 1.6" fill="none" stroke-width="1"/><path d="M17 76.6l14.2-.6 .4 3-14.2.6Z" fill="#6a5a54" stroke-width="1.8"/><path d="M28.5 77.1c.5-.1 1.4.1 1.7.3s.6.6.4.8-.8.6-1.3.7-1.3-.1-1.6-.3-.3-.7-.1-1 .5-.5.9-.5Z" fill="#a8693e" stroke="none"/></g>
    <!-- a reed or two -->
    <path d="M20 86c-1-6 0-12-1.4-18m5.4 18c.4-5 2-9 1.4-13" fill="none" stroke="#6a7a4a" stroke-width="1.6"/>
    <!-- the last ember, eyes spun -->
    <g transform="translate(36 75) rotate(-78) scale(.56) translate(-50 -46)"><!-- the flame: a lumpy teardrop, its tip flopped over like a cowlick, licks of different sizes --><path d="M30 40c.5-3 .5-7 1.4-10s3.7-5.3 4.2-8-1-8-1-8 4.6 5.3 6.4 4.6 2.7-7 4.6-9 4.5-3 7-3.2 5.8 1 7.8 2.2 4 5 4 5-4.5-.7-5.8 0-3.2 2.6-2.2 4 5.8 2.3 8 4.4 4 5 5.2 8 1.6 6.3 2 10 .9 8.3.4 12-1.7 7-3.4 10-4.3 5.8-6.6 8-5.2 3.8-7.4 5.4-4.1 2.5-5.6 4-3.6 5.2-3.6 5.2-1-3-1.8-4.6-1.2-3.2-3-5-5.6-3.3-7.6-6-3.6-6.5-4.4-10-.4-7.8-.2-11 1.1-5 1.6-8Z" fill="#8a80a8"/><path d="M69.4 46c.3 1 .1 6.8-.8 10s-2.4 6.3-4.6 9-6.2 5.3-8.4 7-5.2 3.9-5 3 4.3-5.6 6.4-8.4 4.7-5.8 6.4-8.6 2.6-6 3.6-8 2.1-5 2.4-4Z" fill="#5e5684" stroke="none"/><path d="M33 46c-.3-1.6.5-6.5 1.6-9.4s4.3-8.1 4.8-8-1.3 5.5-1.8 8.4-.2 7.5-1 9-3.3 1.6-3.6 0Z" fill="#aaa2c8" stroke="none"/><!-- the white-hot heart, low in the belly --><path d="M38.6 70c-.7-2.2 1.8-4.2 3.4-5.4s3.8-1.6 6-1.6 5.2.5 7 1.6 3.9 3 3.6 5-3.5 5.5-5.6 6.8-4.6 2.3-7 1.2-6.7-5.4-7.4-7.6Z" fill="#a49cc0" stroke="none"/><path d="M43.6 72.4c-.5-1.3 1.1-3.4 2-4.8s2.3-3.6 3.4-3.6 2.6 2.2 3.4 3.6 1.8 3.5 1.2 4.8-3.3 3-5 3-4.5-1.7-5-3Z" fill="#c9c4d8" stroke-width="1.5"/><path d="M48.7 68.8c.7-.1 1.6.6 1.9 1.1s.3 1.3.2 2-.7 1.6-1.3 1.7-1.8-.3-2.3-.9-.6-1.9-.4-2.5 1.3-1.4 1.9-1.4Z" fill="#9ab8b6" stroke="none"/><!-- eyes spun to spirals --><path d="M40.3 37c1.6-.3 4.9.6 6.2 1.9s2.1 4.1 1.6 5.7-3.1 3.8-4.9 4.2-4.9-.4-6-1.7-1.1-4.9-.6-6.6 2-3.2 3.7-3.5Z" fill="#e4e0f0" stroke-width="1.5"/><path d="M42 43l.2.1-.1.3-.3.2-.5-.1-.4-.5 .1-.8 .5-.6 1-.2 1 .5 .6 1.1-.2 1.4-1.1 1-1.7.2-1.5-.8-.8-1.8 .4-2 1.7-1.4 2.3-.2 2.1 1.2 1 2.4-.7 2.6-2.2 1.9" fill="none" stroke-width="1.3"/><path d="M53.9 37.2c1.6-.3 4.9.6 6.2 1.9s2.1 4.1 1.6 5.7-3.1 3.8-4.9 4.2-4.9-.4-6-1.7-1.1-4.9-.6-6.6 2-3.2 3.7-3.5Z" fill="#e4e0f0" stroke-width="1.5"/><path d="M55.6 43.2l.2.1-.1.3-.3.2-.5-.1-.4-.5 .1-.8 .5-.6 1-.2 1 .5 .6 1.1-.2 1.4-1.1 1-1.7.2-1.5-.8-.8-1.8 .4-2 1.7-1.4 2.3-.2 2.1 1.2 1 2.4-.7 2.6-2.2 1.9" fill="none" stroke-width="1.3"/><path d="M45 56c.3-.4 4.5 1.4 7 1.4s7.2-1.7 8-1.4-1.3 2.8-3 3.4-5 .8-7 .2-5.3-3.2-5-3.6Z" fill="#3b1630" stroke-width="1.4"/><path d="M52.6 58.4c.5-.8 2.7-.9 3.4-.4s1.1 2.4 1 3.4-.9 2.4-1.6 2.6-1.9-.5-2.4-1.4-.9-3.4-.4-4.2Z" fill="#c9708e" stroke-width="1.2"/></g>
  </g>
</svg>
